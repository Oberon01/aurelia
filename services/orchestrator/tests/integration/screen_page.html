<!doctype html>
<html><head><meta charset="utf-8"><title>Test videos</title>
<style>
body{font:16px sans-serif;margin:16px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(3,260px);gap:12px}
.card{display:block;border:1px solid #ccc;padding:10px;height:60px}
#player{width:480px;height:270px;background:#000;position:relative}
#player video{width:480px;height:270px}
.tall{height:1600px}
</style></head>
<body>
<form id="search" action="/results" onsubmit="event.preventDefault(); location.hash='searched=' + encodeURIComponent(this.q.value)">
  <input name="q" type="text" placeholder="Search videos"><button type="submit">Search</button>
</form>
<div class="grid">
  <a class="card" href="#video-1" onclick="document.title='Watching first video'">First video</a>
  <a class="card" href="#video-2" onclick="document.title='Watching second video'">Second video</a>
  <a class="card" href="#video-3" onclick="document.title='Watching third video'">Third video</a>
</div>
<p><button id="order" onclick="document.title='ORDER PLACED'">Place order</button>
   <button id="like" onclick="this.textContent='Liked'">Like</button></p>
<form id="chat" onsubmit="event.preventDefault(); document.title='SENT: ' + this.msg.value">
  <textarea name="msg" aria-label="Message" onkeydown="if(event.key==='Enter'){event.preventDefault(); this.form.requestSubmit()}"></textarea>
  <button type="submit">Send</button>
</form>
<p><input type="password" name="pw" aria-label="Password"></p>
<div id="player"><video id="v" src="clip.webm" muted loop></video></div>
<div class="tall"></div>
<a id="bottom" href="#bottom-link">Link at the bottom</a>
<script>
  // A page trying to fool her: this changes the page's own world, not hers.
  document.querySelectorAll = () => [];
  Element.prototype.getBoundingClientRect = function () { return { width: 0, height: 0, top: 0, left: 0, right: 0, bottom: 0 }; };
</script>
</body></html>
