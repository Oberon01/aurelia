// Pairing and revoking happen only here, from your click; Aurelia can list devices but has no tool to let one in or out.
function devicesView(list) {
  const box = el("div", "devlist");
  if (!list.length) { box.append(el("div", "lib-note", "Nothing paired yet.")); return box; }
  const KIND = { browser: "browser", node: "computer", terminal: "terminal", screen: "screen" };
  const PHONES = /iPhone|iPad|iOS|Android/;
  const kindOf = d => d.kind !== "browser" ? (KIND[d.kind] || d.kind)        // what it is, as he'd say it
    : d.window ? "Aurelia window" : PHONES.test(d.os || "") || d.role === "companion" ? (d.app ? "phone app" : "phone")
    : d.app ? "app" : "browser";
  const rename = (d, name) => {                          // what you call it out loud: "the TV PC", "the desk"
    const input = el("input"); input.type = "text"; input.value = d.name; input.maxLength = 60;
    input.setAttribute("aria-label", "New name"); input.className = "rn";
    const save = async () => {
      const v = input.value.trim();
      if (!v || v === d.name) { input.replaceWith(name); return; }
      try {
        const r = await fetch(`/devices/${d.id}/rename`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                           body: JSON.stringify({ name: v }) });
        if (!r.ok) throw new Error();
        d.name = v; name.firstChild.textContent = v; say(`It's called ${v} now.`);
      } catch (e) { say("Couldn't rename it."); }
      input.replaceWith(name);
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") save(); if (e.key === "Escape") input.replaceWith(name); });
    input.addEventListener("blur", save);
    name.replaceWith(input); input.focus(); input.select();
  };
  const rows = new Map();
  list.forEach(d => {
    const row = el("div", "pdev " + d.status + (d.kind === "node" ? (d.online ? " online" : " offline") : ""));
    const name = el("span", "dn"); name.append(document.createTextNode(d.name));
    const bits = [kindOf(d), d.os, d.browser && d.kind === "browser" ? null : d.hostname,
                  d.status === "pending" ? `waiting · code ${d.code}` : d.status === "revoked" ? "revoked" :
                  d.kind === "node" && d.agent_version ? `agent ${d.agent_version}${d.outdated ? ` (updating to ${d.outdated})` : ""}` : null,
                  d.kind === "node" && d.shell === "on" ? "shell on" : null,
                  d.kind === "node" && d.online ? "online" :
                  d.last_seen ? `${d.kind === "node" ? "offline · " : ""}seen ${d.last_seen}` : "not seen yet"].filter(Boolean);
    const btns = el("span", "db");
    if (d.status === "approved" && (d.roles || []).length) {        // what it's for: only you set this, here
      const sel = el("select", "role"); sel.setAttribute("aria-label", `What ${d.name} is for`);
      d.roles.forEach(r => { const o = el("option", null, r[0].toUpperCase() + r.slice(1) + (r === d.role && !d.role_chosen ? " (auto)" : ""));
                             o.value = r; o.selected = r === d.role; sel.append(o); });
      sel.addEventListener("change", async () => {
        try {
          const r = await fetch(`/devices/${d.id}/role`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                           body: JSON.stringify({ role: sel.value }) });
          if (!r.ok) throw new Error();
          d.role = sel.value; d.role_chosen = true;
          [...sel.options].forEach(o => { o.textContent = o.value[0].toUpperCase() + o.value.slice(1); });
          say(`${d.name} is a ${sel.value} device now.`);
        } catch (e) { sel.value = d.role; say("Couldn't change that."); }
      });
      btns.append(sel);
    }
    if (d.status === "approved") {
      const rn = el("button", "btn quiet", "Rename"); rn.type = "button";
      rn.addEventListener("click", () => rename(d, name));
      btns.append(rn);
      const rv = el("button", "btn quiet", "Revoke"); rv.type = "button";
      rv.addEventListener("click", async () => {
        if (rv.dataset.sure !== "1") { rv.dataset.sure = "1"; rv.textContent = `Revoke ${d.name}?`; rv.classList.add("primary");
                                       setTimeout(() => { if (rv.isConnected && !rv.disabled) { rv.dataset.sure = ""; rv.textContent = "Revoke"; rv.classList.remove("primary"); } }, 5000);
                                       return; }
        rv.disabled = true;
        try {
          const r = await fetch(`/devices/${d.id}/revoke`, { method: "POST" });
          if (!r.ok) throw new Error();
          row.style.transition = "opacity .35s ease"; row.style.opacity = "0";
          setTimeout(() => {                                   // gone from the list, not greyed out
            const panel = row.closest(".panel"); row.remove();
            const h = panel && panel.querySelector(".headline"), list = box.querySelectorAll(".pdev");
            const live = box.querySelectorAll(".pdev.approved").length, waiting = box.querySelectorAll(".pdev.pending").length;
            if (h && /paired/.test(h.textContent)) h.textContent = `${live} paired` + (waiting ? ` · ${waiting} waiting` : "");
            if (!list.length) box.append(el("div", "lib-note", "Nothing paired yet."));
          }, 360);
          say(`${d.name} is revoked. It can't reach me anymore.`);
        } catch (e) { rv.disabled = false; say("Couldn't revoke it."); }
      });
      btns.append(rv);
    }
    row.append(name, el("span", "dm", bits.join(" · ")), btns);
    if (d.kind === "node" && d.vitals && d.online) {             // how it's doing, from its last check-in
      const v = d.vitals, disk = (v.disks || []).reduce((m, x) => Math.max(m, x.used || 0), 0);
      row.append(el("span", "dv", [`CPU ${v.cpu ?? "?"}%`, `memory ${v.memory ?? "?"}%`, v.disks && v.disks.length ? `disk ${disk}%` : null,

      (d.issues || []).forEach(i => row.append(el("span", "di " + (i.level || ""), i.text)));
    }
    rows.set(d.id, { row, name });

  });
  fetch("/devices").then(r => r.ok ? r.json() : null).then(out => {       // mark the device you're looking from
    const me = out && (out.devices || []).find(x => x.this_device);
    if (me && rows.has(me.id)) rows.get(me.id).name.append(el("small", null, "THIS DEVICE"));
  }).catch(() => {});
  return box;
}

// One question at a time is slower to read than a column you can scan; all are shown, each answers on click.
function quizView(q) {
  const box = el("div", "quiz");
  let answered = 0, right = 0;
  const missed = [];
  const score = el("div", "qscore");
  q.questions.forEach((item, i) => {
    const z = el("div", "qz");
    z.append(el("div", "qq", `${i + 1}. ${item.q}`));
    const opts = el("div", "qo");
    const why = el("div", "why"); why.hidden = true;
    item.options.forEach((o, k) => {
      const b = el("button", "opt", o); b.type = "button";
      b.addEventListener("click", () => {
        opts.querySelectorAll("button").forEach((x, j) => { x.disabled = true; if (j === item.answer) x.classList.add("qright"); });
        if (k !== item.answer) { b.classList.add("qwrong"); missed.push(item.q); } else right++;
        why.textContent = (k === item.answer ? "Right. " : "Not quite. ") + (item.why || ""); why.hidden = false;
        if (++answered === q.questions.length) finish();
      });
      opts.append(b);
    });
    z.append(opts, why);
    box.append(z);
  });
  const finish = async () => {
    score.textContent = `${right} of ${q.questions.length}`;
    box.append(score);
    try {
      const r = await fetch("/learning/quiz", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject: q.subject, topic_id: q.topic_id, score: right, total: q.questions.length, missed }) });
      const out = await r.json();
      if (out.proposed) box.append(el("div", "more", "Nicely done. It's in your mailbox as something you know."));
      else if (right < q.questions.length) box.append(el("div", "more", "Ask me to explain the ones you missed."));
    } catch (e) { /* the score still shows */ }
  };
  return box;
}

// Probe: every function at a glance, and one in detail.
function statusPill(status, text) { return el("span", "pill " + status, text || status.replace(/_/g, " ")); }
function usage(runs, failed, last) {
  const bits = [];
  bits.push(runs ? `${runs} run${runs === 1 ? "" : "s"} this week${failed ? ` (${failed} failed)` : ""}` : "not used this week");
  if (last) bits.push(`last used ${last}`);

// A screen, live: a few frames a second while this panel is open and on screen. Clicking it pauses.
// The panel says it's still wanted every few seconds; when it closes (or the tab is hidden), the
// computer stops sending within seconds.
function liveView(lv) {
  const box = el("div", "live"), scr = el("div", "screen"), img = new Image(), wait = el("div", "wait", "Waiting for the screen…");
  img.alt = `${lv.node}, live`; img.style.visibility = "hidden";
  scr.append(img, wait);
  const left = el("span"), right = el("span");
  const bar = el("div", "lbar"); bar.append(left, right);
  box.append(scr, bar);
  let paused = false, lastKeep = 0, busy = false, shown = 0, stopped = false, url = null;
  const base = `/constellation/live/${lv.node_id}`;
  const say = (text, cls) => { left.textContent = ""; left.append(el("span", "dot"), document.createTextNode(text));
                               box.classList.toggle("paused", cls === "paused"); box.classList.toggle("stale", cls === "stale"); };
  say(`${lv.node} · starting`, "stale");
  scr.addEventListener("click", () => { paused = !paused; if (!paused) lastKeep = 0; say(paused ? `${lv.node} · paused (tap to resume)` : `${lv.node} · resuming`, paused ? "paused" : ""); });
  async function keep() {
    try {
      const r = await fetch(`${base}/keep`, { method: "POST", cache: "no-store" });
      if (r.status === 403 || r.status === 404) { stopped = true; wait.textContent = r.status === 403 ? "This device can't watch screens." : "That computer is gone."; return; }
      const m = await r.json();
      right.textContent = [m.site, m.title].filter(Boolean).join(" · ");
      if (!m.online) { wait.textContent = `${lv.node} is offline.`; wait.style.display = ""; }
      else if (m.problem && !shown) { wait.textContent = `${lv.node}: ${m.problem}`; wait.style.display = ""; }
      else if (m.problem) right.textContent = m.problem;
    } catch (e) {}
  }
  async function tick() {
    if (stopped || !box.isConnected) { if (url) URL.revokeObjectURL(url); return; }
    const visible = document.visibilityState === "visible";
    if (!paused && visible) {
      if (Date.now() - lastKeep > 4000) { lastKeep = Date.now(); keep(); }
      if (!busy) {
        busy = true;
        try {
          const r = await fetch(`${base}/frame.jpg`, { cache: "no-store" });
          if (r.status === 200) {
            const next = URL.createObjectURL(await r.blob());
            img.src = next; try { await img.decode(); } catch (e) {}
            if (url) URL.revokeObjectURL(url);
            url = next; shown = Date.now(); img.style.visibility = ""; wait.style.display = "none";
          }
        } catch (e) {}
        busy = false;
      }
      const age = shown ? (Date.now() - shown) / 1000 : null;
      if (age === null) say(`${lv.node} · starting`, "stale");
      else if (age > 4) say(`${lv.node} · last frame ${Math.round(age)} s ago`, "stale");
      else say(`${lv.node} · live`, "");
    }
    setTimeout(tick, paused || !visible ? 1000 : 350);
  }
  setTimeout(tick, 50);
  return box;
}

// ---------------------------------------------------------------- mailbox
// Deciding happens only here, from your click: there is no tool for it, so
// Aurelia can show you her ideas but never approve them herself.
const KIND_LABEL = { device: "Waiting to pair", node_update: "Computers", node_alert: "Computers", about_you: "About you", automation: "Automations", criticality: "What matters most", retention: "Keep longer" };
const CATEGORY_LABEL = { communication: "How to talk to you", mood: "Mood patterns", interests: "Interests", goals: "Goals",
  life: "What's going on", people: "People", learning: "What you know and are learning", rhythms: "Rhythms",
  work: "Work", preferences: "Preferences", general: "Other" };
const DAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];

async function decide(id, body) {
  const r = await fetch(`/mailbox/${id}/decide`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                   body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof out.detail === "string" ? out.detail : "That didn't work.");
  return out;
}

function mailboxView(items) {
  const box = el("div", "mb");
  if (!items.length) { box.append(el("div", "msg", "Nothing waiting for review.")); return box; }
  const groups = {};
  items.forEach(i => (groups[i.kind] = groups[i.kind] || []).push(i));
  const order = k => { const i = Object.keys(KIND_LABEL).indexOf(k); return i < 0 ? 99 : i; };
  for (const [kind, list] of Object.entries(groups).sort((a, b) => order(a[0]) - order(b[0]))) {
    const g = el("div", "mb-group");
    const head = el("div", "mb-ghead"); head.append(el("span", null, `${KIND_LABEL[kind] || kind} · ${list.length}`));
    if (list.length > 1 && kind !== "device") {                // each device is approved on its own, code checked
      const all = el("button", "btn quiet", `Approve all ${list.length}`); all.type = "button";
      all.addEventListener("click", async () => {
        all.disabled = true;
        try {
          const r = await fetch("/mailbox/decide-batch", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ ids: list.map(i => i.id), action: "approve" }) });
          if (!r.ok) throw new Error();
          g.querySelectorAll(".mb-item").forEach(c => settle(c, "Approved."));
        } catch (e) { all.disabled = false; say("Couldn't approve them all."); }
      });
      head.append(all);
    }
    g.append(head);
    list.forEach(i => g.append(mailboxItem(i)));
    box.append(g);
  }
  return box;
}

function settle(card, text, bad) {
  card.querySelectorAll("button,input,select").forEach(x => { x.disabled = true; });
  const res = card.querySelector(".mb-result") || card.appendChild(el("div", "mb-result"));
  res.className = "mb-result" + (bad ? " bad" : ""); res.textContent = text;
  if (!bad) { card.classList.add("done"); setTimeout(() => card.remove(), 2500); }
}

function mailboxItem(item) {
  const c = el("div", "mb-item" + (item.urgent ? " urgent" : ""));
  const top = el("div", "mb-top");
  top.append(el("span", "mb-title", item.title),
             el("span", "mb-conf", item.kind === "device" ? `asked ${item.age}` : ["node_update", "node_alert"].includes(item.kind) ? item.age
                                 : `${Math.round(item.confidence * 100)}% sure · ${item.age}`));
  c.append(top);
  if (item.kind === "device") {
    c.append(el("div", "mb-code", (item.proposal || {}).code || ""), el("div", "mb-sum", item.summary));
  } else if (item.kind === "about_you") {
    const pp = item.proposal || {};
    c.append(el("div", "mb-sum", `${CATEGORY_LABEL[pp.category] || "Other"}${pp.core ? " · core profile" : ""} · ${item.summary}`));
  } else if (item.summary) c.append(el("div", "mb-sum", item.summary));
  if ((item.evidence || []).length) {
    const ev = el("details", "mb-ev"); ev.append(el("summary", null, `Evidence (${item.evidence.length})`));
    const ul = el("ul"); item.evidence.forEach(e => ul.append(el("li", null, e))); ev.append(ul);
    c.append(ev);
  }
  const eff = el("div", "mb-effect"); eff.append(el("b", null, "IF APPROVED  "), document.createTextNode(item.effect || ""));
  c.append(eff);

  // "Change": edit the parts that make sense for this kind, then approve with your changes.
  const form = el("div", "mb-form"); form.hidden = true;
  const p = item.proposal || {};
  let changes = () => ({});
  if (item.kind === "automation") {
    const time = el("input"); time.type = "time"; time.value = (p.schedule || {}).time || "07:00";
    time.setAttribute("aria-label", "Time");
    const picked = new Set((p.schedule || {}).days || []);
    const days = DAY_KEYS.map(k => { const b = el("button", "day", k); b.type = "button";
      b.setAttribute("aria-pressed", String(picked.has(k)));
      b.addEventListener("click", () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))); return b; });
    form.append(el("label", null, "At"), time, el("label", null, "on"), ...days);
    changes = () => ({ schedule: { ...(p.schedule || {}), time: time.value,
                                   days: days.filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.textContent) } });
  } else if (item.kind === "criticality") {
    const sel = el("select"); ["normal", "high", "critical"].forEach(l => { const o = el("option", null, l); o.value = l; if (l === p.level) o.selected = true; sel.append(o); });
    sel.setAttribute("aria-label", "Level");
    form.append(el("label", null, "Level"), sel);
    changes = () => ({ level: sel.value });
  } else if (item.kind === "about_you") {
    const text = el("input"); text.type = "text"; text.value = p.fact || ""; text.setAttribute("aria-label", "What to remember");
    const sel = el("select"); sel.setAttribute("aria-label", "Kind");
    Object.entries(CATEGORY_LABEL).forEach(([k, v]) => { const o = el("option", null, v); o.value = k; if (k === p.category) o.selected = true; sel.append(o); });
    const core = el("input"); core.type = "checkbox"; core.checked = !!p.core; core.id = `core-${item.id}`;
    const coreLabel = el("label", null, "Core (always on my mind)"); coreLabel.htmlFor = core.id;
    form.append(text, sel, core, coreLabel);
    changes = () => ({ fact: text.value, category: sel.value, core: core.checked });
  } else if (item.kind === "device") {
    const text = el("input"); text.type = "text"; text.value = p.name || ""; text.maxLength = 60;
    text.setAttribute("aria-label", "Name");
    form.append(el("label", null, "Name"), text);
    changes = () => ({ name: text.value });
  } else if (item.kind === "retention") {
    const n = el("input"); n.type = "number"; n.min = "1"; n.max = "365"; n.value = p.hot_days || 30; n.style.width = "90px";
    n.setAttribute("aria-label", "Days");
    form.append(el("label", null, "Keep full panels for"), n, el("label", null, "days"));
    changes = () => ({ hot_days: Number(n.value) });
  }
  const reasonForm = el("div", "mb-form"); reasonForm.hidden = true;
  const reason = el("input"); reason.type = "text"; reason.placeholder = "Why not? (optional; helps me not ask again)";
  reason.setAttribute("aria-label", "Reason");
  reasonForm.append(reason);
  c.append(form, reasonForm);

  const btns = el("div", "btns");
  const mk = (text, cls) => { const b = el("button", "btn " + (cls || ""), text); b.type = "button"; return b; };
  const approve = mk("Approve", "primary"), change = mk("Change"), later = mk("Not now", "quiet"), no = mk("Decline", "quiet");
  if (item.kind === "node_update") { approve.textContent = "Retry"; no.textContent = "Leave it"; }
  if (item.kind === "node_alert") { approve.textContent = "Got it"; no.textContent = "Dismiss"; }
  const noChange = item.kind === "node_update" || item.kind === "node_alert";
  btns.append(approve, ...(noChange ? [] : [change]), ...(item.kind === "device" ? [] : [later]), no);   // a pairing request expires; no "not now"
  c.append(btns);

  const act = async (body, ok) => {
    try { const out = await decide(item.id, body); settle(c, ok || out.done || "Done."); say(out.done || "Done."); }
    catch (e) { settle(c, e.message, true); setTimeout(() => c.querySelectorAll("button,input,select").forEach(x => { x.disabled = false; }), 1500); }
  };
  approve.addEventListener("click", () => form.hidden ? act({ action: "approve" }) : act({ action: "modify", changes: changes() }));
  change.addEventListener("click", () => {
    form.hidden = !form.hidden; reasonForm.hidden = true;
    approve.textContent = form.hidden ? "Approve" : "Approve with changes";
  });
  later.addEventListener("click", () => act({ action: "defer", days: 7 }));
  no.addEventListener("click", () => {
    if (reasonForm.hidden) { reasonForm.hidden = false; form.hidden = true; no.textContent = "Decline for good"; reason.focus(); return; }
    act({ action: "reject", reason: reason.value });
  });
  return c;
}

// ---------------------------------------------------------------- digest
function digestView(d) {

  box.append(el("div", "facts", d.date || ""));
  if (d.quiet) box.append(el("div", "msg", "A quiet day. Nothing needs you."));
  const section = (title, lines) => { if (!lines.length) return; const sec = el("div", "dg-sec"); sec.append(el("div", "dg-h", title)); lines.forEach(l => sec.append(l)); box.append(sec); };

  }

    line.append(statusPill(tone, String(a.outcome).replace(/_/g, " ")), document.createTextNode(a.what)); return line; }));

function openMailbox() {

                    body: JSON.stringify({ tool: "parallax.mailbox", args: {} }) }).catch(() => say("I can't reach Aurelia right now."));
}

function updateChip(c) {
  const chip = document.getElementById("mailchip");
  const n = (c && c.waiting) || 0;
  chip.hidden = n === 0;
  chip.textContent = `${n} for review`;

// One release from history, in detail.
function releaseDetail(r) {
  const box = releaseOutcome({ sha: r.sha, message: r.message, author: r.author, services: r.services,
                               outcome: r.status, detail: r.detail });
  const finished = r.finished_at && r.finished_at !== "None" ? r.finished_at : null;
  const started = r.started_at && r.started_at !== "None" ? r.started_at : null;
  const bits = [];
  if (finished) bits.push(`finished ${when(finished)}`);
  if (started && finished) {
    const secs = Math.round((Date.parse(finished.replace(" ", "T")) - Date.parse(started.replace(" ", "T"))) / 1000);
    if (secs > 0) bits.push(`took ${secs >= 60 ? `${Math.floor(secs / 60)} min ${secs % 60} s` : `${secs} s`}`);
  } else if (started) bits.push(`started ${when(started)}`);
  if (bits.length) box.insertBefore(el("div", "facts", bits.join(" · ")), box.children[2] || null);
  return box;
}

// One release, as it finished: what it was, and what happened.
function releaseOutcome(r) {
  const box = el("div"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "10px";
  const tone = { live: "online", rolled_back: "offline", failed: "offline", held: "disabled" }[r.outcome] || "planned";
  const words = { live: "live", rolled_back: "rolled back", failed: "failed", held: /local edits|diverged/i.test(r.detail || "") ? "held" : "waiting for approval", dry_run: "dry run" }[r.outcome] || r.outcome;
  const top = el("div", "head"); top.style.justifyContent = "flex-start"; top.append(statusPill(tone, words));
  box.append(top);
  if (r.message) box.append(el("div", "msg", r.message));
  box.append(el("div", "facts", [r.sha, r.author, (r.services || []).join(" · ") || null].filter(Boolean).join(" · ")));
  if (r.detail) box.append(el("div", ["rolled_back", "failed"].includes(r.outcome) ? "error" : "facts", r.detail));
  return box;
}

// Chrysalis releases: one line each; the reason only when something went wrong.
function releases(list) {
  const box = el("div", "rels");
  const tone = st => st === "live" ? "live" : ["failed", "rolled_back"].includes(st) ? "bad" : ["held", "testing", "deploying", "verifying"].includes(st) ? "warn" : "";
  list.forEach(r => {
    const row = el("div", "rel");
    const st = String(r.status || "");
    const firstLine = String(r.message || "").split("\n")[0];
    const what = el("div", "what", r.summary || firstLine || "(no message)"); what.title = r.purpose || r.message || "";
    row.append(el("div", "st " + tone(st), st.replace(/_/g, " ")), el("div", "sha", r.sha || ""), what,
               el("div", "when", when(r.finished_at && r.finished_at !== "None" ? r.finished_at : r.started_at)));
    if (Array.isArray(r.services) && r.services.length) row.append(el("div", "svc", r.services.join(" · ")));
    if (r.detail && st !== "live") { const w = el("div", "why" + (tone(st) === "bad" ? " bad" : ""), r.detail); w.title = r.detail; row.append(w); }
    box.append(row);
  });
  return box;
}
function when(stamp) {
  const t = Date.parse(String(stamp || "").replace(" ", "T"));
  if (isNaN(t)) return "";
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 1440) return `${Math.round(mins / 60)} h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// A device as Orbit describes it.
function deviceCard(d) {
  const c = el("div", "dev");
  c.dataset.k = norm(d.name);
  let state = "", sub = [];
  if (d.online === false) { state = "Offline"; c.classList.add("off"); }
  else switch (d.kind) {
    case "lock":
      state = d.locked === true ? "Locked" : d.locked === false ? "Unlocked" : "Unknown";
      if (d.locked === false) c.classList.add("alert");
      break;
    case "light":
      state = d.on ? (typeof d.level === "number" ? `On · ${d.level}%` : "On") : "Off";
      if (!d.on) c.classList.add("off");
      break;
    case "thermostat":
      state = d.current_temp != null ? `${d.current_temp}°` : "—";
      if (d.mode === "heat" || d.mode === "aux_heat") sub.push(`Heat to ${d.heat_setpoint}°`);
      else if (d.mode === "cool") sub.push(`Cool to ${d.cool_setpoint}°`);
      else if (d.mode === "auto") sub.push(`Auto ${d.heat_setpoint}–${d.cool_setpoint}°`);
      else if (d.mode) sub.push(`Mode ${d.mode}`);
      if (d.operating_state && d.operating_state !== "idle") sub.push(d.operating_state);
      if (d.humidity != null) sub.push(`${d.humidity}% humidity`);
      break;
    case "leak_sensor":
      state = d.active ? "Leak" : "Dry"; if (d.active) c.classList.add("alert"); break;
    case "motion_sensor":
      state = d.active ? "Motion" : "Still"; break;
    case "tv":
      state = d.on ? "On" : "Off";
      if (!d.on) c.classList.add("off");
      if (d.on && d.app) sub.push(d.app);
      if (d.input && d.input !== d.app) sub.push(d.input);
      break;
    default:
      state = d.kind || "Device";
  }
  if (typeof d.battery === "number") sub.push(`Battery ${d.battery}%`);
  if (typeof d.battery === "number" && d.battery < 20) c.classList.add("alert");
  c.append(el("div", "name", d.name || "Device"), el("div", "state", state));
  if (sub.length) c.append(el("div", "sub", sub.join(" · ")));
  return c;
}

// Devices Orbit doesn't model yet: name + raw readings.
function otherCard(d) {
  const c = el("div", "dev");
  const readings = Object.entries(d.readings || {});
  c.append(el("div", "name", d.name || "Sensor"));
  const main = readings.find(([k]) => ["open", "leak", "motion", "active"].includes(k));
  if (main) {
    const on = String(main[1]) === "true";
    const words = { open: ["Open", "Closed"], leak: ["Leak", "Dry"], motion: ["Motion", "Still"], active: ["Active", "Clear"] }[main[0]];
    c.append(el("div", "state", on ? words[0] : words[1]));
    if (on && (main[0] === "open" || main[0] === "leak")) c.classList.add("alert");
  } else {
    c.append(el("div", "state", (d.kind || "sensor").replace(/_/g, " ")));
  }
  const rest = readings.filter(r => r !== main).map(([k, v]) => `${k.replace(/_/g, " ")} ${v}`);
  if (rest.length) c.append(el("div", "sub", rest.join(" · ")));
  return c;
}

// Anything else: key/value rows, tables for lists of records.
function generic(obj) {
  const kv = el("div", "kv");
  for (const [k, v] of Object.entries(obj)) {
    kv.append(el("div", "k", k.replace(/_/g, " ")));
    const cell = el("div", "v");
    if (Array.isArray(v) && v.length && typeof v[0] === "object" && v[0] !== null) cell.append(table(v));
    else if (Array.isArray(v)) cell.textContent = v.length ? v.join(", ") : "none";
    else if (v && typeof v === "object") cell.append(generic(v));
    else cell.textContent = typeof v === "boolean" ? (v ? "yes" : "no") : String(v);
    kv.append(cell);
  }
  return kv;
}
function table(rows) {
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))].slice(0, 6);
  const t = el("table"), hr = el("tr");
  cols.forEach(c => hr.append(el("th", null, c.replace(/_/g, " "))));
  t.append(hr);
  rows.slice(0, 50).forEach(r => {
    const tr = el("tr");
    cols.forEach(c => {
      const v = r[c];
      const text = v === null || v === undefined ? "" : Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v);
      const td = el("td"); const span = el("span", "clamp", text); span.title = text; td.append(span); tr.append(td);
    });
    t.append(tr);
  });
  return t;
}

// ---------------------------------------------------------------- live updates
// Actions change what open panels show. Orbit re-reads a device after acting, so
// an action's result carries the device's confirmed state: merge it into any open
// panel showing that device. Look-ups an action declares it changes ("refreshes")
// and that the merge didn't cover are re-run in place.
const norm = x => String(x || "").trim().toLowerCase();

function entitiesOf(d) {
  const out = [];
  if (d.kind && d.name) out.push(d);
  if (typeof d.device === "string" && typeof d.locked === "boolean") out.push({ name: d.device, kind: "lock", locked: d.locked, online: true });
  for (const list of [d.devices, d.tvs]) if (Array.isArray(list)) list.forEach(x => x && x.name && out.push(x));
  return out;
}

function applyEntities(source, ents) {
  const touched = new Set();
  if (!ents.length) return touched;
  for (const p of recs()) {
    if (p === source || !p.data || !["reading", "refreshing"].includes(p.state)) continue;
    const targets = [];
    for (const list of [p.data.devices, p.data.tvs]) if (Array.isArray(list)) targets.push(...list);
    if (p.data.kind && p.data.name) targets.push(p.data);
    const changedNames = new Set();
    for (const ent of ents) {
      const item = targets.find(x => x && norm(x.name) === norm(ent.name) && (!x.kind || !ent.kind || x.kind === ent.kind));
      if (!item || item === ent) continue;
      for (const [k, v] of Object.entries(ent)) {
        if (v === undefined || k === "status" || k === "partial") continue;
        if (JSON.stringify(item[k]) !== JSON.stringify(v)) { item[k] = v; changedNames.add(norm(ent.name)); }
      }
    }
    if (changedNames.size) {
      const memo = p.memo ? { ...p.memo, updated: true, stale: false } : { updated: true };
      p.memo = memo;
      renderResult(p, p.data, memo);
      p.node.querySelectorAll(".dev").forEach(c => {
        if (changedNames.has(norm(c.querySelector(".name") && c.querySelector(".name").textContent))) c.classList.add("changed");
      });
      touched.add(p);
    }
  }
  return touched;
}

async function refreshOpen(tools, skip) {
  for (const p of recs()) {
    if (!tools.includes(p.tool) || skip.has(p) || p.state !== "reading") continue;
    try {
      await fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ tool: p.tool, args: p.args || {}, trigger: "refresh" }) });
    } catch (e) { /* the panel keeps what it shows */ }
  }
}

function flash(rec) {
  rec.node.classList.remove("flash"); void rec.node.offsetWidth; rec.node.classList.add("flash");
}

// ---------------------------------------------------------------- events
function onEvent(ev) {
  const id = ev.task_id, d = ev.data || {};
  // A presentation display shows only what's addressed to it (the server already sends only that).
  if (document.body.classList.contains("ambient") && ev.type.startsWith("panel.") && ev.device == null) return;
  if (ev.type === "now.playing") { showNow(d); return; }           // the live "now playing" panel
  if (ev.type === "screen.check") { reportScreen(); return; }      // checking a send: report now
  if (ev.type === "panels.clear") {                   // "close the panels on the TV": all, or those numbers
    const nums = Array.isArray(d.panels) && d.panels.length ? new Set(d.panels) : null;
    recs().filter(p => !nums || nums.has(p.num)).forEach(p => remove(p));
    setTimeout(reportScreen, 60);                     // after they're marked leaving: the check reads this
    return;
  }
  if (ev.type === "sent.shown") { say(`Shown on ${d.to} now (it was kept until it opened).`); return; }
  if (ev.type === "confirm.ask") {                     // a slow tool finished after her reply and needs his OK
    if (d.action && !panels.has("confirm-" + d.action.action_id)) showConfirm(d.action);
    return;
  }
  if (ev.type === "mailbox.changed") {               // the chip, and an open mailbox panel, stay current
    updateChip(d);
    refreshOpen(["parallax.mailbox"], new Set());
    return;
  }
  if (ev.type === "panel.open" && SYSTEM_USERS.has(d.user)) { hidden.add(id); return; }
  if (ev.type === "panel.open" && d.display === "brief") { hidden.add(id); glanceSoon(); return; }   // answered in her reply
  if (hidden.has(id)) { if (ev.type === "panel.close") hidden.delete(id); return; }
  let rec = panels.get(id);
  switch (ev.type) {
    case "panel.open": {
      // Already on screen? Refresh that panel in place instead of opening another.
      const existing = rec ? null : openPanelFor(ev.tool, d.key);
      if (existing) {
        panels.set(id, existing);
        existing.state = "refreshing";
        existing.queued = false; existing.tucked = false; existing.touched = Date.now();   // asked again: bring it back into view
        existing.memo = { ...(existing.memo || {}), refreshing: true, note: null };
        renderResult(existing, existing.data, existing.memo);
        break;
      }
      if (d.trigger === "refresh") { hidden.add(id); return; }      // its panel was closed meanwhile
      rec = rec || makePanel(id, ev.tool);
      Object.assign(rec, { unit: d.unit || null, cancellable: d.cancellable !== false, closeAfter: d.close_after || null,
                           key: d.key, args: d.args || {}, refreshes: d.refreshes || [], tier: d.tier,
                           subtitle: d.subtitle || (d.sent_from ? `Sent from ${d.sent_from}` : null), critical: d.critical || null });
      if (d.present) rec.node.classList.add("present");
      if (d.snapshot) {                              // memory: show the last panel now, refresh behind it
        const sn = d.snapshot;
        rec.state = "refreshing";
        rec.pinned = sn.tier === "pinned";
        rec.memo = { age: sn.age, stale: sn.stale, tier: sn.tier, taskId: sn.task_id, refreshing: true };
        renderResult(rec, { ...sn.data, partial: sn.partial }, rec.memo);
      } else {
        renderProgress(rec, null);
      }
      break;
    }
    case "panel.progress":
      rec = rec || makePanel(id, ev.tool);
      if (rec.state === "running") renderProgress(rec, d);
      break;
    case "panel.result": {
      if (!rec && d.plan && closedPlans.has(id)) return;           // he closed this plan's panel
      rec = rec || makePanel(id, ev.tool);
      if (d.plan) { rec.closeAfter = null; clearTimeout(rec.timer); }  // a plan's panel stays until dismissed
      const wasShowing = !!rec.data && rec.taskId !== id;
      rec.state = "reading";
      rec.latestTask = id;
      if (rec.taskId !== id && !rec.queued) rec.touched = Date.now();   // asked again: keep it in view
      rec.memo = null;                               // fresh data replaces a restored or older panel
      renderResult(rec, d);
      if (Array.isArray(d.mailbox)) {                // an empty mailbox closes itself; a new item keeps it open
        clearTimeout(rec.timer);
        rec.closeAfter = d.mailbox.length ? null : 3;
        if (!d.mailbox.length) { rec.autoArmed = false; autoClose(rec); }
      }
      if (wasShowing) flash(rec);
      rec.merged = applyEntities(rec, entitiesOf(d));
      break;
    }
    case "panel.close":
      glanceSoon();
      if (!rec) return;
      if (rec.state === "refreshing" && !d.has_result) {
        // The refresh brought nothing new: keep what's shown and say what happened.
        rec.state = "reading";
        rec.memo = { ...(rec.memo || {}), refreshing: false };
        if (d.status === "failed") rec.memo.note = "Couldn't refresh: " + (d.error || "the tool failed");
        renderResult(rec, rec.data, rec.memo);
      } else if (d.status === "failed" && !d.has_result) {
        rec.state = "failed";
        rec.node.className = "panel failed" + (rec.critical ? " critical" : "");
        rec.node.replaceChildren(closeButton(rec));
        const head = el("div", "head"); head.append(el("div", "title", titleFor(rec.tool)));
        if (rec.critical) { head.append(el("span", "tag", rec.critical.toUpperCase())); flash(rec); }
        rec.node.append(head, el("div", "error", d.error || "That didn't work."));
      } else if (!d.has_result) {
        rec.state = "done";
        rec.node.className = "panel working";
        const head = el("div", "head"); head.append(el("div", "title", titleFor(rec.tool)));
        const done = el("div", "done");
        done.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5fd4e6" stroke-width="1.6" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>';
        done.append(el("span", null, d.status === "cancelled" ? "Stopped" : "Complete"));
        rec.node.replaceChildren(head, done);
        remove(rec, 1100);
      } else if (rec.state === "running") {
        rec.state = "reading";
      }
      if (d.close_after !== undefined) rec.closeAfter = d.close_after;
      if (rec.data && rec.data.plan) rec.closeAfter = null;
      if (d.status !== "failed" && rec.state === "reading" && rec.taskId === id) autoClose(rec);
      // An action finished: re-run the look-ups it changes that the merge didn't already update.
      if (d.status === "completed" && rec.taskId === id && (rec.refreshes || []).length)
        refreshOpen(rec.refreshes, new Set([rec, ...(rec.merged || [])]));
      if (panels.get(id) === rec && rec.taskId !== id) panels.delete(id);   // a refresh task is done with its panel
      break;
  }
  relayout();
}

// ---------------------------------------------------------------- connection
// This page's version, filled in by the orchestrator when it serves the page.
const VIEW_VERSION = "__VIEW_VERSION__";
let ws = null, backoff = 1000, connWord = "Connecting…", connectedBefore = false, digestChecked = false;

// After an update, reload into the new page and re-open the look-ups that were on
// screen; memory shows each one at once while it refreshes.
async function reloadIfUpdated() {
  if (VIEW_VERSION.startsWith("__")) return;
  try {
    const r = await fetch("/view/version", { cache: "no-store" });
    const { version } = await r.json();
    if (!version || version === VIEW_VERSION) return;
    const reopen = recs().filter(p => ["reference", "read"].includes(p.tier) && ["reading", "refreshing"].includes(p.state))
                         .map(p => ({ tool: p.tool, args: p.args || {} }));
    try { sessionStorage.setItem("aurelia.reopen", JSON.stringify(reopen)); } catch (e) {}
    location.reload();
  } catch (e) { /* try again on the next reconnect */ }
}
// Also check now and then, and when the screen comes back into view: a release can land while the
// connection never dropped (it reconnected to the old copy during the swap), and nobody hard-refreshes a TV.
setInterval(reloadIfUpdated, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reloadIfUpdated(); });
function reopenAfterReload() {
  let list = [];
  try { list = JSON.parse(sessionStorage.getItem("aurelia.reopen") || "[]"); sessionStorage.removeItem("aurelia.reopen"); } catch (e) {}
  list.forEach(t => fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(t) }).catch(() => {}));
}

// A release may be under way (the orchestrator itself may be what's being swapped,
// which is why we were disconnected): pick its panel back up from where it is.
async function catchUpOnRelease() {
  try {
    const { events } = await (await fetch("/releases/current", { cache: "no-store" })).json();
    if (!events || !events.length) return;
    const id = events[0].task_id, rec = panels.get(id);
    if (dismissed.has(id) || (rec && rec.state !== "running")) return;           // already showing how it ended
    events.forEach(e => { if (!(e.type === "panel.open" && panels.has(id))) onEvent(e); });
  } catch (e) { /* nothing to catch up on */ }
}

// ---------------------------------------------------------------- the phone app: notifications
// Installed to the home screen, the view is an app (manifest + service worker). "Notify me" asks this
// device for permission (it must be a tap) and gives the server this display's push subscription; the
// server then tells it about urgent mailbox items, things it asked for that finished, and anything kept
// for it, when it isn't on screen. The service worker only shows notifications; it caches nothing.
const notifyBtn = document.getElementById("notify");
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const iosBrowser = /iP(hone|ad|od)/.test(navigator.userAgent) && !standalone;
let swReg = null;
async function setupNotify() {
  if (SCREEN || !("serviceWorker" in navigator)) return;
  try { swReg = await navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) { return; }
  const can = "PushManager" in window && "Notification" in window;
  if (!can) { if (iosBrowser) { notifyBtn.textContent = "Add to Home Screen"; notifyBtn.hidden = false; } return; }
  const sub = await swReg.pushManager.getSubscription();
  notifyBtn.hidden = !!sub && Notification.permission === "granted";
  if (Notification.permission === "denied") notifyBtn.hidden = true;
}
notifyBtn.addEventListener("click", async () => {
  if (!("PushManager" in window)) {
    say("On iPhone, notifications come with the app: tap Share, then Add to Home Screen, and open Aurelia from there.");
    return;
  }
  try {
    if (await Notification.requestPermission() !== "granted") { say("Notifications are off for this device."); notifyBtn.hidden = true; return; }
    const { key } = await (await fetch("/push/key")).json();
    const raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((key.length + 3) % 4)), c => c.charCodeAt(0));
    const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw });
    const r = await fetch("/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(sub.toJSON()) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    notifyBtn.hidden = true;
    say("Notifications are on for this device. Say \"send me a test notification\" to try it.");
  } catch (e) { say("I couldn't turn notifications on here (" + (e.message || e) + ")."); }
});
setupNotify();

function connect() {
  const conn = document.getElementById("conn");
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    backoff = 1000; conn.className = "conn live"; relayout();
    if (connectedBefore) reloadIfUpdated(); else reopenAfterReload();
    connectedBefore = true;
    catchUpOnRelease();
    fetch("/mailbox/count").then(r => r.json()).then(updateChip).catch(() => {});
    loadGlance(); loadAmbient();
    if (!document.body.classList.contains("ambient")) loadNow();
    if (!digestChecked) { digestChecked = true; fetch("/digest/check", { method: "POST" }).catch(() => {}); }
  };
  ws.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn("bad event", e); } };
  ws.onclose = () => {
    conn.className = "conn down"; connWord = "Reconnecting…";
    document.getElementById("connText").textContent = connWord;
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 10000);
  };
}
connect();

// ---------------------------------------------------------------- talking
const reply = document.getElementById("reply");
let replyTimer = null;
// Recent exchanges. One on its own shows just the answer; several at once (you asked
// again before the first came back) each keep their own line, so no answer overwrites another.
const exchanges = [];
const SHOW_MS = 15000;
function showExchanges() {
  const now = Date.now();
  const live = exchanges.filter(e => e.pending || now - e.at < SHOW_MS).slice(-3);
  clearTimeout(replyTimer);
  if (!live.length) { reply.classList.add("quiet"); reply.dataset.sig = ""; openReply(false); return; }
  if (reply.classList.contains("quiet")) openReply(false);             // a new reply starts closed
  reply.classList.remove("quiet");
  // Redrawn only when something changed, so an opened reply keeps its scroll position while you read.
  const sig = JSON.stringify(live.map(e => [e.text, e.about, e.pending, e.reply]));
  if (sig === reply.dataset.sig) { if (!live.every(e => e.pending)) replyTimer = setTimeout(showExchanges, 1000); fitReply(); return; }
  reply.dataset.sig = sig;
  if (live.length === 1) reply.replaceChildren(live[0].pending ? document.createTextNode("…") : linkify(live[0].reply));
  else reply.replaceChildren(...live.slice().reverse().map(e => {          // newest first: it's what fits in the slot
    const d = el("div", "ex" + (e.pending ? " pending" : ""));
    if (e.text) d.append(el("div", "q", "› " + e.text + (e.about ? `  · panel ${e.about}` : "")));
    const a = el("div", "a"); a.append(e.pending ? document.createTextNode("…") : linkify(e.reply)); d.append(a);
    return d;
  }));
  if (!live.every(e => e.pending)) replyTimer = setTimeout(showExchanges, 1000);
  fitReply();
}
// Words in her reply that name something on screen (a device, a result, a function, "panel 2")
// light it up when you point at them, so the reply and the panels read as one answer.
function screenTerms() {
  const terms = [];
  recs().filter(p => p.num && p.data && !p.queued).forEach(p => {
    terms.push({ word: `panel ${p.num}`, rec: p });
    const d = p.data;
    [...(d.devices || []), ...(d.tvs || [])].forEach(x => x.name && terms.push({ word: x.name, rec: p, key: norm(x.name) }));
    (d.results || []).forEach(x => x.title && x.title.length >= 6 && terms.push({ word: x.title, rec: p, key: norm(x.title) }));
    (d.videos || []).forEach(x => x.title && x.title.length >= 6 && terms.push({ word: x.title, rec: p, key: norm(x.title) }));
    (d.functions || []).forEach(x => x.name && terms.push({ word: x.name, rec: p, key: norm(x.name) }));
    if (d.kind && d.name) terms.push({ word: d.name, rec: p, key: norm(d.name) });
  });
  return terms.sort((a, b) => b.word.length - a.word.length);
}
function linkify(text) {
  const frag = document.createDocumentFragment();
  const terms = screenTerms();
  const low = String(text || "").toLowerCase();
  const hits = [];
  terms.forEach(t => {
    const w = t.word.toLowerCase();
    let i = low.indexOf(w);
    while (i >= 0) {
      const edgeOk = (i === 0 || !/\w/.test(low[i - 1])) && (i + w.length >= low.length || !/\w/.test(low[i + w.length]));
      if (edgeOk && !hits.some(h => i < h.end && i + w.length > h.start)) hits.push({ start: i, end: i + w.length, t });
      i = low.indexOf(w, i + 1);
    }
  });
  hits.sort((a, b) => a.start - b.start);
  let at = 0;
  hits.forEach(h => {
    frag.append(document.createTextNode(text.slice(at, h.start)));
    const span = el("span", "ref", text.slice(h.start, h.end));
    const light = on => {
      if (!recs().includes(h.t.rec)) return;
      h.t.rec.node.classList.toggle("lit", on);
      if (h.t.key) h.t.rec.node.querySelectorAll("[data-k]").forEach(n => { if (n.dataset.k === h.t.key) n.classList.toggle("lit", on); });
      if (on && h.t.rec.queued) { h.t.rec.queued = false; h.t.rec.tucked = false; h.t.rec.touched = Date.now(); relayout(); }
    };
    span.addEventListener("pointerenter", () => light(true));
    span.addEventListener("pointerleave", () => light(false));
    frag.append(span);
    at = h.end;
  });
  frag.append(document.createTextNode(text.slice(at)));
  return frag;
}

// The reply has a fixed place and height. A long one fades at the bottom with MORE, which opens it
// over the panels (they never move); it closes again with Esc, a click elsewhere, or the next reply.
const more = document.getElementById("more");
function fitReply() {
  const long = !reply.classList.contains("quiet") && reply.scrollHeight > reply.clientHeight + 4;
  reply.classList.toggle("long", long && !reply.classList.contains("open"));
  more.hidden = !(long || reply.classList.contains("open")) || reply.classList.contains("quiet");
  more.textContent = reply.classList.contains("open") ? "LESS" : "MORE";
}
function openReply(on) {
  reply.classList.toggle("open", on);
  if (!on) reply.scrollTop = 0;
  fitReply();
}
more.addEventListener("click", () => openReply(!reply.classList.contains("open")));
reply.addEventListener("pointerenter", () => { clearTimeout(replyTimer); });                  // reading it: keep it
reply.addEventListener("pointerleave", () => { exchanges.forEach(e => { if (!e.pending) e.at = Date.now(); }); showExchanges(); });
document.addEventListener("pointerdown", e => {
  if (reply.classList.contains("open") && !reply.contains(e.target) && e.target !== more) openReply(false);
});
addEventListener("resize", fitReply);

// ---- worth a glance: only what's off or in motion, at the edges of the screen ------------
let glanceTimer = null;
function glanceSoon() { clearTimeout(glanceTimer); glanceTimer = setTimeout(loadGlance, 1500); }
async function loadGlance() {
  clearTimeout(glanceTimer); glanceTimer = setTimeout(loadGlance, 60000);
  let items = [];
  try { const r = await fetch("/glance", { cache: "no-store" }); if (r.ok) items = (await r.json()).items || []; } catch (e) { return; }
  const left = document.getElementById("glanceL"), right = document.getElementById("glanceR");
  const line = (cls, text, since, onClick) => {
    const g = el(onClick ? "button" : "div", "gl " + cls);
    if (onClick) { g.type = "button"; g.addEventListener("click", onClick); }
    g.append(el("span", "t", text)); if (since) g.append(el("span", "s", since));
    return g;
  };
  left.replaceChildren(...items.filter(i => i.level !== "live").slice(0, 4).map(i => {
    const text = i.text || (i.failed ? `${titleFor(i.tool)} failed${i.failed > 1 ? ` ×${i.failed}` : ""}` : titleFor(i.tool));
    return line(i.level, text, i.since, i.say ? () => ask(i.say) : null);
  }));
  right.replaceChildren(...items.filter(i => i.level === "live").slice(0, 3).map(i => {
    const p = panels.get(i.task_id);
    return line("live", titleFor(i.tool) + (i.percent != null ? ` ${i.percent}%` : ""), null,
                p ? () => { p.queued = false; p.tucked = false; p.touched = Date.now(); relayout(); flash(p); } : null);
  }));
}

// ---- tuck away: a panel you've read and left alone goes to the rail as its headline -------
const TUCK_MS = 180000;
setInterval(() => {
  const now = Date.now();
  let moved = false;
  recs().forEach(p => {
    if (p.queued || p.pinned || p === focused || p.state !== "reading" || !p.headline) return;
    if (p.node.matches(":hover") || now - (p.touched || 0) < TUCK_MS) return;
    p.queued = true; p.tucked = true; p.queuedAt = ++queueClock; moved = true;
  });
  if (moved) relayout();
}, 15000);

// Her name, then the time and date, kept current.
function tick() {
  const now = new Date();
  const c = document.getElementById("clock"), big = document.body.classList.contains("screen");
  c.replaceChildren(el("b", null, now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })),
                    el("span", "date", (big ? "" : "  ·  ") + now.toLocaleDateString([], { weekday: big ? "long" : "short", month: big ? "long" : "short", day: "numeric" })));
}
tick(); setInterval(tick, 10000);
function say(text) {                            // a reply that isn't to something you typed (a confirmation)
  exchanges.push({ text: null, reply: text, pending: false, at: Date.now() });
  showExchanges();
}

async function ask(text) {
  const screen = screenState();
  const ex = { text, about: screen.focus, reply: null, pending: true, at: Date.now() };
  exchanges.push(ex); if (exchanges.length > 12) exchanges.splice(0, exchanges.length - 12);
  document.getElementById("said").textContent = "› " + text + (screen.focus ? `  · panel ${screen.focus}` : "");
  showExchanges();
  const done = t => { ex.reply = t; ex.pending = false; ex.at = Date.now(); showExchanges(); };
  let r, out = null;
  try {
    r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ text, session_id: session, screen }) });
  } catch (e) { done("I can't reach Aurelia right now. Check this device's connection (Tailscale)."); return; }
  try { out = await r.json(); } catch (e) {}
  if (!out) {                                   // not her answer: the proxy's page, or a crash
    done([502, 503, 504].includes(r.status) ? "She's restarting (probably an update). Try again in a moment."
         : `Something went wrong on her side (error ${r.status}). It's in her log.`);
    return;
  }
  if (!r.ok) { done(out.detail ? String(out.detail) : `Something went wrong (error ${r.status}).`); return; }
  // A long answer opened as its own panel: the top line keeps just its first sentence.
  done(out.reply_panel && out.reply_short ? `${out.reply_short} ↓` : (out.reply || ""));
  (out.needs_confirmation || []).forEach(showConfirm);
}

function showConfirm(action) {
  const node = el("section", "panel asking");
  const rec = { taskId: "confirm-" + action.action_id, tool: action.tool, node, state: "asking" };
  panels.set(rec.taskId, rec);
  track(rec);
  const head = el("div", "head"); head.append(el("div", "title", titleFor(action.tool)));
  const what = Object.entries(action.args || {}).map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(" · ");
  const btns = el("div", "btns");
  const yes = el("button", "btn primary", "Go ahead"); yes.type = "button";
  const no = el("button", "btn", "Cancel"); no.type = "button";
  btns.append(yes, no);
  const own = action.reason && !/^'[\w.]+' is a/.test(action.reason);   // a tool saying what exactly waits for him
  node.append(closeButton(rec), head, el("div", "msg", own ? action.reason : "This needs your confirmation."));
  if (what && !own) node.append(el("div", "label", what));
  node.append(btns);
  stage.appendChild(node); relayout();
  const answer = async approve => {
    yes.disabled = no.disabled = true;
    try {
      const r = await fetch("/ask/confirm", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ action_id: action.action_id, approve }) });
      const out = await r.json();
      say(r.ok ? out.reply : (out.detail || "That expired."));
    } catch (e) { say("I can't reach Aurelia right now."); }
    remove(rec);
  };
  yes.addEventListener("click", () => answer(true));
  no.addEventListener("click", () => answer(false));
}

document.getElementById("mailchip").addEventListener("click", openMailbox);
document.getElementById("focuschip").addEventListener("click", () => { setFocus(null); cmd.focus(); });
stage.addEventListener("click", e => { if (e.target === stage) setFocus(null); });   // the empty space around panels
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = cmd.value.trim().replace(/^\/+\s*/, "");      // a "/" typed out of habit isn't part of it
  if (!text) return;
  cmd.value = "";
  ask(text);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== cmd) { e.preventDefault(); cmd.focus(); }
  else if (e.key === "Escape") {
    if (reply.classList.contains("open")) openReply(false);        // a long reply first, then focus, then the screen
    else if (focused) setFocus(null);                 // first Esc lets go of the panel; the next one clears the screen
    else if (document.activeElement === cmd) cmd.blur();
    else panels.forEach(rec => { if (rec.state !== "running") remove(rec); });
  }
});
</script>
