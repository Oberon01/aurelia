<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<!--
  The surgical view (minimal, Phase 2). It holds no logic: it renders the
  orchestrator's panel events from /ws and sends what you type to /ask.
  Panel rules from the design doc:
    - nothing to read      → "Complete" for about a second, then it fades out
    - something to read    → the progress panel turns into the result panel
    - one panel            → large; two or more → compact
    - panels you can read sit in front; progress panels recede
  Result panels stay until dismissed (x, or Esc clears all). How result
  panels leave is still an open decision in the design doc.
-->
<style>
:root{
  --ground:#04070b; --ink:#d8f6fb; --ink-strong:#e9fbfe; --ink-dim:#9fc7cd; --ink-faint:#7fa7ae;
  --cyan:#5fd4e6; --cyan-line:rgba(95,212,230,.55); --cyan-soft:rgba(95,212,230,.28);
  --cyan-fill:rgba(95,212,230,.07); --cyan-track:rgba(95,212,230,.12);
  --warn:#f2b35f; --warn-line:rgba(242,179,95,.6); --warn-fill:rgba(242,179,95,.08);
  --bad:#ff8f8f; --bad-line:rgba(255,143,143,.55); --bad-fill:rgba(255,143,143,.07);
  --display:'Chakra Petch',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans)}
body{overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto}
button{font:inherit;color:inherit;cursor:pointer}

/* ---- top line ---- */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px 40px;z-index:5}
.mark{font-family:var(--display);font-size:14px;letter-spacing:6px;color:var(--ink-faint)}
.said{font-family:var(--mono);font-size:15px;color:var(--ink-dim);min-width:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:16px;align-items:center}
.mailchip{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--cyan-line);background:rgba(95,212,230,.08);color:var(--ink-strong);font-family:var(--mono);font-size:12px;letter-spacing:1px}
.mailchip:hover{background:var(--cyan-track)}
.mailchip.urgent{border-color:var(--warn-line);color:var(--warn)}
.mailchip[hidden]{display:none}
.conn{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.conn.live .dot{background:var(--cyan);animation:blink 1.6s ease-in-out infinite}
.conn.down .dot{background:var(--warn)}
.reply{justify-self:center;width:min(900px,90vw);max-height:26vh;overflow-y:auto;padding:0 0 16px;text-align:center;font-size:17px;line-height:1.5;color:var(--ink-strong);white-space:pre-line;transition:opacity .6s}
.reply.quiet{opacity:0;max-height:0;padding:0}

/* ---- the stage ---- */
/* Up to 4 panels share the screen (1 large, 2 side by side, 3-4 in a 2x2 grid);
   each scrolls inside itself. The rest wait as chips in the rail. */
.floor{min-height:0;margin:0 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.floor.has-queue{grid-template-columns:minmax(0,1fr) 220px}
.stage{min-height:0;display:grid;gap:20px;padding:4px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.stage.n0,.stage.n1{grid-template-columns:minmax(0,880px);grid-template-rows:minmax(0,1fr);justify-content:center}
.stage.n2{grid-template-rows:minmax(0,1fr)}
.stage.n1 .panel,.stage.n2 .panel{align-self:center}
.stage.n3 .panel,.stage.n4 .panel{align-self:start}
.stage.n3 .panel.wide{grid-column:1 / -1}
.panel{position:relative;min-width:0;min-height:0;max-height:100%;overflow:hidden;padding:22px 24px;border:1px solid var(--cyan-soft);border-radius:10px;background:rgba(95,212,230,.04);display:flex;flex-direction:column;gap:14px;
  transition:opacity .5s, transform .5s, width .35s;animation:rise .35s ease-out}
.panel.reading{order:0;border-color:var(--cyan-line);background:var(--cyan-fill);box-shadow:0 0 40px rgba(95,212,230,.12)}
.panel.working{order:1;opacity:.82}
.panel.failed{border-color:var(--bad-line);background:var(--bad-fill)}
.panel.asking{order:-1;border-color:var(--warn-line);background:var(--warn-fill)}
.panel.leaving{opacity:0;transform:scale(.97)}
.panel.queued{display:none}
.stage.n1 .panel{padding:28px 32px}
.stage.n1 .panel .title{font-size:26px}
.scroll{min-height:0;flex:1 1 auto;overflow-y:auto;margin-right:-10px;padding-right:10px;scrollbar-width:thin;scrollbar-color:rgba(95,212,230,.35) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(95,212,230,.35);border-radius:3px}
.rail[hidden]{display:none}
.rail{min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px 0}
.rail-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);padding:4px 2px}
.qchip{display:flex;align-items:stretch;border:1px dashed var(--cyan-soft);border-radius:8px;background:rgba(95,212,230,.03);flex-shrink:0}
.qchip:hover{border-color:var(--cyan-line);background:var(--cyan-track)}
.qchip .open{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.qchip .qt{font-size:14px;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchip .qm{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.qchip .qm.live{color:var(--cyan)}.qchip .qm.bad{color:var(--bad)}
.qchip .x{width:36px;border:0;background:transparent;color:var(--ink-faint);font-size:16px}
.qchip .x:hover{color:var(--ink-strong)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.title{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink-strong);letter-spacing:.3px}
.working .title{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--ink-faint)}
.stage.n1 .working .title{font-size:15px}
.meta{font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap;display:flex;gap:10px;align-items:center}
.close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--ink-faint);font-size:18px;line-height:1}
.close:hover{background:var(--cyan-track);color:var(--ink-strong)}
.reading .head,.failed .head,.asking .head{padding-right:28px}

/* progress */
.bar{height:6px;border-radius:3px;background:var(--cyan-track);overflow:hidden;position:relative}
.fill{height:100%;width:0;background:var(--cyan);transition:width .3s;position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:rgba(255,255,255,.45);animation:sweep 2.2s linear infinite}
.bar.unknown .fill{width:30%;animation:slide 1.4s ease-in-out infinite}
.row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.label{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--cyan-line);background:transparent;color:var(--ink);font-size:14px}
.btn:hover{background:var(--cyan-track)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:var(--ground);font-weight:500}
.btn.primary:hover{background:#8fe3f0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.done{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:14px;color:var(--ink-dim)}

/* results */
.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dev{padding:14px 16px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:4px;min-width:0}
.dev .name{font-size:14px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .state{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink-strong)}
.dev .sub{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.dev.alert{border-color:var(--warn-line);background:var(--warn-fill)}
.dev.alert .state{color:var(--warn)}
.dev.off .state{color:var(--ink-faint)}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:6px 16px;font-size:15px}
.kv .k{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--ink-faint);padding-top:2px;text-transform:uppercase}
.kv .v{color:var(--ink);overflow-wrap:anywhere}
.msg{font-size:16px;line-height:1.5;color:var(--ink-strong)}
.error{font-size:15px;line-height:1.5;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 10px;border:1px solid var(--cyan-soft);border-radius:14px;font-size:13px;color:var(--ink-dim)}
.chip.on{border-color:var(--cyan);color:var(--ink-strong)}
.age{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
.age.stale{color:var(--warn)}
.refresh{height:2px;border-radius:1px;background:var(--cyan-track);overflow:hidden;margin-top:-6px}
.refresh .fill{width:30%;animation:slide 1.4s ease-in-out infinite}
.refresh .fill::after{display:none}
.pin{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:1px}
.pin:hover{color:var(--ink-strong);border-color:var(--cyan-line)}
.pin.on{color:var(--ground);background:var(--cyan);border-color:var(--cyan)}
.more{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ground);background:var(--warn);padding:2px 6px;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:400;color:var(--ink-faint);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid rgba(95,212,230,.2);text-transform:uppercase}
td{padding:8px 10px 8px 0;color:var(--ink);vertical-align:top;max-width:320px}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
/* mailbox */
.mb{display:flex;flex-direction:column;gap:18px}
.mb-group{display:flex;flex-direction:column;gap:10px}
.mb-ghead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase}
.mb-item{padding:16px 18px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:8px;transition:opacity .5s}
.mb-item.urgent{border-color:var(--warn-line)}
.mb-item.done{opacity:.55}
.mb-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mb-title{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink-strong)}
.mb-conf{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.mb-sum{font-size:14px;line-height:1.45;color:var(--ink-dim)}
.mb-effect{font-size:13px;line-height:1.45;color:var(--ink)}
.mb-effect b{font-family:var(--mono);font-size:11px;letter-spacing:1px;font-weight:400;color:var(--cyan)}
details.mb-ev summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
details.mb-ev ul{margin:6px 0 0;padding-left:18px;font-family:var(--mono);font-size:12px;color:var(--ink-dim);line-height:1.6}
.mb-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mb-form[hidden]{display:none}
.mb-form label{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.mb-form input,.mb-form select{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--cyan-soft);background:rgba(4,7,11,.8);color:var(--ink-strong);font:inherit;font-size:14px;color-scheme:dark}
.mb-form input[type=text]{flex:1;min-width:180px}
.day{min-height:32px;min-width:44px;padding:0 8px;border-radius:6px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink-faint);font-family:var(--mono);font-size:12px}
.day[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:var(--ground)}
.mb-item .btns .btn{min-height:36px;font-size:13px}
.btn.quiet{border-color:var(--cyan-soft);color:var(--ink-dim)}
.mb-result{font-size:14px;color:var(--cyan)}
.mb-result.bad{color:var(--bad)}
/* digest */
.dg{display:flex;flex-direction:column;gap:16px}
.dg-sec{display:flex;flex-direction:column;gap:6px}
.dg-h{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase}
.dg-line{font-size:15px;line-height:1.45;color:var(--ink)}
.dg-line .pill{margin-right:8px}
.panel.failed.critical{border-color:var(--bad);box-shadow:0 0 40px rgba(255,143,143,.18)}
/* functions */
.fns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fn{padding:16px 18px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:6px;min-width:0}
.fn .fname{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink-strong)}
.fn .purpose{font-size:14px;line-height:1.4;color:var(--ink-dim)}
.fn .facts{font-family:var(--mono);font-size:12px;color:var(--ink-faint);line-height:1.5}
.fn .btn{min-height:36px;margin-top:4px;font-size:13px}
.fn.planned{opacity:.7}
.pill{display:inline-flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.online{color:var(--cyan)}.pill.unhealthy,.pill.offline{color:var(--bad)}.pill.disabled,.pill.no_policy{color:var(--warn)}.pill.planned{color:var(--ink-faint)}
.tools{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:150px 92px minmax(0,1fr);gap:4px 16px;align-items:baseline;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.tl:first-child{border-top:0}
.tl .tname{font-family:var(--mono);font-size:14px;color:var(--ink-strong)}
.tl .tier{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.tl .tier.act{color:var(--cyan)}.tl .tier.change{color:var(--warn)}.tl .tier.never{color:var(--bad)}
.tl .desc{font-size:14px;color:var(--ink-dim);line-height:1.4}
.tl .use{grid-column:3 / -1;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
/* releases */
.rels{display:flex;flex-direction:column}
.rel{display:grid;grid-template-columns:104px 84px minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.rel:first-child{border-top:0}
.rel .st{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.rel .st.live{color:var(--cyan)}.rel .st.bad{color:var(--bad)}.rel .st.warn{color:var(--warn)}
.rel .sha{font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.rel .what{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .when{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
.rel .why{grid-column:3 / -1;font-size:13px;line-height:1.45;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rel .why.bad{color:var(--bad)}
.rel .svc{grid-column:3 / -1;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

/* ---- command bar ---- */
.bar-wrap{justify-self:center;width:min(720px,90vw);margin:16px 0 28px}
.cmd{width:100%;min-height:48px;padding:12px 18px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-strong);font-family:var(--mono);font-size:16px;outline:none;transition:border-color .2s, background .2s}
.cmd::placeholder{color:rgba(127,167,174,.55)}
.cmd:focus{border-color:var(--cyan-line);background:rgba(95,212,230,.06)}
.cmd:focus::placeholder{color:var(--ink-faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.panel.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 1px var(--cyan),0 0 48px rgba(95,212,230,.45)}100%{box-shadow:0 0 40px rgba(95,212,230,.12)}}
.dev.changed{animation:flash 1.4s ease-out}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  .top{padding:16px}.said{display:none}.reply{font-size:15px}.bar-wrap{margin:12px 0 16px}.panel,.panel.reading{width:100%}.devices{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tl{grid-template-columns:minmax(0,1fr) auto}.tl .desc,.tl .use{grid-column:1 / -1;text-align:left}
  .rel{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px}.rel .sha{display:none}.rel .why,.rel .svc{grid-column:1 / -1}
  .stage.n1 .panel{padding:22px 20px}
  .floor,.floor.has-queue{margin:0 16px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .stage,.stage.n1,.stage.n2{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(var(--rows,1),minmax(0,1fr))}
  .stage.n2{--rows:2}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden}.rail-head{display:none}.qchip{width:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark">AURELIA</div>
  <div class="said" id="said"></div>
  <div class="right">
    <button type="button" class="mailchip" id="mailchip" hidden>0 for review</button>
    <div class="conn" id="conn" role="status"><span class="dot"></span><span id="connText">Connecting…</span></div>
  </div>
</header>
<div class="reply quiet" id="reply" aria-live="polite"></div>
<div class="floor" id="floor">
  <main class="stage n0" id="stage" aria-label="Panels"></main>
  <aside class="rail" id="rail" aria-label="Waiting panels" hidden></aside>
</div>
<form class="bar-wrap" id="form" autocomplete="off">
  <label class="sr" for="cmd">Talk to Aurelia</label>
  <input class="cmd" id="cmd" placeholder="Press / to talk to Aurelia" spellcheck="false">
</form>

<script>
"use strict";
// ---------------------------------------------------------------- setup
const stage = document.getElementById("stage");
const panels = new Map();                       // task_id → panel record (several tasks can feed one panel)
const hidden = new Set();                       // task ids from system users (Chrysalis smoke tests)
const SYSTEM_USERS = new Set(["chrysalis"]);
let session = null;
try { session = localStorage.getItem("aurelia.session"); } catch (e) {}

const TITLES = {
  "orbit.status": "Home", "orbit.lock": "Lock", "orbit.unlock": "Unlock", "orbit.light": "Light",
  "orbit.thermostat": "Thermostat", "orbit.login": "SmartRent sign-in", "orbit.alias": "Nickname",
  "orbit.aliases": "Nicknames", "orbit.forget_alias": "Nickname", "orbit.tv_status": "TV",
  "orbit.tv_power": "TV", "orbit.tv_input": "TV input", "orbit.tv_inputs": "TV inputs", "orbit.tv_app": "TV",
  "orbit.tv_apps": "TV apps", "orbit.tv_remote": "TV remote", "orbit.tv_mute": "TV sound",
  "orbit.tv_discover": "Finding TVs", "probe.echo": "Echo", "probe.functions": "Functions", "probe.function": "Function",
  "chrysalis.release": "New release detected!",
  "parallax.mailbox": "Mailbox", "parallax.digest": "Morning digest", "parallax.analyze": "Looking for patterns", "chrysalis.status": "Updates",
  "chrysalis.releases": "Releases", "chrysalis.rollback": "Rollback", "chrysalis.approve": "Release approval",
};
function titleFor(tool) {
  if (TITLES[tool]) return TITLES[tool];
  const t = (tool.split(".")[1] || tool).replace(/_/g, " ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// Tiny element builder: text only, never HTML, so nothing a tool returns can inject markup.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

// ---------------------------------------------------------------- layout
const STICKY = ["running", "refreshing", "asking"];      // never sent to the queue
const maxVisible = () => (matchMedia("(max-width:640px)").matches ? 2 : 4);
let queueClock = 0;

// Decide what's on screen: at most maxVisible() panels. Past that, the panel
// looked at least recently waits in the rail; a freed slot takes back the most
// recently queued one.
function arrange() {
  const all = recs().filter(p => !p.node.classList.contains("leaving"));
  let visible = all.filter(p => !p.queued);
  while (visible.length > maxVisible()) {
    const byAge = [...visible].sort((a, b) => (a.touched || 0) - (b.touched || 0));
    const victim = byAge.find(p => !STICKY.includes(p.state)) || byAge.find(p => p.state !== "asking");
    if (!victim) break;
    victim.queued = true; victim.queuedAt = ++queueClock;
    visible = visible.filter(p => p !== victim);
  }
  const waiting = all.filter(p => p.queued).sort((a, b) => b.queuedAt - a.queuedAt);
  while (visible.length < maxVisible() && waiting.length) {
    const back = waiting.shift();
    back.queued = false; back.touched = Date.now();
    visible.push(back);
  }
  all.forEach(p => p.node.classList.toggle("queued", !!p.queued));
  // Three panels: the last one gets the full bottom row instead of half of it.
  const shown = [...stage.children].filter(n => all.some(p => p.node === n && !p.queued))
    .map((n, i) => ({ n, i, o: Number(getComputedStyle(n).order) || 0 }))
    .sort((a, b) => a.o - b.o || a.i - b.i).map(x => x.n);             // the order they appear on screen
  shown.forEach((n, i) => n.classList.toggle("wide", shown.length === 3 && i === 2));
  stage.className = "stage n" + Math.min(visible.length, 4);
  renderRail(waiting);
  return { visible: visible.length, waiting: waiting.length };
}

function renderRail(waiting) {
  const rail = document.getElementById("rail");
  document.getElementById("floor").classList.toggle("has-queue", waiting.length > 0);
  rail.hidden = waiting.length === 0;
  rail.replaceChildren(el("div", "rail-head", `WAITING · ${waiting.length}`));
  waiting.forEach(p => {
    const chip = el("div", "qchip");
    const open = el("button", "open"); open.type = "button";
    const meta = p.state === "running" || p.state === "refreshing" ? ["qm live", "running"]
      : p.state === "failed" ? ["qm bad", "failed"] : ["qm", p.memo && p.memo.updated ? "updated" : "ready"];
    open.append(el("span", "qt", p.node.querySelector(".title") ? p.node.querySelector(".title").textContent : titleFor(p.tool)),
                el("span", meta[0], meta[1]));
    open.addEventListener("click", () => { p.queued = false; p.touched = Date.now(); relayout(); });
    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "Dismiss");
    x.addEventListener("click", () => remove(p));
    chip.append(open, x);
    rail.append(chip);
  });
}

function relayout() {
  const { visible, waiting } = arrange();
  const running = recs().filter(p => p.state === "running" || p.state === "refreshing").length;
  const shown = `${visible} panel${visible === 1 ? "" : "s"}` + (waiting ? ` · ${waiting} waiting` : "");
  document.getElementById("connText").textContent =
    ws && ws.readyState === 1 ? (running ? `${running} running · ${shown}` : shown) : connWord;
}
addEventListener("resize", () => relayout());

// Looking at or using a panel keeps it on screen longest.
function track(rec) {
  rec.touched = Date.now();
  const touch = () => { rec.touched = Date.now(); };
  rec.node.addEventListener("pointerdown", touch);
  rec.node.addEventListener("focusin", touch);
}

// Each panel once, however many tasks point at it.
function recs() { return [...new Set(panels.values())]; }

// The open panel showing this look-up, if any (same tool + same arguments).
function openPanelFor(tool, key) {
  if (key === undefined || key === null) return null;
  return recs().find(p => p.tool === tool && p.key === key && ["reading", "refreshing"].includes(p.state)
                          && !p.node.classList.contains("leaving")) || null;
}

function makePanel(taskId, tool) {
  const node = el("section", "panel working");
  node.setAttribute("aria-label", titleFor(tool));
  const rec = { taskId, latestTask: taskId, tool, node, state: "running", unit: null, cancellable: true };
  panels.set(taskId, rec);
  track(rec);
  stage.appendChild(node);
  renderProgress(rec, null);
  relayout();
  return rec;
}

// Finished actions fade after close_after seconds. Hovering holds them; pinned or failed ones stay.
function autoClose(rec) {
  if (!rec.closeAfter || rec.autoArmed) return;
  rec.autoArmed = true;
  const arm = () => { clearTimeout(rec.timer); rec.timer = setTimeout(() => { if (!rec.pinned) remove(rec); }, rec.closeAfter * 1000); };
  rec.node.addEventListener("mouseenter", () => clearTimeout(rec.timer));
  rec.node.addEventListener("mouseleave", arm);
  rec.node.addEventListener("focusin", () => clearTimeout(rec.timer));
  arm();
}

const dismissed = new Set();                    // release panels you closed: don't replay them
function remove(rec, delay) {
  if (rec.tool === "chrysalis.release") dismissed.add(rec.taskId);
  setTimeout(() => {
    rec.node.classList.add("leaving");
    setTimeout(() => {
      rec.node.remove();
      for (const [id, p] of [...panels]) if (p === rec) panels.delete(id);
      relayout();
    }, 500);
  }, delay || 0);
}

function closeButton(rec) {
  const b = el("button", "close", "×");
  b.type = "button";
  b.setAttribute("aria-label", "Dismiss");
  b.addEventListener("click", () => remove(rec));
  return b;
}

// ---------------------------------------------------------------- progress panel
function renderProgress(rec, p) {
  const n = rec.node;
  n.replaceChildren();
  const head = el("div", "head");
  head.append(el("div", "title", titleFor(rec.tool)));
  const known = p && p.total;
  const pct = known ? Math.max(0, Math.min(100, Math.round(100 * p.current / p.total))) : null;
  head.append(el("div", "meta", pct !== null ? `${pct}%` : ""));
  n.append(head);
  if (rec.subtitle) n.append(el("div", "msg", rec.subtitle));
  const bar = el("div", "bar" + (known ? "" : " unknown"));
  const fill = el("div", "fill");
  if (known) fill.style.width = pct + "%";
  bar.append(fill);
  n.append(bar);
  if (p) {
    const unit = p.unit || rec.unit || "";
    const row = el("div", "row");
    const stepText = unit === "steps" && known
      ? `Step ${Math.min(p.total, Math.floor(p.current) + 1)} of ${p.total}`
      : known ? `${fmt(p.current)} / ${fmt(p.total)} ${unit}`.trim() : `${fmt(p.current)} ${unit}`.trim();
    row.append(el("span", null, stepText));
    n.append(row);
    if (p.label) n.append(el("div", "label", p.label));
  }
  if (rec.cancellable) {
    const b = el("button", "btn", "Stop");
    b.type = "button";
    b.addEventListener("click", () => cancel(rec, b));
    n.append(b);
  }
}
function fmt(x) { return typeof x === "number" && !Number.isInteger(x) ? x.toFixed(1) : x; }

async function cancel(rec, button) {
  button.disabled = true; button.textContent = "Stopping…";
  try { await fetch(`/tasks/${rec.taskId}/cancel`, { method: "POST" }); } catch (e) { button.textContent = "Couldn't stop"; }
}

// ---------------------------------------------------------------- result panel
// memo (optional): a saved panel restored from memory → { age, stale, tier, taskId, refreshing, note }
function renderResult(rec, data, memo) {
  rec.data = data;
  const { status, partial, ...rest } = data;
  const n = rec.node;
  n.className = "panel reading";
  n.replaceChildren(closeButton(rec));
  const head = el("div", "head");
  head.append(el("div", "title", resultTitle(rec.tool, rest)));
  const meta = el("div", "meta");
  if (partial || rest.cancelled) meta.append(el("span", "tag", "STOPPED · PARTIAL"));
  if (memo) {
    const words = memo.updated ? ["updated just now"]
      : [memo.stale ? "stale" : null, memo.age, memo.tier === "warm" ? "summary" : null].filter(Boolean);
    if (words.length) meta.append(el("span", "age" + (memo.stale && !memo.updated ? " stale" : ""), words.join(" · ")));
  }
  const pinId = memo && memo.taskId ? memo.taskId : rec.latestTask;
  if (pinId && !/^(confirm|release)-/.test(String(pinId))) meta.append(pinButton(pinId, rec.pinned || (memo && memo.tier === "pinned")));
  head.append(meta);
  n.append(head);
  if (memo && memo.refreshing) { const r = el("div", "refresh"); r.append(el("div", "fill")); n.append(r); }
  if (memo && memo.note) n.append(el("div", "error", memo.note));
  const sc = el("div", "scroll");
  sc.append(body(rec.tool, rest));
  n.append(sc);
}

function pinButton(taskId, pinned) {
  const b = el("button", "pin" + (pinned ? " on" : ""), pinned ? "PINNED" : "PIN");
  b.type = "button";
  b.setAttribute("aria-pressed", pinned ? "true" : "false");
  b.title = "Pinned panels are kept in full, however old";
  b.addEventListener("click", async () => {
    const want = b.getAttribute("aria-pressed") !== "true";
    b.disabled = true;
    try {
      const r = await fetch(`/memory/snapshots/${taskId}/pin`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pinned: want }) });
      if (r.ok) { const owner = [...panels.values()].find(p => p.node.contains(b)); if (owner) { owner.pinned = want; if (want) clearTimeout(owner.timer); }
                  b.setAttribute("aria-pressed", String(want)); b.textContent = want ? "PINNED" : "PIN"; b.classList.toggle("on", want); }
      else say("That panel isn't saved, so it can't be pinned.");
    } catch (e) { say("I can't reach Aurelia right now."); }
    b.disabled = false;
  });
  return b;
}

function resultTitle(tool, d) {
  if (Array.isArray(d.mailbox)) return "Mailbox";
  if (d.digest) return "Morning digest";
  if (typeof d.title === "string") return d.title;
  if (typeof d.function === "string") return d.function;
  if (d.kind && d.name) return d.name;
  if (typeof d.device === "string") return d.device;
  return titleFor(tool);
}

function body(tool, d) {
  const wrap = el("div");
  wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.gap = "14px";
  const used = new Set(["cancelled", "_more"]);

  if (d.message) { wrap.append(el("div", "msg", d.message)); used.add("message"); }
  if (Array.isArray(d.devices) || Array.isArray(d.tvs)) {
    const list = [...(d.devices || []), ...(d.tvs || [])];
    const grid = el("div", "devices");
    list.forEach(x => grid.append(deviceCard(x)));
    (d.other_devices || []).forEach(x => grid.append(otherCard(x)));
    wrap.append(grid);
    if (d.smartrent) wrap.append(el("div", "label", "SmartRent: " + d.smartrent));
    ["devices", "tvs", "other_devices", "smartrent"].forEach(k => used.add(k));
  } else if (d.kind) {
    const grid = el("div", "devices"); grid.append(deviceCard(d)); wrap.append(grid);
    Object.keys(d).forEach(k => used.add(k));
  } else if (typeof d.locked === "boolean") {
    const grid = el("div", "devices");
    grid.append(deviceCard({ name: d.device, kind: "lock", locked: d.locked, online: true }));
    wrap.append(grid); ["device", "locked"].forEach(k => used.add(k));
  } else if (typeof d.muted === "boolean") {
    wrap.append(el("div", "msg", d.muted ? "Muted." : "Sound on.")); ["device", "muted"].forEach(k => used.add(k));
  }
  if (Array.isArray(d.releases)) { wrap.append(releases(d.releases)); used.add("releases"); }
  if (Array.isArray(d.mailbox)) { wrap.append(mailboxView(d.mailbox)); used.add("mailbox"); used.add("counts"); }
  if (d.digest && typeof d.digest === "object") { wrap.append(digestView(d.digest)); used.add("digest"); }
  if (d.release && typeof d.release === "object") { wrap.append(releaseOutcome(d.release)); used.add("release"); used.add("title"); }
  if (Array.isArray(d.functions)) { wrap.append(functionCards(d.functions)); used.add("functions"); }
  if (typeof d.function === "string") { wrap.append(functionDetail(d)); ["function", "state", "state_text", "purpose", "health", "rate_limit", "tools", "last_seen"].forEach(k => used.add(k)); }
  if (Array.isArray(d.inputs)) {
    const chips = el("div", "chips");
    d.inputs.forEach(i => chips.append(el("span", "chip" + (i.showing ? " on" : ""), i.name + (i.showing ? " · showing" : ""))));
    wrap.append(chips); used.add("inputs"); used.add("device");
  }
  if (Array.isArray(d.apps)) {
    const chips = el("div", "chips");
    d.apps.forEach(a => chips.append(el("span", "chip", a)));
    wrap.append(chips); used.add("apps"); used.add("device");
  }
  const rest = Object.fromEntries(Object.entries(d).filter(([k, v]) => !used.has(k) && v !== null && v !== undefined));
  if (Object.keys(rest).length) wrap.append(generic(rest));
  if (d._more) {
    const cut = Object.entries(d._more).map(([k, n]) => `${n} more ${k.replace(/_/g, " ")}`).join(", ");
    wrap.append(el("div", "more", `+ ${cut} (summary; the full panel aged out)`));
  }
  if (!wrap.children.length) wrap.append(el("div", "msg", "Done."));
  return wrap;
}

// Probe: every function at a glance, and one in detail.
function statusPill(status, text) { return el("span", "pill " + status, text || status.replace(/_/g, " ")); }
function usage(runs, failed, last) {
  const bits = [];
  bits.push(runs ? `${runs} run${runs === 1 ? "" : "s"} this week${failed ? ` (${failed} failed)` : ""}` : "not used this week");
  if (last) bits.push(`last used ${last}`);
  return bits.join(" · ");
}
function functionCards(list) {
  const grid = el("div", "fns");
  list.forEach(f => {
    const c = el("div", "fn" + (f.state === "planned" ? " planned" : ""));
    const top = el("div", "head"); top.append(el("div", "fname", f.name), statusPill(f.state));
    c.append(top);
    if (f.purpose) c.append(el("div", "purpose", f.purpose));
    c.append(el("div", "facts", `${f.tools} tool${f.tools === 1 ? "" : "s"} · ${usage(f.runs_7d, f.failed_7d, f.last_used)}`));
    if (f.health) c.append(el("div", "facts", f.health));
    if (f.state !== "online") c.append(el("div", "facts", f.state_text + (f.last_seen ? `, last seen ${f.last_seen}` : "")));
    const b = el("button", "btn", "Details"); b.type = "button";
    b.addEventListener("click", () => fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tool: "probe.function", args: { name: f.name.toLowerCase() } }) }).catch(() => say("I can't reach Aurelia right now.")));
    c.append(b);
    grid.append(c);
  });
  return grid;
}
function functionDetail(d) {
  const box = el("div"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "14px";
  const line = el("div", "head"); line.style.justifyContent = "flex-start";
  line.append(statusPill(d.state, d.state_text));
  box.append(line);
  if (d.purpose) box.append(el("div", "msg", d.purpose));
  const facts = [d.health, d.last_seen ? `Last seen ${d.last_seen}` : null, d.rate_limit ? `Rate limit ${d.rate_limit}` : null].filter(Boolean);
  if (facts.length) box.append(el("div", "facts", facts.join(" · ")));
  const tools = el("div", "tools");
  (d.tools || []).forEach(t => {
    const row = el("div", "tl");
    const tier = String(t.tier || "");
    row.append(el("div", "tname", t.tool), el("div", "tier " + tier.split(" ")[0], tier),
               el("div", "desc", t.what_it_does || ""), el("div", "use", [usage(t.runs_7d, t.failed_7d, null), t.typical ? `typically ${t.typical}` : null, t.last_used].filter(Boolean).join(" · ")));
    tools.append(row);
  });
  box.append(tools);
  return box;
}

// ---------------------------------------------------------------- mailbox
// Deciding happens only here, from your click: there is no tool for it, so
// Aurelia can show you her ideas but never approve them herself.
const KIND_LABEL = { automation: "Automations", criticality: "What matters most", retention: "Keep longer" };
const DAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];

async function decide(id, body) {
  const r = await fetch(`/mailbox/${id}/decide`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                   body: JSON.stringify(body) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof out.detail === "string" ? out.detail : "That didn't work.");
  return out;
}

function mailboxView(items) {
  const box = el("div", "mb");
  if (!items.length) { box.append(el("div", "msg", "Nothing waiting for review.")); return box; }
  const groups = {};
  items.forEach(i => (groups[i.kind] = groups[i.kind] || []).push(i));
  const order = k => { const i = Object.keys(KIND_LABEL).indexOf(k); return i < 0 ? 99 : i; };
  for (const [kind, list] of Object.entries(groups).sort((a, b) => order(a[0]) - order(b[0]))) {
    const g = el("div", "mb-group");
    const head = el("div", "mb-ghead"); head.append(el("span", null, `${KIND_LABEL[kind] || kind} · ${list.length}`));
    if (list.length > 1) {
      const all = el("button", "btn quiet", `Approve all ${list.length}`); all.type = "button";
      all.addEventListener("click", async () => {
        all.disabled = true;
        try {
          const r = await fetch("/mailbox/decide-batch", { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ ids: list.map(i => i.id), action: "approve" }) });
          if (!r.ok) throw new Error();
          g.querySelectorAll(".mb-item").forEach(c => settle(c, "Approved."));
        } catch (e) { all.disabled = false; say("Couldn't approve them all."); }
      });
      head.append(all);
    }
    g.append(head);
    list.forEach(i => g.append(mailboxItem(i)));
    box.append(g);
  }
  return box;
}

function settle(card, text, bad) {
  card.querySelectorAll("button,input,select").forEach(x => { x.disabled = true; });
  const res = card.querySelector(".mb-result") || card.appendChild(el("div", "mb-result"));
  res.className = "mb-result" + (bad ? " bad" : ""); res.textContent = text;
  if (!bad) { card.classList.add("done"); setTimeout(() => card.remove(), 2500); }
}

function mailboxItem(item) {
  const c = el("div", "mb-item" + (item.urgent ? " urgent" : ""));
  const top = el("div", "mb-top");
  top.append(el("span", "mb-title", item.title), el("span", "mb-conf", `${Math.round(item.confidence * 100)}% sure · ${item.age}`));
  c.append(top);
  if (item.summary) c.append(el("div", "mb-sum", item.summary));
  if ((item.evidence || []).length) {
    const ev = el("details", "mb-ev"); ev.append(el("summary", null, `Evidence (${item.evidence.length})`));
    const ul = el("ul"); item.evidence.forEach(e => ul.append(el("li", null, e))); ev.append(ul);
    c.append(ev);
  }
  const eff = el("div", "mb-effect"); eff.append(el("b", null, "IF APPROVED  "), document.createTextNode(item.effect || ""));
  c.append(eff);

  // "Change": edit the parts that make sense for this kind, then approve with your changes.
  const form = el("div", "mb-form"); form.hidden = true;
  const p = item.proposal || {};
  let changes = () => ({});
  if (item.kind === "automation") {
    const time = el("input"); time.type = "time"; time.value = (p.schedule || {}).time || "07:00";
    time.setAttribute("aria-label", "Time");
    const picked = new Set((p.schedule || {}).days || []);
    const days = DAY_KEYS.map(k => { const b = el("button", "day", k); b.type = "button";
      b.setAttribute("aria-pressed", String(picked.has(k)));
      b.addEventListener("click", () => b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"))); return b; });
    form.append(el("label", null, "At"), time, el("label", null, "on"), ...days);
    changes = () => ({ schedule: { ...(p.schedule || {}), time: time.value,
                                   days: days.filter(b => b.getAttribute("aria-pressed") === "true").map(b => b.textContent) } });
  } else if (item.kind === "criticality") {
    const sel = el("select"); ["normal", "high", "critical"].forEach(l => { const o = el("option", null, l); o.value = l; if (l === p.level) o.selected = true; sel.append(o); });
    sel.setAttribute("aria-label", "Level");
    form.append(el("label", null, "Level"), sel);
    changes = () => ({ level: sel.value });
  } else if (item.kind === "retention") {
    const n = el("input"); n.type = "number"; n.min = "1"; n.max = "365"; n.value = p.hot_days || 30; n.style.width = "90px";
    n.setAttribute("aria-label", "Days");
    form.append(el("label", null, "Keep full panels for"), n, el("label", null, "days"));
    changes = () => ({ hot_days: Number(n.value) });
  }
  const reasonForm = el("div", "mb-form"); reasonForm.hidden = true;
  const reason = el("input"); reason.type = "text"; reason.placeholder = "Why not? (optional; helps me not ask again)";
  reason.setAttribute("aria-label", "Reason");
  reasonForm.append(reason);
  c.append(form, reasonForm);

  const btns = el("div", "btns");
  const mk = (text, cls) => { const b = el("button", "btn " + (cls || ""), text); b.type = "button"; return b; };
  const approve = mk("Approve", "primary"), change = mk("Change"), later = mk("Not now", "quiet"), no = mk("Decline", "quiet");
  btns.append(approve, change, later, no);
  c.append(btns);

  const act = async (body, ok) => {
    try { const out = await decide(item.id, body); settle(c, ok || out.done || "Done."); say(out.done || "Done."); }
    catch (e) { settle(c, e.message, true); setTimeout(() => c.querySelectorAll("button,input,select").forEach(x => { x.disabled = false; }), 1500); }
  };
  approve.addEventListener("click", () => form.hidden ? act({ action: "approve" }) : act({ action: "modify", changes: changes() }));
  change.addEventListener("click", () => {
    form.hidden = !form.hidden; reasonForm.hidden = true;
    approve.textContent = form.hidden ? "Approve" : "Approve with changes";
  });
  later.addEventListener("click", () => act({ action: "defer", days: 7 }));
  no.addEventListener("click", () => {
    if (reasonForm.hidden) { reasonForm.hidden = false; form.hidden = true; no.textContent = "Decline for good"; reason.focus(); return; }
    act({ action: "reject", reason: reason.value });
  });
  return c;
}

// ---------------------------------------------------------------- digest
function digestView(d) {
  const box = el("div", "dg");
  box.append(el("div", "facts", d.date || ""));
  if (d.quiet) box.append(el("div", "msg", "A quiet day. Nothing needs you."));
  const section = (title, lines) => { if (!lines.length) return; const sec = el("div", "dg-sec"); sec.append(el("div", "dg-h", title)); lines.forEach(l => sec.append(l)); box.append(sec); };
  if (d.waiting_count) {
    const lines = (d.waiting || []).map(w => el("div", "dg-line", w.title));
    const open = el("button", "btn", "Open the mailbox"); open.type = "button";
    open.addEventListener("click", openMailbox);
    section(`Waiting for you · ${d.waiting_count}`, [...lines, open]);
  }
  section("Ran without you", (d.automatic || []).map(a => {
    const line = el("div", "dg-line");
    const tone = a.outcome === "live" || a.outcome === "completed" ? "online" : ["rolled_back", "failed"].includes(a.outcome) ? "offline" : "disabled";
    line.append(statusPill(tone, String(a.outcome).replace(/_/g, " ")), document.createTextNode(a.what)); return line; }));
  section("Failed", (d.failures || []).map(f => el("div", "dg-line", `${f.what}: ${f.count} time${f.count === 1 ? "" : "s"}${f.last_error ? ` (last: ${f.last_error})` : ""}`)));
  section("Unusual", (d.anomalies || []).map(a => el("div", "dg-line", a)));
  if (d.pattern) section("Noticed", [el("div", "dg-line", d.pattern)]);
  return box;
}

function openMailbox() {
  fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ tool: "parallax.mailbox", args: {} }) }).catch(() => say("I can't reach Aurelia right now."));
}

function updateChip(c) {
  const chip = document.getElementById("mailchip");
  const n = (c && c.waiting) || 0;
  chip.hidden = n === 0;
  chip.textContent = `${n} for review`;
  chip.classList.toggle("urgent", !!(c && c.urgent));
}

// One release, as it finished: what it was, and what happened.
function releaseOutcome(r) {
  const box = el("div"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "10px";
  const tone = { live: "online", rolled_back: "offline", failed: "offline", held: "disabled" }[r.outcome] || "planned";
  const words = { live: "live", rolled_back: "rolled back", failed: "failed", held: "waiting for approval", dry_run: "dry run" }[r.outcome] || r.outcome;
  const top = el("div", "head"); top.style.justifyContent = "flex-start"; top.append(statusPill(tone, words));
  box.append(top);
  if (r.message) box.append(el("div", "msg", r.message));
  box.append(el("div", "facts", [r.sha, r.author, (r.services || []).join(" · ") || null].filter(Boolean).join(" · ")));
  if (r.detail) box.append(el("div", ["rolled_back", "failed"].includes(r.outcome) ? "error" : "facts", r.detail));
  return box;
}

// Chrysalis releases: one line each; the reason only when something went wrong.
function releases(list) {
  const box = el("div", "rels");
  const tone = st => st === "live" ? "live" : ["failed", "rolled_back"].includes(st) ? "bad" : ["held", "testing", "deploying", "verifying"].includes(st) ? "warn" : "";
  list.forEach(r => {
    const row = el("div", "rel");
    const st = String(r.status || "");
    const firstLine = String(r.message || "").split("\n")[0];
    const what = el("div", "what", firstLine || "(no message)"); what.title = r.message || "";
    row.append(el("div", "st " + tone(st), st.replace(/_/g, " ")), el("div", "sha", r.sha || ""), what,
               el("div", "when", when(r.finished_at && r.finished_at !== "None" ? r.finished_at : r.started_at)));
    if (Array.isArray(r.services) && r.services.length) row.append(el("div", "svc", r.services.join(" · ")));
    if (r.detail && st !== "live") { const w = el("div", "why" + (tone(st) === "bad" ? " bad" : ""), r.detail); w.title = r.detail; row.append(w); }
    box.append(row);
  });
  return box;
}
function when(stamp) {
  const t = Date.parse(String(stamp || "").replace(" ", "T"));
  if (isNaN(t)) return "";
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins} min ago`;
  if (mins < 1440) return `${Math.round(mins / 60)} h ago`;
  return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// A device as Orbit describes it.
function deviceCard(d) {
  const c = el("div", "dev");
  let state = "", sub = [];
  if (d.online === false) { state = "Offline"; c.classList.add("off"); }
  else switch (d.kind) {
    case "lock":
      state = d.locked === true ? "Locked" : d.locked === false ? "Unlocked" : "Unknown";
      if (d.locked === false) c.classList.add("alert");
      break;
    case "light":
      state = d.on ? (typeof d.level === "number" ? `On · ${d.level}%` : "On") : "Off";
      if (!d.on) c.classList.add("off");
      break;
    case "thermostat":
      state = d.current_temp != null ? `${d.current_temp}°` : "—";
      if (d.mode === "heat" || d.mode === "aux_heat") sub.push(`Heat to ${d.heat_setpoint}°`);
      else if (d.mode === "cool") sub.push(`Cool to ${d.cool_setpoint}°`);
      else if (d.mode === "auto") sub.push(`Auto ${d.heat_setpoint}–${d.cool_setpoint}°`);
      else if (d.mode) sub.push(`Mode ${d.mode}`);
      if (d.operating_state && d.operating_state !== "idle") sub.push(d.operating_state);
      if (d.humidity != null) sub.push(`${d.humidity}% humidity`);
      break;
    case "leak_sensor":
      state = d.active ? "Leak" : "Dry"; if (d.active) c.classList.add("alert"); break;
    case "motion_sensor":
      state = d.active ? "Motion" : "Still"; break;
    case "tv":
      state = d.on ? "On" : "Off";
      if (!d.on) c.classList.add("off");
      if (d.on && d.app) sub.push(d.app);
      if (d.input && d.input !== d.app) sub.push(d.input);
      break;
    default:
      state = d.kind || "Device";
  }
  if (typeof d.battery === "number") sub.push(`Battery ${d.battery}%`);
  if (typeof d.battery === "number" && d.battery < 20) c.classList.add("alert");
  c.append(el("div", "name", d.name || "Device"), el("div", "state", state));
  if (sub.length) c.append(el("div", "sub", sub.join(" · ")));
  return c;
}

// Devices Orbit doesn't model yet: name + raw readings.
function otherCard(d) {
  const c = el("div", "dev");
  const readings = Object.entries(d.readings || {});
  c.append(el("div", "name", d.name || "Sensor"));
  const main = readings.find(([k]) => ["open", "leak", "motion", "active"].includes(k));
  if (main) {
    const on = String(main[1]) === "true";
    const words = { open: ["Open", "Closed"], leak: ["Leak", "Dry"], motion: ["Motion", "Still"], active: ["Active", "Clear"] }[main[0]];
    c.append(el("div", "state", on ? words[0] : words[1]));
    if (on && (main[0] === "open" || main[0] === "leak")) c.classList.add("alert");
  } else {
    c.append(el("div", "state", (d.kind || "sensor").replace(/_/g, " ")));
  }
  const rest = readings.filter(r => r !== main).map(([k, v]) => `${k.replace(/_/g, " ")} ${v}`);
  if (rest.length) c.append(el("div", "sub", rest.join(" · ")));
  return c;
}

// Anything else: key/value rows, tables for lists of records.
function generic(obj) {
  const kv = el("div", "kv");
  for (const [k, v] of Object.entries(obj)) {
    kv.append(el("div", "k", k.replace(/_/g, " ")));
    const cell = el("div", "v");
    if (Array.isArray(v) && v.length && typeof v[0] === "object" && v[0] !== null) cell.append(table(v));
    else if (Array.isArray(v)) cell.textContent = v.length ? v.join(", ") : "none";
    else if (v && typeof v === "object") cell.append(generic(v));
    else cell.textContent = typeof v === "boolean" ? (v ? "yes" : "no") : String(v);
    kv.append(cell);
  }
  return kv;
}
function table(rows) {
  const cols = [...new Set(rows.flatMap(r => Object.keys(r)))].slice(0, 6);
  const t = el("table"), hr = el("tr");
  cols.forEach(c => hr.append(el("th", null, c.replace(/_/g, " "))));
  t.append(hr);
  rows.slice(0, 50).forEach(r => {
    const tr = el("tr");
    cols.forEach(c => {
      const v = r[c];
      const text = v === null || v === undefined ? "" : Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v);
      const td = el("td"); const span = el("span", "clamp", text); span.title = text; td.append(span); tr.append(td);
    });
    t.append(tr);
  });
  return t;
}

// ---------------------------------------------------------------- live updates
// Actions change what open panels show. Orbit re-reads a device after acting, so
// an action's result carries the device's confirmed state: merge it into any open
// panel showing that device. Look-ups an action declares it changes ("refreshes")
// and that the merge didn't cover are re-run in place.
const norm = x => String(x || "").trim().toLowerCase();

function entitiesOf(d) {
  const out = [];
  if (d.kind && d.name) out.push(d);
  if (typeof d.device === "string" && typeof d.locked === "boolean") out.push({ name: d.device, kind: "lock", locked: d.locked, online: true });
  for (const list of [d.devices, d.tvs]) if (Array.isArray(list)) list.forEach(x => x && x.name && out.push(x));
  return out;
}

function applyEntities(source, ents) {
  const touched = new Set();
  if (!ents.length) return touched;
  for (const p of recs()) {
    if (p === source || !p.data || !["reading", "refreshing"].includes(p.state)) continue;
    const targets = [];
    for (const list of [p.data.devices, p.data.tvs]) if (Array.isArray(list)) targets.push(...list);
    if (p.data.kind && p.data.name) targets.push(p.data);
    const changedNames = new Set();
    for (const ent of ents) {
      const item = targets.find(x => x && norm(x.name) === norm(ent.name) && (!x.kind || !ent.kind || x.kind === ent.kind));
      if (!item || item === ent) continue;
      for (const [k, v] of Object.entries(ent)) {
        if (v === undefined || k === "status" || k === "partial") continue;
        if (JSON.stringify(item[k]) !== JSON.stringify(v)) { item[k] = v; changedNames.add(norm(ent.name)); }
      }
    }
    if (changedNames.size) {
      const memo = p.memo ? { ...p.memo, updated: true, stale: false } : { updated: true };
      p.memo = memo;
      renderResult(p, p.data, memo);
      p.node.querySelectorAll(".dev").forEach(c => {
        if (changedNames.has(norm(c.querySelector(".name") && c.querySelector(".name").textContent))) c.classList.add("changed");
      });
      touched.add(p);
    }
  }
  return touched;
}

async function refreshOpen(tools, skip) {
  for (const p of recs()) {
    if (!tools.includes(p.tool) || skip.has(p) || p.state !== "reading") continue;
    try {
      await fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" },
                              body: JSON.stringify({ tool: p.tool, args: p.args || {}, trigger: "refresh" }) });
    } catch (e) { /* the panel keeps what it shows */ }
  }
}

function flash(rec) {
  rec.node.classList.remove("flash"); void rec.node.offsetWidth; rec.node.classList.add("flash");
}

// ---------------------------------------------------------------- events
function onEvent(ev) {
  const id = ev.task_id, d = ev.data || {};
  if (ev.type === "mailbox.changed") {               // the chip, and an open mailbox panel, stay current
    updateChip(d);
    refreshOpen(["parallax.mailbox"], new Set());
    return;
  }
  if (ev.type === "panel.open" && SYSTEM_USERS.has(d.user)) { hidden.add(id); return; }
  if (hidden.has(id)) { if (ev.type === "panel.close") hidden.delete(id); return; }
  let rec = panels.get(id);
  switch (ev.type) {
    case "panel.open": {
      // Already on screen? Refresh that panel in place instead of opening another.
      const existing = rec ? null : openPanelFor(ev.tool, d.key);
      if (existing) {
        panels.set(id, existing);
        existing.state = "refreshing";
        existing.queued = false; existing.touched = Date.now();      // asked again: bring it back into view
        existing.memo = { ...(existing.memo || {}), refreshing: true, note: null };
        renderResult(existing, existing.data, existing.memo);
        break;
      }
      if (d.trigger === "refresh") { hidden.add(id); return; }      // its panel was closed meanwhile
      rec = rec || makePanel(id, ev.tool);
      Object.assign(rec, { unit: d.unit || null, cancellable: d.cancellable !== false, closeAfter: d.close_after || null,
                           key: d.key, args: d.args || {}, refreshes: d.refreshes || [], tier: d.tier,
                           subtitle: d.subtitle || null, critical: d.critical || null });
      if (d.snapshot) {                              // memory: show the last panel now, refresh behind it
        const sn = d.snapshot;
        rec.state = "refreshing";
        rec.pinned = sn.tier === "pinned";
        rec.memo = { age: sn.age, stale: sn.stale, tier: sn.tier, taskId: sn.task_id, refreshing: true };
        renderResult(rec, { ...sn.data, partial: sn.partial }, rec.memo);
      } else {
        renderProgress(rec, null);
      }
      break;
    }
    case "panel.progress":
      rec = rec || makePanel(id, ev.tool);
      if (rec.state === "running") renderProgress(rec, d);
      break;
    case "panel.result": {
      rec = rec || makePanel(id, ev.tool);
      const wasShowing = !!rec.data && rec.taskId !== id;
      rec.state = "reading";
      rec.latestTask = id;
      if (rec.taskId !== id && !rec.queued) rec.touched = Date.now();   // asked again: keep it in view
      rec.memo = null;                               // fresh data replaces a restored or older panel
      renderResult(rec, d);
      if (wasShowing) flash(rec);
      rec.merged = applyEntities(rec, entitiesOf(d));
      break;
    }
    case "panel.close":
      if (!rec) return;
      if (rec.state === "refreshing" && !d.has_result) {
        // The refresh brought nothing new: keep what's shown and say what happened.
        rec.state = "reading";
        rec.memo = { ...(rec.memo || {}), refreshing: false };
        if (d.status === "failed") rec.memo.note = "Couldn't refresh: " + (d.error || "the tool failed");
        renderResult(rec, rec.data, rec.memo);
      } else if (d.status === "failed" && !d.has_result) {
        rec.state = "failed";
        rec.node.className = "panel failed" + (rec.critical ? " critical" : "");
        rec.node.replaceChildren(closeButton(rec));
        const head = el("div", "head"); head.append(el("div", "title", titleFor(rec.tool)));
        if (rec.critical) { head.append(el("span", "tag", rec.critical.toUpperCase())); flash(rec); }
        rec.node.append(head, el("div", "error", d.error || "That didn't work."));
      } else if (!d.has_result) {
        rec.state = "done";
        rec.node.className = "panel working";
        const head = el("div", "head"); head.append(el("div", "title", titleFor(rec.tool)));
        const done = el("div", "done");
        done.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#5fd4e6" stroke-width="1.6" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7"/></svg>';
        done.append(el("span", null, d.status === "cancelled" ? "Stopped" : "Complete"));
        rec.node.replaceChildren(head, done);
        remove(rec, 1100);
      } else if (rec.state === "running") {
        rec.state = "reading";
      }
      if (d.close_after !== undefined) rec.closeAfter = d.close_after;
      if (d.status !== "failed" && rec.state === "reading" && rec.taskId === id) autoClose(rec);
      // An action finished: re-run the look-ups it changes that the merge didn't already update.
      if (d.status === "completed" && rec.taskId === id && (rec.refreshes || []).length)
        refreshOpen(rec.refreshes, new Set([rec, ...(rec.merged || [])]));
      if (panels.get(id) === rec && rec.taskId !== id) panels.delete(id);   // a refresh task is done with its panel
      break;
  }
  relayout();
}

// ---------------------------------------------------------------- connection
// This page's version, filled in by the orchestrator when it serves the page.
const VIEW_VERSION = "__VIEW_VERSION__";
let ws = null, backoff = 1000, connWord = "Connecting…", connectedBefore = false, digestChecked = false;

// After an update, reload into the new page and re-open the look-ups that were on
// screen; memory shows each one at once while it refreshes.
async function reloadIfUpdated() {
  if (VIEW_VERSION.startsWith("__")) return;
  try {
    const r = await fetch("/view/version", { cache: "no-store" });
    const { version } = await r.json();
    if (!version || version === VIEW_VERSION) return;
    const reopen = recs().filter(p => ["reference", "read"].includes(p.tier) && ["reading", "refreshing"].includes(p.state))
                         .map(p => ({ tool: p.tool, args: p.args || {} }));
    try { sessionStorage.setItem("aurelia.reopen", JSON.stringify(reopen)); } catch (e) {}
    location.reload();
  } catch (e) { /* try again on the next reconnect */ }
}
function reopenAfterReload() {
  let list = [];
  try { list = JSON.parse(sessionStorage.getItem("aurelia.reopen") || "[]"); sessionStorage.removeItem("aurelia.reopen"); } catch (e) {}
  list.forEach(t => fetch("/tasks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(t) }).catch(() => {}));
}

// A release may be under way (the orchestrator itself may be what's being swapped,
// which is why we were disconnected): pick its panel back up from where it is.
async function catchUpOnRelease() {
  try {
    const { events } = await (await fetch("/releases/current", { cache: "no-store" })).json();
    if (!events || !events.length) return;
    const id = events[0].task_id, rec = panels.get(id);
    if (dismissed.has(id) || (rec && rec.state !== "running")) return;           // already showing how it ended
    events.forEach(e => { if (!(e.type === "panel.open" && panels.has(id))) onEvent(e); });
  } catch (e) { /* nothing to catch up on */ }
}

function connect() {
  const conn = document.getElementById("conn");
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => {
    backoff = 1000; conn.className = "conn live"; relayout();
    if (connectedBefore) reloadIfUpdated(); else reopenAfterReload();
    connectedBefore = true;
    catchUpOnRelease();
    fetch("/mailbox/count").then(r => r.json()).then(updateChip).catch(() => {});
    if (!digestChecked) { digestChecked = true; fetch("/digest/check", { method: "POST" }).catch(() => {}); }
  };
  ws.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn("bad event", e); } };
  ws.onclose = () => {
    conn.className = "conn down"; connWord = "Reconnecting…";
    document.getElementById("connText").textContent = connWord;
    setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 10000);
  };
}
connect();

// ---------------------------------------------------------------- talking
const cmd = document.getElementById("cmd");
const reply = document.getElementById("reply");
let replyTimer = null;
function say(text) {
  reply.textContent = text; reply.classList.remove("quiet");
  clearTimeout(replyTimer); replyTimer = setTimeout(() => reply.classList.add("quiet"), 15000);
}

async function ask(text) {
  document.getElementById("said").textContent = "› " + text;
  say("…");
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ text, session_id: session }) });
    const out = await r.json();
    if (!r.ok) { say(out.detail ? String(out.detail) : "Something went wrong."); return; }
    session = out.session_id;
    try { localStorage.setItem("aurelia.session", session); } catch (e) {}
    say(out.reply || "");
    (out.needs_confirmation || []).forEach(showConfirm);
  } catch (e) {
    say("I can't reach Aurelia right now.");
  }
}

function showConfirm(action) {
  const node = el("section", "panel asking");
  const rec = { taskId: "confirm-" + action.action_id, tool: action.tool, node, state: "asking" };
  panels.set(rec.taskId, rec);
  track(rec);
  const head = el("div", "head"); head.append(el("div", "title", titleFor(action.tool)));
  const what = Object.entries(action.args || {}).map(([k, v]) => `${k.replace(/_/g, " ")}: ${v}`).join(" · ");
  const btns = el("div", "btns");
  const yes = el("button", "btn primary", "Go ahead"); yes.type = "button";
  const no = el("button", "btn", "Cancel"); no.type = "button";
  btns.append(yes, no);
  node.append(closeButton(rec), head, el("div", "msg", "This needs your confirmation."));
  if (what) node.append(el("div", "label", what));
  node.append(btns);
  stage.appendChild(node); relayout();
  const answer = async approve => {
    yes.disabled = no.disabled = true;
    try {
      const r = await fetch("/ask/confirm", { method: "POST", headers: { "Content-Type": "application/json" },
                                              body: JSON.stringify({ action_id: action.action_id, approve }) });
      const out = await r.json();
      say(r.ok ? out.reply : (out.detail || "That expired."));
    } catch (e) { say("I can't reach Aurelia right now."); }
    remove(rec);
  };
  yes.addEventListener("click", () => answer(true));
  no.addEventListener("click", () => answer(false));
}

document.getElementById("mailchip").addEventListener("click", openMailbox);
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = cmd.value.trim().replace(/^\/+\s*/, "");      // a "/" typed out of habit isn't part of it
  if (!text) return;
  cmd.value = "";
  ask(text);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== cmd) { e.preventDefault(); cmd.focus(); }
  else if (e.key === "Escape") {
    if (document.activeElement === cmd) cmd.blur();
    else panels.forEach(rec => { if (rec.state !== "running") remove(rec); });
  }
});
</script>
</body>
