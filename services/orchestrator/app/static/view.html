<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelia</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#04121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurelia">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<!--
  The surgical view (minimal, Phase 2). It holds no logic: it renders the
  orchestrator's panel events from /ws and sends what you type to /ask.
  Panel rules from the design doc:
    - nothing to read      → "Complete" for about a second, then it fades out
    - something to read    → the progress panel turns into the result panel
    - one panel            → large; two or more → compact
    - panels you can read sit in front; progress panels recede
  Result panels stay until dismissed (x, or Esc clears all). How result
  panels leave is still an open decision in the design doc.
-->
<style>
:root{
  --ground:#04070b; --ink:#d8f6fb; --ink-strong:#e9fbfe; --ink-dim:#9fc7cd; --ink-faint:#7fa7ae;
  --cyan:#5fd4e6; --cyan-line:rgba(95,212,230,.55); --cyan-soft:rgba(95,212,230,.28);
  --cyan-fill:rgba(95,212,230,.07); --cyan-track:rgba(95,212,230,.12);
  --warn:#f2b35f; --warn-line:rgba(242,179,95,.6); --warn-fill:rgba(242,179,95,.08);
  --bad:#ff8f8f; --bad-line:rgba(255,143,143,.55); --bad-fill:rgba(255,143,143,.07);
  --display:'Chakra Petch',sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans)}
body{overflow:hidden;display:grid;grid-template-rows:auto 96px minmax(0,1fr) auto}
button{font:inherit;color:inherit;cursor:pointer}

/* ---- top line ---- */
/* The top of the screen is the conversation: who you're talking to and when, what you asked, what she said.
   It has a fixed height, so nothing she says (however long) moves the panels. */
.top{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,2.5fr) minmax(max-content,1fr);align-items:center;gap:24px;padding:22px 40px 10px;z-index:5}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.mark{font-family:var(--display);font-size:14px;letter-spacing:6px;color:var(--ink-faint)}
.clock{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--ink-dim);white-space:nowrap}
.clock b{font-weight:500;color:var(--ink-strong)}
.said{font-family:var(--mono);font-size:15px;color:var(--ink-dim);min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:16px;align-items:center;justify-content:flex-end}
.mailchip{white-space:nowrap;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--cyan-line);background:rgba(95,212,230,.08);color:var(--ink-strong);font-family:var(--mono);font-size:12px;letter-spacing:1px}
.mailchip:hover{background:var(--cyan-track)}
.mailchip.urgent{border-color:var(--warn-line);color:var(--warn)}
.mailchip[hidden]{display:none}
.conn{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.conn.live .dot{background:var(--cyan);animation:blink 1.6s ease-in-out infinite}
.conn.down .dot{background:var(--warn)}
.slot{position:relative;min-height:0;margin:0 40px}
.reply{position:absolute;top:0;left:50%;transform:translateX(-50%);width:min(1100px,100%);max-height:100%;overflow:hidden;z-index:15;
  padding:4px 16px 8px;border-radius:10px;text-align:center;font-size:17px;line-height:1.5;color:var(--ink-strong);white-space:pre-line;transition:opacity .6s}
.reply.quiet{opacity:0;pointer-events:none}
.reply.long{-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.reply.open{max-height:55vh;overflow-y:auto;-webkit-mask-image:none;mask-image:none;background:rgba(4,7,11,.94);border:1px solid var(--cyan-soft);box-shadow:0 18px 60px rgba(0,0,0,.6)}
.morebtn{position:absolute;right:0;top:6px;z-index:16;min-height:24px;padding:0 10px;border:1px solid var(--cyan-soft);border-radius:12px;background:var(--ground);color:var(--cyan);font-family:var(--mono);font-size:11px;letter-spacing:1px}
.morebtn[hidden]{display:none}
.morebtn:hover{background:var(--cyan-track)}
/* several requests at once: each keeps its own line */
.reply .ex{padding:8px 0;border-top:1px solid rgba(95,212,230,.12);text-align:left}
.reply .ex:first-child{border-top:0;padding-top:0}
.reply .ex:not(:first-child){opacity:.6}
.reply .q{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply .a{font-size:16px}
.reply .ex.pending .a{color:var(--ink-faint)}

/* ---- the stage ---- */
/* Up to 4 panels share the screen (1 large, 2 side by side, 3-4 in a 2x2 grid);
   each scrolls inside itself. The rest wait as chips in the rail. */
.floor{min-height:0;margin:0 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.floor.has-queue{grid-template-columns:minmax(0,1fr) 220px}
/* A 12-column grid; each panel is placed by how much it has to show (see place()). */
.stage{min-height:0;display:grid;gap:20px;padding:4px;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.stage.n1 .panel,.stage.n2 .panel{align-self:center}
.stage.n3 .panel,.stage.n4 .panel{align-self:start}
.panel{position:relative;min-width:0;min-height:0;max-height:100%;overflow:hidden;padding:22px 24px;border:1px solid var(--cyan-soft);border-radius:10px;background:rgba(95,212,230,.04);display:flex;flex-direction:column;gap:14px;
  transition:opacity .5s, transform .5s, width .35s;animation:rise .35s ease-out}
.panel.reading{order:0;border-color:var(--cyan-line);background:var(--cyan-fill);box-shadow:0 0 40px rgba(95,212,230,.12)}
.panel.working{order:1;opacity:.82}
.panel.failed{border-color:var(--bad-line);background:var(--bad-fill)}
.panel.asking{order:-1;border-color:var(--warn-line);background:var(--warn-fill)}
.panel.leaving{opacity:0;transform:scale(.97)}
.panel.queued{display:none}
/* Every panel shows its number, so "panel 2" and "the third one" mean what you see. */
.panel[data-n]::before{content:attr(data-n);position:absolute;top:0;left:14px;min-width:20px;padding:1px 6px 2px;border-radius:0 0 5px 5px;background:var(--cyan-soft);color:var(--ink-strong);font-family:var(--mono);font-size:11px;text-align:center;line-height:1.3}
.panel.focused{opacity:1;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 48px rgba(95,212,230,.22)}
.panel.focused::before{background:var(--cyan);color:var(--ground)}
.stage.n1 .panel{padding:28px 32px}
.stage.n1 .panel .title{font-size:26px}
/* answer-first: the headline is the answer, big enough to read across the room; the title becomes its label */
.panel.hl .title,.stage.n1 .panel.hl .title{font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint)}
.headline{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.25;color:var(--ink-strong);margin-top:-6px}
.stage.n1 .headline{font-size:30px}
.headline.warn{color:var(--warn)}.headline.bad{color:var(--bad)}
.panel.hl .scroll{color:var(--ink-dim)}
/* next steps: likely follow-ups, sent as ordinary requests */
.next{display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0}
.next:empty{display:none}
.step{min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink);font-size:13px}
.step:hover{border-color:var(--cyan);background:var(--cyan-track);color:var(--ink-strong)}
.step.usual{border-style:dashed}
.step .why{margin-left:6px;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
/* words in her reply that point at something on screen */
.ref{border-bottom:1px dotted var(--cyan-line);cursor:default}
.ref:hover{color:var(--cyan)}
.panel.lit{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 48px rgba(95,212,230,.25)}
.lit .name,.hit.lit .ht,.vid.lit .vt,.fn.lit .fname{color:var(--cyan)}
.dev.lit,.fn.lit{border-color:var(--cyan)}
.hit.lit,.vid.lit{outline:1px solid var(--cyan-line);outline-offset:4px;border-radius:4px}
.scroll{min-height:0;flex:1 1 auto;overflow-y:auto;margin-right:-10px;padding-right:10px;scrollbar-width:thin;scrollbar-color:rgba(95,212,230,.35) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(95,212,230,.35);border-radius:3px}
.rail[hidden]{display:none}
.rail{min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px 0}
.rail-head{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);padding:4px 2px}
.qchip{display:flex;align-items:stretch;border:1px dashed var(--cyan-soft);border-radius:8px;background:rgba(95,212,230,.03);flex-shrink:0}
.qchip:hover{border-color:var(--cyan-line);background:var(--cyan-track)}
.qchip .open{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.qchip .qt{font-size:14px;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchip .qm{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.qchip .qm.live{color:var(--cyan)}.qchip .qm.bad{color:var(--bad)}
.qchip .qh{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qchip .x{width:36px;border:0;background:transparent;color:var(--ink-faint);font-size:16px}
.qchip .x:hover{color:var(--ink-strong)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.title{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink-strong);letter-spacing:.3px}
.working .title{font-size:13px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--ink-faint)}
.stage.n1 .working .title{font-size:15px}
.meta{font-family:var(--mono);font-size:13px;color:var(--ink-dim);white-space:nowrap;display:flex;gap:10px;align-items:center}
.close{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--ink-faint);font-size:18px;line-height:1}
.close:hover{background:var(--cyan-track);color:var(--ink-strong)}
.reading .head,.failed .head,.asking .head{padding-right:28px}

/* progress */
.bar{height:6px;border-radius:3px;background:var(--cyan-track);overflow:hidden;position:relative}
.fill{height:100%;width:0;background:var(--cyan);transition:width .3s;position:relative;overflow:hidden}
.fill::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:rgba(255,255,255,.45);animation:sweep 2.2s linear infinite}
.bar.unknown .fill{width:30%;animation:slide 1.4s ease-in-out infinite}
.row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.label{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--cyan-line);background:transparent;color:var(--ink);font-size:14px}
.btn:hover{background:var(--cyan-track)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:var(--ground);font-weight:500}
.btn.primary:hover{background:#8fe3f0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.done{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:14px;color:var(--ink-dim)}

/* results */
.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.dev{padding:14px 16px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:4px;min-width:0}
.dev .name{font-size:14px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .state{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ink-strong)}
.dev .sub{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.dev.alert{border-color:var(--warn-line);background:var(--warn-fill)}
.dev.alert .state{color:var(--warn)}
.dev.off .state{color:var(--ink-faint)}
.kv{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr);gap:6px 16px;font-size:15px}
.kv .k{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--ink-faint);padding-top:2px;text-transform:uppercase}
.kv .v{color:var(--ink);overflow-wrap:anywhere}
.msg{font-size:16px;line-height:1.5;color:var(--ink-strong)}
.error{font-size:15px;line-height:1.5;color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 10px;border:1px solid var(--cyan-soft);border-radius:14px;font-size:13px;color:var(--ink-dim)}
.chip.on{border-color:var(--cyan);color:var(--ink-strong)}
.age{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
.age.stale{color:var(--warn)}
.refresh{height:2px;border-radius:1px;background:var(--cyan-track);overflow:hidden;margin-top:-6px}
.refresh .fill{width:30%;animation:slide 1.4s ease-in-out infinite}
.refresh .fill::after{display:none}
.pin{min-height:32px;padding:0 10px;border-radius:6px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink-faint);font-family:var(--mono);font-size:11px;letter-spacing:1px}
.pin:hover{color:var(--ink-strong);border-color:var(--cyan-line)}
.pin.on{color:var(--ground);background:var(--cyan);border-color:var(--cyan)}
.more{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--ground);background:var(--warn);padding:2px 6px;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:400;color:var(--ink-faint);text-align:left;padding:0 10px 8px 0;border-bottom:1px solid rgba(95,212,230,.2);text-transform:uppercase}
td{padding:8px 10px 8px 0;color:var(--ink);vertical-align:top;max-width:320px}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
/* the web */
.hits{display:flex;flex-direction:column}
.hit{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.hit:first-child{border-top:0;padding-top:0}
.hit a,.vid a,a.plain{color:var(--ink-strong);text-decoration:none}
.hit a:hover,.vid a:hover{color:var(--cyan);text-decoration:underline}
.hit .ht{font-size:16px;line-height:1.35}
.hit .hs{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.hit .hn{font-size:14px;line-height:1.45;color:var(--ink-dim)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.vid{display:flex;flex-direction:column;gap:6px;min-width:0}
.vid .thumb{aspect-ratio:16/9;border-radius:6px;border:1px solid var(--cyan-soft);background:rgba(95,212,230,.05);overflow:hidden}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .vt{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .vm{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.vid .thumb{position:relative;display:block}
.vid .len{position:absolute;right:6px;bottom:6px;padding:1px 5px;border-radius:3px;background:rgba(4,7,11,.85);font-family:var(--mono);font-size:11px;color:var(--ink-strong)}
.readtext{display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.6;color:var(--ink)}
.readtext p{margin:0}
/* mailbox */
.mb{display:flex;flex-direction:column;gap:18px}
.mb-group{display:flex;flex-direction:column;gap:10px}
.mb-ghead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase}
.mb-item{padding:16px 18px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:8px;transition:opacity .5s}
.mb-item.urgent{border-color:var(--warn-line)}
.mb-item.done{opacity:.55}
.mb-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mb-title{font-family:var(--display);font-size:18px;font-weight:600;color:var(--ink-strong)}
.mb-conf{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.mb-sum{font-size:14px;line-height:1.45;color:var(--ink-dim)}
.mb-code{font-family:var(--mono);font-size:30px;letter-spacing:6px;color:var(--ink-strong);padding:6px 0}
/* devices (Constellation) */
.pdev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.pdev:first-child{border-top:0}
.pdev .dn{font-size:15px;color:var(--ink-strong)}.pdev .dn small{font-family:var(--mono);font-size:11px;color:var(--cyan);margin-left:8px;letter-spacing:1px}
.pdev .dm{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.pdev .db{grid-column:2;grid-row:1 / span 2;display:flex;gap:8px;align-items:center}
.pdev.pending .dn{color:var(--warn)}.pdev.revoked{opacity:.55}
.pdev select.role{font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-dim);background:transparent;border:1px solid var(--cyan-soft);border-radius:4px;padding:4px 6px}
.pdev select.role option{background:#04070b;color:var(--ink)}
.pdev .dv{grid-column:1;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
.pdev .di{grid-column:1;font-size:13px;color:var(--warn)}.pdev .di.urgent{color:var(--bad,#ff7a7a);font-weight:600}
/* a narrow panel (a phone, or a crowded screen): name, details, then the controls on their own line */
.devlist{container-type:inline-size}
@container (max-width:620px){
  .pdev{grid-template-columns:minmax(0,1fr);gap:4px}
  .pdev{padding:12px 0}
  .pdev .db{grid-column:1;grid-row:auto;flex-wrap:nowrap;gap:6px;margin-top:8px}
  .pdev .db select.role{flex:1 1 auto;min-width:0;height:34px;padding:0 4px;font-size:11px;letter-spacing:0}
  .pdev .db .btn{flex:0 0 auto;min-height:0;height:34px;padding:0 10px;font-size:12px}
  .pdev .dn{font-size:16px}.pdev .dm{line-height:1.5}
}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .ml{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.meter .ml b{font-weight:500;color:var(--ink-strong)}
.meter .mb{height:6px;border-radius:3px;background:var(--cyan-track);overflow:hidden}
.meter .mb span{display:block;height:100%;background:var(--cyan)}
.meter.warn .mb span{background:var(--warn)}.meter.warn .ml b{color:var(--warn)}
.diag{display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.4;color:var(--ink-strong)}
.diag div{padding-left:12px;border-left:2px solid var(--warn)}.diag.ok div{border-left-color:var(--cyan)}
.ptab{width:100%;border-collapse:collapse;font-size:13px}
.ptab th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);padding:4px 8px 4px 0}
.ptab td{padding:4px 8px 4px 0;border-top:1px solid rgba(95,212,230,.1);color:var(--ink);white-space:nowrap}
.ptab td.n{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-strong)}.ptab td.num{font-family:var(--mono);text-align:right}
.ptab tr.sys td{color:var(--ink-faint)}
.pdev .rn{font:inherit;font-size:15px;background:transparent;color:var(--ink-strong);border:1px solid var(--cyan);border-radius:6px;padding:2px 8px;width:min(320px,100%)}

.napps{columns:3 180px;column-gap:24px;font-size:14px;line-height:1.9;color:var(--ink)}

.onscr{display:flex;flex-direction:column;gap:10px}
.shotimg{display:block;width:100%;max-width:720px;border-radius:8px;border:1px solid var(--cyan-soft);background:#000}
.pitems{columns:2 220px;column-gap:20px;font-size:14px;line-height:1.35}
.pit{display:flex;gap:8px;align-items:baseline;break-inside:avoid;padding:3px 0;min-width:0}
.pit b{flex:none;min-width:24px;padding:0 5px;border-radius:5px;border:1px solid var(--cyan-soft);font-family:var(--mono);font-size:12px;font-weight:600;text-align:center;color:var(--ink-strong)}
.pit span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.pit i{flex:none;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.vstate{display:flex;flex-direction:column;gap:6px}
.live{display:flex;flex-direction:column;gap:8px;min-height:0}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px 12px}
.cat-group{display:flex;flex-direction:column;gap:8px}
.cat-group>h4{margin:0;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.cat .card{display:flex;flex-direction:column;gap:5px;cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.cat .art{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:rgba(95,212,230,.06);border:1px solid var(--cyan-soft)}
.cat .art.sq{aspect-ratio:1/1}
.cat.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.cat .art.wide{aspect-ratio:16/9}
.cat .art .live{position:absolute;right:6px;top:6px;font-size:11px;padding:0 6px;border-radius:9px;background:#b3261e;color:#fff}
.cat .art img{width:100%;height:100%;object-fit:cover;display:block}
.cat .art .n{position:absolute;left:6px;top:6px;min-width:20px;padding:0 5px;border-radius:5px;background:#04121a;color:#e9fbfe;font:700 12px/1.5 ui-monospace,Menlo,monospace;text-align:center}
.cat .art .seen{position:absolute;right:6px;top:6px;font-size:11px;padding:0 6px;border-radius:9px;background:rgba(4,18,26,.85);color:var(--ink-dim)}
.cat .art .rb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.cat .art .rb span{display:block;height:100%;background:var(--cyan)}
.cat .t{font-size:13px;line-height:1.3;color:var(--ink-strong);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat .s{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowp{display:flex;gap:16px;align-items:flex-start;min-width:0;flex-shrink:0}
.nowp .art{flex:0 0 96px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;border:1px solid var(--cyan-soft);background:rgba(95,212,230,.06)}
.nowp .art.sq{aspect-ratio:1/1}
.nowp .art.wide{flex-basis:160px;aspect-ratio:16/9}
.nowp .art img{width:100%;height:100%;object-fit:cover;display:block}
.nowp .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nowp .vline{flex-wrap:wrap;gap:2px 12px}
.nowp .vpos{white-space:nowrap}
@media (max-width:520px){.nowp{gap:12px}.nowp .art{flex-basis:64px}.nowp .ttl{font-size:15px}.cat{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}}
.nowp .ttl{font-size:17px;color:var(--ink-strong);line-height:1.3}
.live .screen{position:relative;background:#000;border:1px solid var(--cyan-soft);border-radius:6px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:pointer}
.live .screen img{width:100%;height:100%;object-fit:contain;display:block}
.live .screen .wait{position:absolute;font-size:13px;color:var(--ink-dim);padding:12px;text-align:center}
.live .lbar{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font-size:12px;line-height:1.5;color:var(--ink-dim)}
.live .lbar>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e5484d;margin-right:6px;vertical-align:middle}
.live.paused .dot,.live.stale .dot{background:var(--ink-dim)}
.vbar{height:6px;border-radius:3px;background:var(--cyan-track);overflow:hidden}
.vbar span{display:block;height:100%;background:var(--cyan)}
.vline{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.vpos{color:var(--ink-strong)}
.mb-effect{font-size:13px;line-height:1.45;color:var(--ink)}
.mb-effect b{font-family:var(--mono);font-size:11px;letter-spacing:1px;font-weight:400;color:var(--cyan)}
details.mb-ev summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
details.mb-ev ul{margin:6px 0 0;padding-left:18px;font-family:var(--mono);font-size:12px;color:var(--ink-dim);line-height:1.6}
.mb-form{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mb-form[hidden]{display:none}
.mb-form label{font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
.mb-form input,.mb-form select{min-height:36px;padding:0 10px;border-radius:6px;border:1px solid var(--cyan-soft);background:rgba(4,7,11,.8);color:var(--ink-strong);font:inherit;font-size:14px;color-scheme:dark}
.mb-form input[type=text]{flex:1;min-width:180px}
.mb-form input[type=checkbox]{min-height:0;width:18px;height:18px;padding:0;accent-color:var(--cyan)}
.day{min-height:32px;min-width:44px;padding:0 8px;border-radius:6px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink-faint);font-family:var(--mono);font-size:12px}
.day[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:var(--ground)}
.mb-item .btns .btn{min-height:36px;font-size:13px}
.btn.quiet{border-color:var(--cyan-soft);color:var(--ink-dim)}
.mb-result{font-size:14px;color:var(--cyan)}
.mb-result.bad{color:var(--bad)}
/* digest */
.dg{display:flex;flex-direction:column;gap:16px}
.dg-sec{display:flex;flex-direction:column;gap:6px}
.dg-h{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink-faint);text-transform:uppercase}
.dg-line{font-size:15px;line-height:1.45;color:var(--ink)}
.dg-line .pill{margin-right:8px}
.panel.failed.critical{border-color:var(--bad);box-shadow:0 0 40px rgba(255,143,143,.18)}
/* the record (Mnemosyne) */
.recs{display:flex;flex-direction:column}
.rec{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid rgba(95,212,230,.12)}
.rec:first-child{border-top:0;padding-top:0}
.rec .rw{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.rec .rw span{color:var(--ink-faint)}
.rec .rs{font-size:15px;line-height:1.5;color:var(--ink)}
.rl{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase;margin-top:2px}
.rec ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--ink-dim)}
.facts{display:flex;flex-direction:column}
.fact{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid rgba(95,212,230,.12);transition:opacity .4s}
.fact:first-child{border-top:0}
.fact .ftx{flex:1;min-width:0;font-size:15px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
.fact .fd{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.fact .fx{flex-shrink:0;width:36px;height:36px;border:0;border-radius:6px;background:transparent;color:var(--ink-faint);font-size:16px}
.fact .fx:hover{background:var(--cyan-track);color:var(--ink-strong)}
.fact.gone{opacity:.35}
.fact .star{font-size:17px}.fact .star.on{color:var(--cyan)}
.fgroup{padding-top:12px}.fgroup:first-child{padding-top:0}
.fgroup + .fact{border-top:0}
.quote{padding:10px 14px;border-left:2px solid var(--cyan);font-size:16px;line-height:1.45;color:var(--ink-strong)}
/* Kepler: research, library, teaching */
.ans{display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.6;color:var(--ink)}
.ans p{margin:0}
.cite{display:inline-block;min-width:18px;margin:0 1px;padding:0 4px;border-radius:4px;background:var(--cyan-track);color:var(--cyan);font-family:var(--mono);font-size:11px;line-height:1.6;text-align:center;text-decoration:none;vertical-align:1px}
.cite:hover{background:var(--cyan);color:var(--ground)}
.kl{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.55;color:var(--ink-dim)}
.srcs{display:flex;flex-direction:column;gap:4px;font-size:13px}
.src{display:flex;gap:8px;align-items:baseline;min-width:0}
.src .sn{font-family:var(--mono);font-size:11px;color:var(--cyan);min-width:22px}
.src a{color:var(--ink-strong);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src a:hover{color:var(--cyan);text-decoration:underline}
.src .ss{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.src.unused{opacity:.55}
.lib-note{padding:10px 12px;border-left:2px solid var(--cyan-line);font-size:13px;line-height:1.5;color:var(--ink-dim)}
.lib-note b{font-weight:500;color:var(--ink-strong)}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tcard{padding:14px 16px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:6px;text-align:left;color:inherit}
.tcard:hover{border-color:var(--cyan-line);background:var(--cyan-track)}
.tcard .tn{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink-strong)}
.tcard .tsum{font-size:13px;line-height:1.45;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tcard .tm{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:8px 0;border-top:1px solid rgba(95,212,230,.12)}
.rrow:first-child{border-top:0}
.rrow .rq{font-size:14px;color:var(--ink-strong)}.rrow .rd{font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}
.rrow .rh{grid-column:1 / -1;font-size:13px;color:var(--ink-dim)}
.analogy{padding:10px 14px;border-radius:8px;background:var(--cyan-fill);border:1px solid var(--cyan-soft);font-size:14px;line-height:1.5;color:var(--ink)}
.quiz{display:flex;flex-direction:column;gap:16px}
.qz{display:flex;flex-direction:column;gap:8px}
.qz .qq{font-size:15px;line-height:1.45;color:var(--ink-strong)}
.qz .qo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qz .opt{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--cyan-soft);background:transparent;color:var(--ink);font-size:14px;text-align:left}
.qz .opt:hover:not(:disabled){border-color:var(--cyan);background:var(--cyan-track)}
.qz .opt.qright{border-color:var(--cyan);background:rgba(95,212,230,.16);color:var(--ink-strong)}
.qz .opt.qwrong{border-color:var(--bad-line);background:var(--bad-fill);color:var(--bad)}
.qz .opt:disabled{cursor:default}
.qz .why{font-size:13px;line-height:1.45;color:var(--ink-dim)}
.qscore{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink-strong)}
/* functions */
.fns{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fn{padding:16px 18px;border:1px solid var(--cyan-soft);border-radius:8px;background:rgba(4,7,11,.5);display:flex;flex-direction:column;gap:6px;min-width:0}
.fn .fname{font-family:var(--display);font-size:20px;font-weight:600;color:var(--ink-strong)}
.fn .purpose{font-size:14px;line-height:1.4;color:var(--ink-dim)}
.fn .facts{font-family:var(--mono);font-size:12px;color:var(--ink-faint);line-height:1.5}
.fn .btn{min-height:36px;margin-top:4px;font-size:13px}
.fn.planned{opacity:.7}
.pill{display:inline-flex;gap:7px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.online{color:var(--cyan)}.pill.unhealthy,.pill.offline{color:var(--bad)}.pill.disabled,.pill.no_policy{color:var(--warn)}.pill.planned{color:var(--ink-faint)}
.tools{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:150px 92px minmax(0,1fr);gap:4px 16px;align-items:baseline;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.tl:first-child{border-top:0}
.tl .tname{font-family:var(--mono);font-size:14px;color:var(--ink-strong)}
.tl .tier{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.tl .tier.act{color:var(--cyan)}.tl .tier.change{color:var(--warn)}.tl .tier.never{color:var(--bad)}
.tl .desc{font-size:14px;color:var(--ink-dim);line-height:1.4}
.tl .use{grid-column:3 / -1;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}
/* releases */
.rels{display:flex;flex-direction:column}
.rel{display:grid;grid-template-columns:104px 84px minmax(0,1fr) auto;gap:4px 16px;align-items:baseline;padding:10px 0;border-top:1px solid rgba(95,212,230,.12)}
.rel:first-child{border-top:0}
.rel .st{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.rel .st.live{color:var(--cyan)}.rel .st.bad{color:var(--bad)}.rel .st.warn{color:var(--warn)}
.rel .sha{font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.rel .what{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .when{font-family:var(--mono);font-size:12px;color:var(--ink-faint);white-space:nowrap}
.rel .why{grid-column:3 / -1;font-size:13px;line-height:1.45;color:var(--ink-dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rel .why.bad{color:var(--bad)}
.rel .svc{grid-column:3 / -1;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}

/* ---- command bar ---- */
/* the bottom row: what's worth a glance on the left, the command bar, what's running on the right */
.bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,900px) minmax(0,1fr);align-items:end;gap:28px;padding:14px 40px 24px}
.bar-wrap{width:100%;display:flex;gap:10px;align-items:center}
.glance{min-width:0;display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:12px;line-height:1.35}
.glance.right{align-items:flex-end;text-align:right}
.gl{display:flex;gap:8px;align-items:baseline;max-width:100%;padding:2px 0;border:0;background:transparent;color:var(--ink-dim);font:inherit;text-align:inherit}
button.gl:hover{color:var(--ink-strong)}
.gl::before{content:"";flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--ink-faint);transform:translateY(-1px)}
.gl.warn{color:var(--warn)}.gl.warn::before{background:var(--warn)}
.gl.bad{color:var(--bad)}.gl.bad::before{background:var(--bad)}
.gl.live::before{background:var(--cyan);animation:blink 1.6s ease-in-out infinite}
.gl .t{overflow-wrap:anywhere}
.gl .s{color:var(--ink-faint);white-space:nowrap}
.glance.right .gl{flex-direction:row-reverse}
.focuschip{flex-shrink:0;max-width:45%;min-height:36px;padding:0 10px 0 12px;border-radius:18px;border:1px solid var(--cyan);background:rgba(95,212,230,.12);color:var(--ink-strong);font-family:var(--mono);font-size:12px;display:flex;gap:8px;align-items:center}
.focuschip[hidden]{display:none}
.focuschip .ft{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focuschip .fx{color:var(--ink-faint);font-size:15px;line-height:1}
.focuschip:hover .fx{color:var(--ink-strong)}
.cmd{width:100%;min-height:48px;padding:12px 18px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-strong);font-family:var(--mono);font-size:16px;outline:none;transition:border-color .2s, background .2s}
.cmd::placeholder{color:rgba(127,167,174,.55)}
.cmd:focus{border-color:var(--cyan-line);background:rgba(95,212,230,.06)}
.cmd:focus::placeholder{color:var(--ink-faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.panel.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 1px var(--cyan),0 0 48px rgba(95,212,230,.45)}100%{box-shadow:0 0 40px rgba(95,212,230,.12)}}
.dev.changed{animation:flash 1.4s ease-out}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  body{grid-template-rows:auto 84px minmax(0,1fr) auto}
  .top{grid-template-columns:auto 1fr;padding:16px 16px 6px}.said{display:none}.slot{margin:0 16px}.reply{font-size:15px}
  .bottom{grid-template-columns:minmax(0,1fr);padding:8px 16px 14px;gap:8px}
  .glance.right{display:none}
  .glance{flex-direction:row;flex-wrap:wrap;gap:4px 14px;order:-1}
  .reply{width:calc(100% - 56px);left:0;transform:none}
  .fact .fd{display:none}.mailchip{white-space:nowrap}.right{gap:10px}.clock .date{display:none}#connText{display:none}.panel,.panel.reading{width:100%}.devices{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tl{grid-template-columns:minmax(0,1fr) auto}.tl .desc,.tl .use{grid-column:1 / -1;text-align:left}
  .rel{grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px}.rel .sha{display:none}.rel .why,.rel .svc{grid-column:1 / -1}
  .stage.n1 .panel{padding:22px 20px}
  .floor,.floor.has-queue{margin:0 16px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .headline,.stage.n1 .headline{font-size:21px}
  .rail{flex-direction:row;overflow-x:auto;overflow-y:hidden}.rail-head{display:none}.qchip{width:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- screen mode: a computer running her shell (the TV). Nobody types here; it shows her. ---- */
body.screen .said,body.screen .slot,body.screen #form,body.screen .mailchip,body.screen .conn{display:none!important}
@media (display-mode:standalone){.top{padding-top:max(16px,env(safe-area-inset-top))}.bottom{padding-bottom:max(12px,env(safe-area-inset-bottom))}}
body.screen .top{justify-content:center}
body.screen{grid-template-rows:auto minmax(0,1fr) auto}   /* no reply slot here: panels get its row */
body.screen .floor{padding-top:32px}
body.screen .brand{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
body.screen .mark{font-size:22px;letter-spacing:14px;color:var(--ink-dim)}
body.screen .clock{font-family:var(--display);font-size:clamp(64px,11vw,168px);letter-spacing:2px;color:var(--ink-strong)}
body.screen .clock .date{display:block!important;font-family:var(--mono);font-size:clamp(14px,1.6vw,22px);letter-spacing:3px;color:var(--ink-dim);text-align:center;margin-top:6px}
body.screen .glance{font-size:15px}
/* ---- ambient: a presentation display with nothing on it. Dim, calm, dark at quiet hours. ---- */
body.ambient .brand,body.ambient .glance{opacity:var(--dim,.55);transition:opacity 1.2s ease}
body.ambient .weather{font-family:var(--mono);font-size:clamp(14px,1.7vw,24px);letter-spacing:2px;color:var(--ink-dim);text-align:center}

.weather:empty{display:none}
/* a panel sent to a presentation display: shown big, from across the room */

<body>
<header class="top">
  <div class="brand"><div class="mark">AURELIA</div><div class="clock" id="clock"></div><div class="weather" id="weather"></div></div>
  <div class="said" id="said"></div>
  <div class="right">
    <button type="button" class="mailchip" id="notify" hidden>Notify me</button>
    <button type="button" class="mailchip" id="mailchip" hidden>0 for review</button>
    <div class="conn" id="conn" role="status"><span class="dot"></span><span id="connText">Connecting…</span></div>
  </div>
</header>
<div class="slot"><div class="reply quiet" id="reply" aria-live="polite"></div><button type="button" class="morebtn" id="more" hidden>MORE</button></div>
<div class="floor" id="floor">
  <main class="stage n0" id="stage" aria-label="Panels"></main>
  <aside class="rail" id="rail" aria-label="Waiting panels" hidden></aside>
</div>
<div class="bottom">
<aside class="glance" id="glanceL" aria-label="Worth a glance"></aside>
<form class="bar-wrap" id="form" autocomplete="off">
  <label class="sr" for="cmd">Talk to Aurelia</label>
  <button type="button" class="focuschip" id="focuschip" hidden title="Stop focusing this panel"></button>
  <input class="cmd" id="cmd" placeholder="Press / to talk to Aurelia" spellcheck="false">
</form>
<aside class="glance right" id="glanceR" aria-label="Running"></aside>
</div>

<script>
// Screen mode: /view?screen=<node> is a computer running her shell (signed in by its own agent).
const SCREEN = new URLSearchParams(location.search).get("screen");
if (SCREEN) document.body.classList.add("screen", "ambient");
// A browser chosen as a presentation display (a wall tablet) behaves like a node's screen: it shows
// only what's sent to it, over the ambient screen. Its role is set on the devices panel.
_fetchMe();
async function _fetchMe() {
  try {
    const me = await (await window.fetch("/view/me", { cache: "no-store" })).json();
    if (me && me.role === "presentation" && !document.body.classList.contains("screen")) {
      document.body.classList.add("screen", "ambient"); tick(); relayout(); loadAmbient();
    }
  } catch (e) { /* the normal display, then */ }
}
// The ambient screen: dim (how dim is set on the server), the weather, dark at quiet hours.
let ambientTimer = null;
async function loadAmbient() {
  clearTimeout(ambientTimer); ambientTimer = setTimeout(loadAmbient, 5 * 60 * 1000);
  if (!document.body.classList.contains("ambient")) return;
  try {
    const a = await (await window.fetch("/ambient", { cache: "no-store" })).json();
    document.body.style.setProperty("--dim", String(a.dim ?? .55));
    document.body.classList.toggle("quiet", !!a.quiet);
    const w = document.getElementById("weather"), x = a.weather;
    w.replaceChildren(...(x ? [el("b", null, `${x.temp}${x.unit}`),
                               document.createTextNode(`${x.sky}${x.sky ? "  ·  " : ""}H ${x.high}°  L ${x.low}°`)] : []));
  } catch (e) { /* try again later */ }
}

// If this browser's key is revoked (or it was never paired), every call answers 401: go pair.
const _fetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await _fetch(...args);
  if (r.status === 401 && !SCREEN) location.replace("/pair?next=" + encodeURIComponent(location.pathname + location.search));
  return r;
};

"use strict";
// ---------------------------------------------------------------- setup
const stage = document.getElementById("stage");
const panels = new Map();                       // task_id → panel record (several tasks can feed one panel)
const hidden = new Set();                       // task ids from system users (Chrysalis smoke tests)
const SYSTEM_USERS = new Set(["chrysalis"]);
let session = null;
try { session = localStorage.getItem("aurelia.session"); } catch (e) {}
// Made here rather than by the first reply, so requests sent before that reply share one conversation.
if (!session || !/^[A-Za-z0-9_-]{8,64}$/.test(session)) {
  session = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
  try { localStorage.setItem("aurelia.session", session); } catch (e) {}
}
let focused = null;                             // the panel you clicked: what you type is about it
const cmd = document.getElementById("cmd");

const TITLES = { "aurelia.reply": "Aurelia", "quasar.now": "Now playing",
  "orbit.status": "Home", "orbit.lock": "Lock", "orbit.unlock": "Unlock", "orbit.light": "Light",
  "orbit.thermostat": "Thermostat", "orbit.login": "SmartRent sign-in", "orbit.alias": "Nickname",
  "orbit.aliases": "Nicknames", "orbit.forget_alias": "Nickname", "orbit.tv_status": "TV",
  "orbit.tv_power": "TV", "orbit.tv_input": "TV input", "orbit.tv_inputs": "TV inputs", "orbit.tv_app": "TV",
  "orbit.tv_apps": "TV apps", "orbit.tv_remote": "TV remote", "orbit.tv_mute": "TV sound",
  "orbit.tv_discover": "Finding TVs", "probe.echo": "Echo", "probe.functions": "Functions", "probe.function": "Function",
  "chrysalis.release": "New release detected!",
  "nebula.search": "Web search", "nebula.youtube": "YouTube", "nebula.read": "Reading",
  "nebula.download": "Download", "nebula.open": "Link",
  "parallax.mailbox": "Mailbox", "parallax.digest": "Morning digest", "parallax.analyze": "Looking for patterns", "chrysalis.status": "Updates",
  "chrysalis.releases": "Releases", "chrysalis.rollback": "Rollback", "chrysalis.approve": "Release approval",
  "mnemosyne.recall": "Recall", "mnemosyne.facts": "Remembered", "mnemosyne.remember": "Remember",
  "mnemosyne.forget": "Forget",
  "kepler.research": "Research", "kepler.recall": "Library", "kepler.topic": "Topic", "kepler.explain": "Explanation",
  "kepler.quiz": "Quiz", "kepler.read_pdf": "PDF", "kepler.forget": "Forget",
  "constellation.devices": "Devices", "constellation.open": "Open", "constellation.apps": "Apps",
  "constellation.home": "Home", "constellation.look": "On the screen", "constellation.click": "Click",
  "constellation.type": "Type", "constellation.press": "Key", "constellation.scroll": "Scroll",
  "constellation.back": "Back", "constellation.media": "Playing", "constellation.sound": "Sound", "constellation.watch": "Live", "quasar.find": "Library", "quasar.play": "Playing", "constellation.install": "Install", "constellation.clipboard": "Clipboard", "constellation.mode": "Mode", "constellation.copy": "Copied", "constellation.paste": "Paste", "constellation.install_package": "Install", "constellation.uninstall": "Remove", "constellation.remove_package": "Remove", "constellation.submit": "Press",
  "constellation.health": "Computer health", "constellation.list_processes": "Processes",
  "constellation.close_process": "Close a program", "constellation.kill_process": "Close a program",
};
function titleFor(tool) {
  if (TITLES[tool]) return TITLES[tool];
  const t = (tool.split(".")[1] || tool).replace(/_/g, " ");
  return t.charAt(0).toUpperCase() + t.slice(1);
}

// Tiny element builder: text only, never HTML, so nothing a tool returns can inject markup.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

// ---------------------------------------------------------------- layout
const STICKY = ["running", "refreshing", "asking"];      // never sent to the queue
const maxVisible = () => (matchMedia("(max-width:640px)").matches ? 2 : 4);
let queueClock = 0;

// Decide what's on screen: at most maxVisible() panels. Past that, the panel
// looked at least recently waits in the rail; a freed slot takes back the most
// recently queued one.
function arrange() {
  const all = recs().filter(p => !p.node.classList.contains("leaving"));
  let visible = all.filter(p => !p.queued);
  while (visible.length > maxVisible()) {
    const byAge = [...visible].sort((a, b) => (a.touched || 0) - (b.touched || 0));
    const victim = byAge.find(p => !STICKY.includes(p.state)) || byAge.find(p => p.state !== "asking");
    if (!victim) break;
    victim.queued = true; victim.queuedAt = ++queueClock;
    visible = visible.filter(p => p !== victim);
  }
  const waiting = all.filter(p => p.queued).sort((a, b) => b.queuedAt - a.queuedAt);
  const returning = waiting.filter(p => !p.tucked);               // tucked-away panels come back only when you ask
  while (visible.length < maxVisible() && returning.length) {
    const back = returning.shift();
    back.queued = false; back.touched = Date.now();
    visible.push(back);
  }
  all.forEach(p => { p.node.classList.toggle("queued", !!p.queued); p.node.classList.toggle("focused", p === focused); });
  stage.className = "stage n" + Math.min(visible.length, 4);
  place(visible);
  const still = all.filter(p => p.queued).sort((a, b) => b.queuedAt - a.queuedAt);
  renderRail(still);
  return { visible: visible.length, waiting: still.length };
}

// ---- sizing: each panel gets the room its content needs --------------------------------
// small: one fact or one device; medium: a set of cards; large: something to read or scan.
function sizeClass(tool, d) {
  if (!d) return "m";
  if (d.research || d.library || d.topic) return "l";
  if (d.explain || d.quiz) return "m";
  if (Array.isArray(d.results) || Array.isArray(d.videos) || (typeof d.text === "string" && d.url) || Array.isArray(d.recall)
      || Array.isArray(d.mailbox) || Array.isArray(d.functions) || (Array.isArray(d.releases) && d.releases.length > 1)) return "l";
  if ((d.kind && d.name) || typeof d.locked === "boolean" || typeof d.muted === "boolean" || typeof d.remembered_fact === "string"
      || typeof d.forgot === "string" || (d.link && d.link.url) || typeof d.saved_to === "string" || Array.isArray(d.inputs)
      || (d.cancelled && !Array.isArray(d.results))) return "s";
  return "m";
}
function weight(p) {
  if (["asking", "running", "done", "failed"].includes(p.state)) return 1;
  return { s: 1, m: 2, l: 3 }[sizeClass(p.tool, p.data)] || 2;
}
const STATE_ORDER = { asking: -1, reading: 0, refreshing: 0 };
function place(visible) {
  const dom = [...stage.children];
  const list = [...visible].sort((a, b) => (STATE_ORDER[a.state] ?? 1) - (STATE_ORDER[b.state] ?? 1)
                                           || dom.indexOf(a.node) - dom.indexOf(b.node));
  recs().filter(p => p.queued).forEach(p => { p.node.style.gridRow = p.node.style.gridColumn = ""; });
  let rows;
  if (matchMedia("(max-width:640px)").matches) rows = list.map(p => [p]);
  else if (list.length <= 2) rows = [list];
  else if (list.length === 3) {
    const big = list.find(p => weight(p) === 3);
    rows = big ? [[big], list.filter(p => p !== big)] : [list.slice(0, 2), [list[2]]];
  } else rows = [list.slice(0, 2), list.slice(2)];
  rows = rows.filter(r => r.length);
  stage.style.gridTemplateRows = `repeat(${Math.max(rows.length, 1)}, minmax(0,1fr))`;
  rows.forEach((row, ri) => {
    if (row.length === 1) {
      const w = weight(row[0]);
      row[0].node.style.gridColumn = rows.length > 1 || matchMedia("(max-width:640px)").matches ? "1 / -1"
        : w === 1 ? "4 / span 6" : w === 2 ? "2 / span 10" : "1 / -1";
      row[0].node.style.gridRow = String(ri + 1);
      return;
    }
    const ws = row.map(weight), total = ws.reduce((a, b) => a + b, 0);
    let start = 1;
    row.forEach((p, i) => {
      const span = i === row.length - 1 ? 13 - start : Math.max(3, Math.round(12 * ws[i] / total));
      p.node.style.gridColumn = `${start} / span ${span}`;
      p.node.style.gridRow = String(ri + 1);
      start += span;
    });
  });
}

function renderRail(waiting) {
  const rail = document.getElementById("rail");
  document.getElementById("floor").classList.toggle("has-queue", waiting.length > 0);
  rail.hidden = waiting.length === 0;
  rail.replaceChildren(el("div", "rail-head", `WAITING · ${waiting.length}`));
  waiting.forEach(p => {
    const chip = el("div", "qchip");
    const open = el("button", "open"); open.type = "button";
    const meta = p.state === "running" || p.state === "refreshing" ? ["qm live", "running"]
      : p.state === "failed" ? ["qm bad", "failed"] : ["qm", p.memo && p.memo.updated ? "updated" : "ready"];
    open.append(el("span", "qt", (p.num ? p.num + " · " : "") + panelTitle(p)),
                p.tucked && p.headline && p.state === "reading" ? el("span", "qh", p.headline) : el("span", meta[0], meta[1]));
    open.addEventListener("click", () => { p.queued = false; p.tucked = false; p.touched = Date.now(); relayout(); });
    const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", "Dismiss");
    x.addEventListener("click", () => remove(p));
    chip.append(open, x);
    rail.append(chip);
  });
}

function relayout() {
  reportSoon();
  document.body.classList.toggle("busy", recs().some(p => !p.queued));   // the ambient clock steps back
  const { visible, waiting } = arrange();
  const running = recs().filter(p => p.state === "running" || p.state === "refreshing").length;
  const shown = `${visible} panel${visible === 1 ? "" : "s"}` + (waiting ? ` · ${waiting} waiting` : "");
  document.getElementById("connText").textContent =
    ws && ws.readyState === 1 ? (running ? `${running} running · ${shown}` : shown) : connWord;
}
addEventListener("resize", () => relayout());

// Looking at or using a panel keeps it on screen longest.
function track(rec) {
  rec.touched = Date.now();
  const touch = () => { rec.touched = Date.now(); };
  rec.node.addEventListener("pointerdown", touch);
  rec.node.addEventListener("focusin", touch);
  rec.node.addEventListener("pointermove", touch, { passive: true });
  // Clicking a panel (not one of its buttons or links, and not selecting text) focuses it.
  rec.node.addEventListener("click", e => {
    if (!rec.num || e.target.closest("a,button,input,select,textarea,summary,label")) return;
    if (String(getSelection() || "").trim()) return;
    setFocus(rec);
  });
}

function panelTitle(p) {
  const t = p.node.querySelector(".title");
  return (t && t.textContent) || titleFor(p.tool);
}

// Lowest number not in use: numbers stay put while a panel is open.
function nextNum() {
  const used = new Set(recs().map(p => p.num));
  let n = 1; while (used.has(n)) n++;
  return n;
}

function setFocus(rec) {
  focused = rec && rec.num ? rec : null;
  const chip = document.getElementById("focuschip");
  chip.hidden = !focused;
  if (focused) {
    chip.replaceChildren(el("span", "ft", `PANEL ${focused.num} · ${panelTitle(focused)}`), el("span", "fx", "×"));
    focused.queued = false; focused.touched = Date.now();
  }
  cmd.placeholder = focused ? `Ask about panel ${focused.num}…` : "Press / to talk to Aurelia";
  relayout();
}

// What's on screen, by number, sent with each request so she sees what you see.
function screenState() {
  const list = recs().filter(p => p.num && p.state !== "asking" && !p.node.classList.contains("leaving"))
    .map(p => ({ n: p.num, task_id: (p.state === "refreshing" && p.memo && p.memo.taskId) || p.latestTask || p.taskId,
                 tool: p.tool, title: panelTitle(p), queued: !!p.queued }));
  return { panels: list, focus: focused && list.some(x => x.n === focused.num) ? focused.num : null };
}

// What this display shows, told to the server whenever it changes: a send checks its panel arrived
// here, and "what's on my screens" reads it. Each panel lists every task behind it.
let reportTimer = null;
function reportSoon() { clearTimeout(reportTimer); reportTimer = setTimeout(reportScreen, 300); }
function reportScreen() {
  clearTimeout(reportTimer);
  const ids = new Map();
  panels.forEach((rec, id) => { if (!ids.has(rec)) ids.set(rec, []); ids.get(rec).push(id); });
  const list = recs().filter(p => p.num && p.state !== "asking" && !p.node.classList.contains("leaving"))
    .map(p => ({ n: p.num, title: panelTitle(p), headline: p.headline || null, tool: p.tool, queued: !!p.queued,
                 tasks: [...(ids.get(p) || []), p.taskId, p.latestTask].filter(Boolean) }));
  window.fetch("/view/screen", { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify({ panels: list, visible: document.visibilityState === "visible",
                                                        app: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true }) })
    .catch(() => {});
}
setInterval(reportScreen, 60000);
// Back on screen (a phone out of a pocket): say so, and pick up anything kept for this display meanwhile.
document.addEventListener("visibilitychange", async () => {
  reportScreen();
  if (document.visibilityState !== "visible") return;
  try {
    const { events } = await (await window.fetch("/view/queued", { method: "POST" })).json();
    (events || []).forEach(e => { try { onEvent(e); } catch (x) {} });
    if ((events || []).length) relayout();
  } catch (e) {}
});

// Each panel once, however many tasks point at it.
function recs() { return [...new Set(panels.values())]; }

// The open panel showing this look-up, if any (same tool + same arguments).
function openPanelFor(tool, key) {
  if (key === undefined || key === null) return null;
  return recs().find(p => p.tool === tool && p.key === key && ["reading", "refreshing"].includes(p.state)
                          && !p.node.classList.contains("leaving")) || null;
}

function makePanel(taskId, tool) {
  const node = el("section", "panel working");
  node.setAttribute("aria-label", titleFor(tool));
  const rec = { taskId, latestTask: taskId, tool, node, state: "running", unit: null, cancellable: true, num: nextNum() };
  node.dataset.n = rec.num;
  panels.set(taskId, rec);
  track(rec);
  stage.appendChild(node);
  renderProgress(rec, null);
  relayout();
  return rec;
}

// Finished actions fade after close_after seconds; using a panel holds it; pinned or failed ones stay.
function autoClose(rec) {
  if (!rec.closeAfter || rec.autoArmed) return;
  rec.autoArmed = true;
  const arm = () => { clearTimeout(rec.timer); if (!rec.closeAfter) return;
                      rec.timer = setTimeout(() => { if (!rec.pinned && rec.closeAfter && rec !== focused) remove(rec); }, rec.closeAfter * 1000); };
  // Using the panel holds it: moving the pointer over it restarts the countdown, and
  // keyboard focus inside pauses it. A pointer merely resting where the panel
  // appeared doesn't count, or a panel under a still mouse would never close.
  rec.node.addEventListener("pointermove", arm);
  rec.node.addEventListener("focusin", () => clearTimeout(rec.timer));
  rec.node.addEventListener("focusout", arm);
  arm();
}

// What's playing where (my player on a computer, or Spotify): one panel each, kept up to date while it
// plays and gone when it stops. Closing it keeps it closed until something else starts playing there.
const nowDismissed = new Map();                 // key -> the title that was showing when it was closed
function showNow(d) {
  if (!d || !d.key) return;
  const id = "now-" + d.key, n = d.now || {};
  let rec = panels.get(id);
  if (!n.active) { nowDismissed.delete(d.key); if (rec) remove(rec, 0); return; }
  if (nowDismissed.get(d.key) === n.title) return;
  nowDismissed.delete(d.key);
  if (!rec) {
    rec = makePanel(id, "quasar.now");
    Object.assign(rec, { closeAfter: null, cancellable: false, nowKey: d.key });   // never closes by itself
  }
  for (const r of recs())                       // the one-off "Playing X" answer: this live panel replaces it
    if (r !== rec && r.tool !== "quasar.now" && r.data && r.data.now && r.data.now.node === n.node && r.state === "reading") remove(r, 0);
  rec.state = "reading"; rec.nowTitle = n.title; rec.heard = Date.now();
  renderResult(rec, { headline: `${n.paused ? "Paused" : "Playing"} on ${n.node}`, now: n });
  relayout(); requestAnimationFrame(relayout);         // again once its picture and wrapped title have their size
}
setInterval(() => {                              // a computer that went quiet without saying it stopped
  for (const rec of recs()) if (rec.tool === "quasar.now" && Date.now() - (rec.heard || 0) > 90000) remove(rec, 0);
}, 15000);
function loadNow() {
  fetch("/quasar/now").then(r => r.json()).then(j => (j.playing || []).forEach(showNow)).catch(() => {});
}

const dismissed = new Set();                    // release panels you closed: don't replay them
const closedPlans = new Set();               // plan panels he closed: their updates don't reopen them
function remove(rec, delay) {
  if (rec.tool === "chrysalis.release") dismissed.add(rec.taskId);
  if (rec.tool === "admiral.plan" && delay === undefined) closedPlans.add(rec.taskId);
  if (rec.tool === "quasar.now" && rec.nowKey && rec.nowTitle && delay === undefined) nowDismissed.set(rec.nowKey, rec.nowTitle);
  if (rec === focused) setFocus(null);
  setTimeout(() => {
    rec.node.classList.add("leaving");
    setTimeout(() => {
      rec.node.remove();
      for (const [id, p] of [...panels]) if (p === rec) panels.delete(id);
      relayout();
    }, 500);
  }, delay || 0);
}

function closeButton(rec) {

// ---------------------------------------------------------------- progress panel
// Built once, then only the numbers change: rebuilding on every update (several a
// second for a download) would replace the Stop button under your mouse and lose the click.
function renderProgress(rec, p) {
  const n = rec.node;
  if (!rec.prog || rec.prog.node !== n || !n.contains(rec.prog.bar)) {
    n.replaceChildren();
    const head = el("div", "head");
    const meta = el("div", "meta");
    head.append(el("div", "title", titleFor(rec.tool)), meta);
    n.append(head);
    if (rec.subtitle) n.append(el("div", "msg", rec.subtitle));
    const bar = el("div", "bar unknown"), fill = el("div", "fill");
    bar.append(fill);
    const row = el("div", "row"), rowText = el("span");
    row.append(rowText); row.hidden = true;
    const label = el("div", "label"); label.hidden = true;
    n.append(bar, row, label);
    let stop = null;
    if (rec.cancellable) {
      stop = el("button", "btn", "Stop"); stop.type = "button";
      stop.addEventListener("click", () => cancel(rec, stop));
      n.append(stop);
    }
    rec.prog = { node: n, meta, bar, fill, row, rowText, label, stop };
  }
  const g = rec.prog;
  const known = !!(p && p.total);
  const pct = known ? Math.max(0, Math.min(100, Math.round(100 * p.current / p.total))) : null;
  g.meta.textContent = pct !== null ? `${pct}%` : "";
  g.bar.classList.toggle("unknown", !known);
  g.fill.style.width = known ? pct + "%" : "";
  if (p) {
    const unit = p.unit || rec.unit || "";
    const size = x => x >= 1073741824 ? `${(x / 1073741824).toFixed(1)} GB` : x >= 1048576 ? `${(x / 1048576).toFixed(1)} MB`
                    : x >= 1024 ? `${Math.round(x / 1024)} KB` : `${x} bytes`;
    g.rowText.textContent = unit === "bytes"
      ? (known ? `${size(p.current)} of ${size(p.total)}` : size(p.current))
      : unit === "steps" && known
      ? `Step ${Math.min(p.total, Math.floor(p.current) + 1)} of ${p.total}`
      : known ? `${fmt(p.current)} / ${fmt(p.total)} ${unit}`.trim() : `${fmt(p.current)} ${unit}`.trim();
    g.row.hidden = false;
    g.label.textContent = p.label || "";
    g.label.hidden = !p.label;
  }
}
function fmt(x) { return typeof x === "number" && !Number.isInteger(x) ? x.toFixed(1) : x; }

async function cancel(rec, button) {
  button.disabled = true; button.textContent = "Stopping…";
  try {
    const r = await fetch(`/tasks/${rec.taskId}/cancel`, { method: "POST" });
    if (!r.ok) { button.textContent = "Couldn't stop"; setTimeout(() => { button.disabled = false; button.textContent = "Stop"; }, 2000); }
  } catch (e) { button.textContent = "Couldn't stop"; }
}

// ---------------------------------------------------------------- result panel
// memo (optional): a saved panel restored from memory → { age, stale, tier, taskId, refreshing, note }
function renderResult(rec, data, memo) {
  rec.data = data;
  const { status, partial, ...rest } = data;
  const n = rec.node;
  n.className = "panel reading";
  n.replaceChildren(closeButton(rec));
  const head = el("div", "head");
  head.append(el("div", "title", resultTitle(rec.tool, rest)));
  const meta = el("div", "meta");
  if (partial || rest.cancelled) meta.append(el("span", "tag", "STOPPED · PARTIAL"));
  if (memo) {
    const words = memo.updated ? ["updated just now"]
      : [memo.stale ? "stale" : null, memo.age, memo.tier === "warm" ? "summary" : null].filter(Boolean);
    if (words.length) meta.append(el("span", "age" + (memo.stale && !memo.updated ? " stale" : ""), words.join(" · ")));
  }
  const pinId = memo && memo.taskId ? memo.taskId : rec.latestTask;
  if (pinId && !/^(confirm|release|now)-/.test(String(pinId))) meta.append(pinButton(pinId, rec.pinned || (memo && memo.tier === "pinned")));
  head.append(meta);
  n.append(head);
  const hl = headlineFor(rec.tool, rest);
  rec.headline = hl ? hl.text : null;
  if (hl) { n.classList.add("hl"); n.append(el("div", "headline" + (hl.level ? " " + hl.level : ""), hl.text)); }
  if (memo && memo.refreshing) { const r = el("div", "refresh"); r.append(el("div", "fill")); n.append(r); }
  if (memo && memo.note) n.append(el("div", "error", memo.note));
  const sc = el("div", "scroll");
  sc.append(body(rec.tool, rest));
  n.append(sc);
  const next = el("div", "next");
  n.append(next);
  renderSteps(rec, next, nextSteps(rec.tool, rest));
  usualAfter(rec.tool).then(usual => { if (next.isConnected) renderSteps(rec, next, nextSteps(rec.tool, rest), usual); });
}

// ---- answer-first: the one line that answers the question -----------------------------
function headlineFor(tool, d) {
  if (typeof d.headline === "string" && d.headline) return { text: d.headline };
  const count = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
  const devs = [...(d.devices || []), ...(d.tvs || [])];
  if (devs.length) {
    const bad = [], parts = [];
    devs.filter(x => x.kind === "leak_sensor" && x.active).forEach(x => bad.push(`Leak: ${x.name}`));
    const locks = devs.filter(x => x.kind === "lock");
    const open = locks.filter(x => x.locked === false);
    if (open.length) bad.push(`${open.map(x => x.name).join(", ")} unlocked`);
    else if (locks.length) parts.push(locks.length === 1 ? `${locks[0].name} locked` : "All locked");
    const t = devs.find(x => x.kind === "thermostat" && x.current_temp != null);
    if (t) parts.push(`${t.current_temp}°`);
    const lights = devs.filter(x => x.kind === "light");
    if (lights.length) parts.push(lights.some(x => x.on) ? `${count(lights.filter(x => x.on).length, "light")} on` : "Lights off");
    const tv = devs.find(x => x.kind === "tv" && x.on);
    if (tv) parts.push(tv.app ? `TV on · ${tv.app}` : "TV on");
    const off = devs.filter(x => x.online === false).length;
    if (off) parts.push(`${off} offline`);
    return { text: [...bad, ...parts].join(" · "), level: bad.some(b => b.startsWith("Leak")) ? "bad" : bad.length ? "warn" : null };
  }
  if (d.kind && d.name) { const c = deviceCard(d); return { text: `${d.name}: ${c.querySelector(".state").textContent}`, level: c.classList.contains("alert") ? "warn" : null }; }
  if (typeof d.device === "string" && typeof d.locked === "boolean") return { text: `${d.device} ${d.locked ? "locked" : "unlocked"}`, level: d.locked ? null : "warn" };
  if (typeof d.muted === "boolean") return { text: d.muted ? "Muted" : "Sound on" };
  if (Array.isArray(d.results) && "query" in d) {
    const top = d.results[0];
    return { text: d.results.length ? `${count(d.results.length, "result")}${top && top.site ? ` · top: ${top.site}` : ""}` : "No results" };
  }
  if (Array.isArray(d.videos)) return { text: d.videos.length ? count(d.videos.length, "video") : "No videos found" };
  if (typeof d.text === "string" && (d.url || typeof d.pages === "number"))
    return { text: `${d.site || ""}${typeof d.pages === "number" ? ` · ${count(d.pages, "page")}` : ""}${d.words ? ` · ${Math.max(1, Math.round(d.words / 230))} min read` : ""}`.replace(/^ · /, "") };
  if (typeof d.saved_to === "string") return { text: d.quarantined ? `${d.size} · in quarantine` : `${d.size} saved`, level: d.quarantined ? "warn" : null };
  if (d.cancelled) return { text: "Stopped" };
  if (Array.isArray(d.mailbox)) return { text: d.mailbox.length ? `${count(d.mailbox.length, "item")} waiting for you` : "Nothing waiting" };
  if (d.digest && typeof d.digest === "object") return { text: d.digest.quiet ? "All quiet" : `${d.digest.waiting_count || 0} waiting · ${(d.digest.failures || []).length} to look at` };
  if (Array.isArray(d.functions)) {
    const on = d.functions.filter(f => f.state === "online").length, badF = d.functions.filter(f => ["unhealthy", "offline"].includes(f.state)).length;
    return { text: `${on} running${badF ? ` · ${badF} need${badF === 1 ? "s" : ""} attention` : ""}`, level: badF ? "warn" : null };
  }
  if (typeof d.function === "string" && d.state_text) return { text: d.state_text, level: d.state === "online" ? null : "warn" };
  if (Array.isArray(d.recall)) return { text: d.recall.length ? count(d.recall.length, "conversation") : "Nothing found" };
  if (d.library && typeof d.library === "object") {
    const t = d.library.topics.length, r = d.library.research.length;
    return { text: t || r ? [t ? count(t, "topic") : null, r ? count(r, "piece") + " of research" : null].filter(Boolean).join(" · ") : "Nothing yet" };
  }
  if (d.remembered === true && Array.isArray(d.facts)) return { text: `${count(d.facts.length, "thing")} · ${d.facts.filter(f => f.core).length} core` };
  if (Array.isArray(d.inputs)) { const on = d.inputs.find(i => i.showing); return { text: on ? `Showing ${on.name}` : count(d.inputs.length, "input") }; }
  if (Array.isArray(d.releases) && d.releases.length) { const r = d.releases[0]; return { text: `${String(r.status || "").replace(/_/g, " ")}${r.sha ? " · " + String(r.sha).slice(0, 8) : ""}` }; }
  return null;
}

// ---- next steps: likely follow-ups, sent as ordinary requests (same rules as typing them) ----
function nextSteps(tool, d) {
  const out = [];
  const devs = [...(d.devices || []), ...(d.tvs || [])];
  devs.filter(x => x.kind === "lock" && x.locked === false).forEach(x => out.push({ label: `Lock ${x.name}`, say: `lock the ${x.name.toLowerCase()}` }));
  devs.filter(x => x.kind === "light" && x.on).slice(0, 2).forEach(x => out.push({ label: `Turn off ${x.name}`, say: `turn off the ${x.name.toLowerCase()}` }));
  devs.filter(x => x.kind === "tv" && x.on).slice(0, 1).forEach(x => out.push({ label: "Turn off the TV", say: "turn off the tv" }));
  if (d.kind === "light" && d.name) out.push(d.on ? { label: "Turn it off", say: `turn off the ${d.name.toLowerCase()}` } : { label: "Turn it on", say: `turn on the ${d.name.toLowerCase()}` });
  if ((d.kind === "lock" && d.locked === false) || (typeof d.device === "string" && d.locked === false))
    out.push({ label: "Lock it", say: `lock the ${String(d.name || d.device).toLowerCase()}` });
  if (Array.isArray(d.results) && d.results.length) {
    out.push({ label: "Read #1", say: "read result #1" });
    if (d.results.length > 1) out.push({ label: "Read #2", say: "read result #2" });
  }
  if (Array.isArray(d.videos) && d.videos.length) out.push({ label: "Open #1", say: "open video #1" });
  if (typeof d.text === "string" && d.url) out.push({ label: "Summarize it", say: "summarize this page" });
  if (d.research && typeof d.research === "object") {
    const r = d.research;
    if (r.depth !== "thorough") out.push({ label: "Go deeper", say: `research this thoroughly: ${r.question}` });
    out.push({ label: "Explain it simpler", say: `explain ${r.topic ? r.topic.name : r.question} more simply` });
    out.push({ label: "Quiz me", say: `quiz me on ${r.topic ? r.topic.name : r.question}` });
  }
  if (d.topic && typeof d.topic === "object") {
    out.push({ label: "Quiz me on this", say: `quiz me on ${d.topic.name}` }, { label: "Explain it", say: `explain ${d.topic.name}` });
  }
  if (d.explain && typeof d.explain === "object") out.push({ label: "Quiz me", say: `quiz me on ${d.explain.subject}` });
  if (d.now && typeof d.now === "object" && d.now.active && d.now.source === "spotify") {
    out.push(d.now.paused ? { label: "Play", say: "resume spotify" } : { label: "Pause", say: "pause spotify" });
    out.push({ label: "Next", say: "skip the song on spotify" });
  } else if (d.now && typeof d.now === "object" && d.now.active) {
    const on = `on the ${d.now.node.toLowerCase()}`;
    out.push(d.now.paused ? { label: "Play", say: `resume ${on}` } : { label: "Pause", say: `pause ${on}` });
    if (d.now.next) out.push({ label: "Next", say: `next episode ${on}` });
    out.push({ label: "Stop", say: `stop playing ${on}` });
  }
  if (d.catalog && typeof d.catalog === "object") {
    const first = (d.catalog.items || ((d.catalog.groups || [])[0] || {}).items || [])[0];
    if (first) out.push({ label: `Play ${first.name}`.slice(0, 40), say: sayPlay(first) });
  }
  if (d.sound && typeof d.sound === "object" && d.sound.node) {
    const on = `on the ${d.sound.node.toLowerCase()}`;
    out.push({ label: "Louder", say: `turn the volume up ${on}` }, { label: "Quieter", say: `turn the volume down ${on}` },
             d.sound.muted ? { label: "Unmute", say: `unmute ${on}` } : { label: "Mute", say: `mute ${on}` });
  }
  if (d.playing && typeof d.playing === "object" && (d.playing.players || []).length) {
    const on = `on the ${d.playing.node.toLowerCase()}`;
    out.push({ label: "Next", say: `next track ${on}` },
             d.playing.players[0].status === "Playing" ? { label: "Pause", say: `pause the music ${on}` } : { label: "Play", say: `play the music ${on}` });
  }
  return out;
}
const usualCache = new Map();
async function usualAfter(tool) {                // what you usually ask next after this tool
  const hit = usualCache.get(tool);
  if (hit && Date.now() - hit.at < 300000) return hit.list;
  try {
    const r = await fetch(`/suggest?tool=${encodeURIComponent(tool)}`, { cache: "no-store" });
    const list = r.ok ? (await r.json()).usual || [] : [];
    usualCache.set(tool, { at: Date.now(), list });
    return list;
  } catch (e) { return []; }
}
function renderSteps(rec, box, steps, usual) {
  if (["parallax.mailbox", "parallax.digest", "chrysalis.release"].includes(rec.tool)) { box.replaceChildren(); return; }
  // Up to three: what this result suggests, with one place kept for what you usually do next.
  const seen = new Set(steps.map(s => s.say.toLowerCase()));
  const habits = (usual || []).filter(u => !seen.has(u.say)).slice(0, 1)
    .map(u => ({ label: u.say.charAt(0).toUpperCase() + u.say.slice(1), say: u.say, usual: true }));
  const all = [...steps.slice(0, 3 - habits.length).map(s => ({ ...s, usual: false })), ...habits];
  box.replaceChildren(...all.map(s => {
    const b = el("button", "step" + (s.usual ? " usual" : ""), s.label); b.type = "button";
    if (s.usual) { b.append(el("span", "why", "usual")); b.title = "You often ask this next"; }
    b.addEventListener("click", () => { setFocus(rec); ask(s.say); });
    return b;
  }));
}

function pinButton(taskId, pinned) {
  const b = el("button", "pin" + (pinned ? " on" : ""), pinned ? "PINNED" : "PIN");
  b.type = "button";
  b.setAttribute("aria-pressed", pinned ? "true" : "false");
  b.title = "Pinned panels are kept in full, however old";
  b.addEventListener("click", async () => {
    const want = b.getAttribute("aria-pressed") !== "true";
    b.disabled = true;
    try {
      const r = await fetch(`/memory/snapshots/${taskId}/pin`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pinned: want }) });
      if (r.ok) { const owner = [...panels.values()].find(p => p.node.contains(b)); if (owner) { owner.pinned = want; if (want) clearTimeout(owner.timer); }
                  b.setAttribute("aria-pressed", String(want)); b.textContent = want ? "PINNED" : "PIN"; b.classList.toggle("on", want); }

function resultTitle(tool, d) {
  if (Array.isArray(d.results) && d.query) return `Search: ${d.query}`;
  if (Array.isArray(d.videos) && d.query) return `YouTube: ${d.query}`;
  if (d.link && d.link.title) return d.link.title;
  if (typeof d.file === "string" && !d.cancelled) return d.file;
  if (Array.isArray(d.releases) && d.releases.length === 1) return "Last release";
  if (Array.isArray(d.mailbox)) return "Mailbox";
  if (d.digest) return "Morning digest";
  if (Array.isArray(d.recall)) return d.query ? `Recall: ${d.query}` : d.date ? `Conversations · ${d.date}` : "Recent conversations";
  if (d.research && typeof d.research === "object") return d.research.question;
  if (d.library && typeof d.library === "object") return d.library.query ? `Library: ${d.library.query}` : "Your library";
  if (d.topic && typeof d.topic === "object") return d.topic.name;
  if (d.explain && typeof d.explain === "object") return d.explain.subject;
  if (d.quiz && typeof d.quiz === "object") return `Quiz: ${d.quiz.subject}`;
  if (d.remembered === true) return "What I know about you";
  if (typeof d.remembered_fact === "string") return "Remembered";
  if (typeof d.forgot === "string") return "Forgotten";
  if (typeof d.title === "string") return d.title;
  if (typeof d.function === "string") return d.function;
  if (d.kind && d.name) return d.name;
  if (typeof d.device === "string") return d.device;
  return titleFor(tool);
}

    if (group && group !== last) { box.append(el("div", "rl fgroup", group)); last = group; }

    x.title = "Forget this";

        if (r.ok || r.status === 404) { row.classList.add("gone"); setTimeout(() => row.remove(), 400); }
        else x.disabled = false;
      } catch (e) { x.disabled = false; }
    });
    if (grouped) {
      const star = el("button", "fx star" + (f.core ? " on" : ""), f.core ? "★" : "☆"); star.type = "button";
      const label = () => (f.core ? "Remove from core" : "Keep always on my mind (core)");

                                                           body: JSON.stringify({ core: !f.core }) });
          const out = await r.json().catch(() => ({}));

// Text with [n] turned into small citation links to source n.
function citedText(text, sources) {
  const byN = new Map((sources || []).map(s => [String(s.n), s]));
  const frag = document.createDocumentFragment();
  let at = 0;
  String(text || "").replace(/\[(\d+)\]/g, (m, n, i) => {
    frag.append(document.createTextNode(text.slice(at, i)));
    const s = byN.get(n);
    const url = s && safeUrl(s.url);
    if (url) { const a = extLink(url, n, "cite"); a.title = `${s.title} · ${s.site}`; frag.append(a); }
    else frag.append(document.createTextNode(m));
    at = i + m.length;
    return m;
  });
  frag.append(document.createTextNode(String(text || "").slice(at)));
  return frag;
}
function paragraphs(text, sources) {
  const box = el("div", "ans");
  String(text || "").split(/\n+/).filter(p => p.trim()).forEach(p => { const e = el("p"); e.append(citedText(p, sources)); box.append(e); });
  return box;
}
function bullets(items, sources) {
  const ul = el("ul", "kl");
  items.forEach(x => { const li = el("li"); li.append(citedText(x, sources)); ul.append(li); });
  return ul;
}
function sourceList(sources) {
  const box = el("div", "srcs");
  sources.forEach(s => {
    const row = el("div", "src" + (s.cited === false ? " unused" : ""));
    row.append(el("span", "sn", s.n ? `[${s.n}]` : "·"), extLink(s.url, s.title || s.url), el("span", "ss", s.site || ""));
    if (s.cited === false) row.title = "Read, but not cited";
    box.append(row);
  });
  return box;
}
function researchView(r) {
  const box = el("div"); box.style.display = "flex"; box.style.flexDirection = "column"; box.style.gap = "14px";
  box.append(paragraphs(r.answer, r.sources));
  if ((r.key_points || []).length) box.append(el("div", "rl", "Key points"), bullets(r.key_points, r.sources));
  if ((r.disagreements || []).length) box.append(el("div", "rl", "Where sources disagree"), bullets(r.disagreements, r.sources));
  box.append(el("div", "rl", `Sources · ${r.depth === "thorough" ? "thorough" : "quick"}`), sourceList(r.sources || []));
  const t = r.topic || {};
  if (t.name) {

    note.append(document.createTextNode(t.joined ? "Added to " : "New in your library: "), el("b", null, t.name),
