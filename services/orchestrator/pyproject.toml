[project]
name = "aurelia-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "watchfiles>=0.24",
    "anthropic>=0.40",
    "yt-dlp[default]>=2026.8.19",
    "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.24"]
