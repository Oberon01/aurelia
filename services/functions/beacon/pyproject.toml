[project]
name = "aurelia-function-beacon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "cryptography>=43",
    "bcrypt>=4.2",
    "icalendar>=6.1",
    "recurring-ical-events>=3.4",
]

[dependency-groups]
# radicale: the tests run a real calendar server
dev = ["pytest>=8", "pytest-asyncio>=0.24", "radicale==3.8.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
