[project]
name = "aurelia-function-orbit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "smartrent-py>=0.5.2,<0.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.24"]
