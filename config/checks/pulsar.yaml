# Field checks for Pulsar (Phase 10): automations, routines and initiative.
release: Pulsar (Phase 10)
phase: 10
checks:
  - id: readback
    name: An automation is read back, and nothing is saved until you confirm
    say: "every day at 7 am turn on the {light}"
    expect:
      route: fastpath
      tool: pulsar.automate
      asks_to_confirm: pulsar.save
      reply_has: ["Every day at 7:00 AM", "Save it?"]

  - id: day-list
    name: Day lists are read by code
    say: "turn on the {light} every monday, wednesday and friday at 9 pm"
    expect:
      route: fastpath
      asks_to_confirm: pulsar.save
      reply_starts: "Every Monday, Wednesday and Friday at 9:00 PM"

  - id: never-now
    name: Something that repeats never runs now, even when I can't read it
    say: "turn off the {light} every other weeknight at 11"
    expect:
      route: "not fastpath"
      tool: none

  - id: routine-draft
    name: A routine is read back step by step
    say: "make a routine called check night: turn on the {light}, then turn off the {light}"
    expect:
      route: fastpath
      asks_to_confirm: pulsar.save
      reply_starts: "Routine \"check night\": 1)"

  - id: automations-panel
    name: My automations open
    say: "show my automations"
    expect: { tool: pulsar.automations, status: completed }

  - id: notices-panel
    name: What I'm watching opens
    say: "any alerts"
    expect: { tool: pulsar.notices, status: completed }

  - id: runs-on-time
    name: An automation you approve runs on time, with its heads-up, and the light reports it
    needs_you: "Say “every day at {in_3_minutes} turn on the {light}” and confirm the read-back. I'll watch for it to run."
    verify:
      automation: "{light}"
      outcome: done
      within: 6m
    question: "Did a heads-up with a Cancel show about a minute before it ran?"
    after:
      - delete: automation          # exactly the one made for this check (never one of yours)
      - say: "turn off the {light}"

  # Time windows on event automations, and routine steps that show a look-up on another display.
  - id: window-readback
    name: A time window is read by code and read back
    say: "when the {lock} unlocks between 5pm and 6pm, turn on the {light}"
    expect:
      route: fastpath
      asks_to_confirm: pulsar.save
      reply_has: ["between 5:00 PM and 6:00 PM", "Save it?"]

  - id: bare-hour-asked
    name: A bare hour in a window is never guessed
    say: "when the {lock} unlocks between 5 and 6, turn on the {light}"
    expect:
      route: "not fastpath"
      tool: looks only                 # it may look up your devices to ask a better question; nothing acts
      asks_to_confirm: false           # never a guessed "5pm" offered to save

  - id: condition-never-now
    name: A condition I can't read is never done right now
    say: "turn on the {light} when the {lock} unlocks if it's dark"
    expect:
      route: "not fastpath"
      tool: looks only                 # it may look up your devices to ask a better question; nothing acts

  - id: routine-show-readback
    name: A routine step can show a look-up on another display
    say: "make a routine called check show: send my youtube to my phone, then turn on the {light}"
    expect:
      route: fastpath
      asks_to_confirm: pulsar.save
      reply_starts: "Routine \"check show\": 1) Send my youtube to my phone; 2) Turn on the"

  - id: routine-show-runs
    name: The routine's step shows your YouTube on your phone, confirmed by the phone
    needs_you: "Say “make a routine called check show: send my youtube to my phone” and confirm it. Then, with your phone unlocked and Aurelia open on it, say “check show” on another display."
    question: "Did your YouTube recommendations open on your phone, and not on the display you asked from?"
    after:
      - say: "forget the check show routine"

  - id: window-runs
    name: A door unlocking inside its window starts the automation, checked by the light's own report
    needs_you: "Say “when the {lock} unlocks between {in_0_minutes} and {in_30_minutes}, turn on the {light}” and confirm the read-back. Then unlock the {lock} (and lock it again)."
    verify:
      automation: "{light}"
      outcome: done
      within: 10m
    after:
      - delete: automation          # exactly the one made for this check (never one of yours)
      - say: "turn off the {light}"
