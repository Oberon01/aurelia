# Orbit — the smart home: SmartRent (locks, lights, thermostat, sensors) and
# Roku TVs. Physical-world actions: unlocking always needs your confirmation;
# locking, lights and the TV run on request.
function: orbit
enabled: true

tools:
  status:     { tier: reference }
  lock:       { tier: act }
  unlock:     { tier: change }     # always asks you first
  light:      { tier: act }
  thermostat: { tier: act }
  login:      { tier: act }        # you supply the 2FA code
  alias:        { tier: act }      # "remember that the living room light is Switch 2"
  aliases:      { tier: reference }
  forget_alias: { tier: act }
  tv_status:    { tier: reference }
  tv_apps:      { tier: reference }
  tv_inputs:    { tier: reference }
  tv_discover:  { tier: read }     # looks around the home network for TVs
  tv_power:     { tier: act }
  tv_input:     { tier: act }
  tv_app:       { tier: act }
  tv_remote:    { tier: act }
  tv_mute:      { tier: act }

rate_limit_per_minute: 30

# Enforced inside Orbit.
rules:
  thermostat:
    min_f: 60          # setpoints outside this range are refused
    max_f: 85
  # Physical-world heads-up: seconds of visible countdown (cancellable) before
  # any lock/light/thermostat action. 0 until the display exists to show it.
  heads_up_seconds: 0

  # Device nicknames are saved by Orbit itself: tell Aurelia "remember that the
  # living room light is Switch 2" (tool orbit.alias). Names listed here also
  # work, but saved ones take precedence.
  aliases: {}

  # Roku TVs are found on the home network automatically and followed by serial
  # number if their IP changes; no static IP needed.
  tv:
    # Where to look. Empty = the ranges most home routers use. Listing yours
    # (e.g. "192.168.1.0/24"; run `ip route` on the server) makes a search ~1s instead of ~10s.
    subnets: []
    # Inputs are read from the TV, so names you give them on the TV itself
    # ("PC" for HDMI 2) work automatically and follow any rename. These are
    # extra names on top of that, if you'd rather not rename on the TV.
    inputs: {}          # e.g. { xbox: hdmi1 }
    rediscover_minutes: 30
