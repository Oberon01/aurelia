# Constellation — your devices and shared computer access. Part of the orchestrator.
# Phase 7: devices (step 1), the node agent (2), her shell (3), and seeing and using
# the page on a screen (4). Tools not built yet take effect as they are.
function: constellation
enabled: true

tools:
  devices:         { tier: reference }   # list what's paired; pairing and revoking happen only on the display
  apps:            { tier: reference }   # what's installed on one of his computers
  home:            { tier: act }         # close what she opened on a screen; back to her view
  look:            { tier: read }        # the page on a screen running her shell, numbered (step 4)
  click:           { tier: act }         # click by number or words; buy/send/delete-looking ones come back as submit
  type:            { tier: act }         # into a text box; never password or payment boxes (the node refuses); a sign-in code only as he says it
  press:           { tier: act }         # a key (enter, escape, arrows…); Enter that would send comes back as submit
  scroll:          { tier: act }
  back:            { tier: act }
  media:           { tier: act }         # play, pause, seek, volume, speed, full screen; next/previous/now playing for any player
  sound:           { tier: act }         # the computer's volume, mute and which output (speakers, HDMI, headphones)
  submit:          { tier: change }      # the press that buys, pays, sends, posts or deletes: always confirmed
  sign_in:         { tier: change }      # a login he saved on that computer; she never sees it (Sep 30 decision)
  logins:          { tier: reference }   # which sites have a saved login there (names only)
  power:           { tier: act }         # lock, sleep, screen off/on, idle time
  restart:         { tier: change }      # restart or shut down a computer: always confirmed
  wake:            { tier: act }         # wake-on-LAN
  diagnose:        { tier: read }        # read-only checks: services, logs, network, storage (stage 1 of node fixes)
  watch:           { tier: read }        # his screen live in a panel on his display (frames never reach the model)
  screens:         { tier: reference }   # what's on each display now (its own report)
  send:            { tier: act }         # a panel, link or note to another display (or a group by role)
  search_files:    { tier: reference }
  list_processes:  { tier: reference }   # what's running on a computer (node reporting)
  health:          { tier: reference }   # how a computer is doing: hardware, live state, why it's slow
  close_process:   { tier: act }         # finds exactly what would close; never closes anything itself
  browser_history: { tier: reference }
  read_file:       { tier: read }
  open:            { tier: act }     # open a file, app or URL on a node
  launch:          { tier: act }
  move_file:       { tier: change }
  delete_file:     { tier: change }
  kill_process:    { tier: change }      # closing those exact processes: always his confirmation
  install:         { tier: act }         # finds the package; never installs itself (puts install_package before him)
  install_package: { tier: change }      # exactly that package from Ubuntu's packages or snaps: always confirmed
  uninstall:       { tier: act }         # checks what would go; never removes itself (puts remove_package before him)
  remove_package:  { tier: change }      # only that package, nothing that takes others with it: always confirmed
  read_secrets:    { tier: never }

rate_limit_per_minute: 120

# Enforced by the node agent and the orchestrator.
rules:
  communication:
    heartbeat_seconds: 10
    offline_after_seconds: 45          # node shown offline, actions to it queued or refused
    index_sync_minutes: 15             # file / history index refresh
    process_snapshot_seconds: 60
    transport: tailscale_mtls          # per-node certificate, revocable from the mailbox
  sharing:
    default_profile: owner             # only this user's profile is indexed on each node
    include: ["~/Documents", "~/Desktop", "~/Downloads", "~/Pictures", "~/Videos"]
    exclude_patterns:                  # never indexed, never sent — enforced on the node
      - "**/.ssh/**"
      - "**/.env*"
      - "**/*.pem"
      - "**/*.key"
      - "**/AppData/**/Login Data*"    # browser saved passwords
      - "**/AppData/**/Cookies*"
      - "**/*.kdbx"                    # password manager vaults
    browser_history: { enabled: true, retain_days: 90 }
  enrollment:
    requires_approval: true            # new nodes wait in the mailbox
  updates:                             # Kentrell's standing decision (Sep 29): nodes keep their agent current
    automatic: true                    # without asking; only released code (tested by Chrysalis) is served
    max_attempts: 3                    # then it stops trying that version and a mailbox card tells him
  screen:                              # step 4: seeing and using the page on a screen
    # A click (or Enter) whose label has one of these words waits for his OK (as submit).
    confirm_before: [buy, buy now, purchase, pay, pay now, checkout, check out, place order, order now, rent,
                     subscribe, donate, tip, transfer, send, post, reply, comment, submit, delete, confirm]
  # Node health: each check-in carries a small reading. Past a warn line it's in the digest;
  # past an urgent line, also a mailbox card (once a day per problem). Nothing is closed on its own.
  health:
    disk_warn_percent: 90
    disk_urgent_percent: 97
    memory_warn_percent: 90
    temp_warn_c: 85
    temp_urgent_c: 95
    cpu_busy_percent: 90               # ...for this many check-ins in a row (about 10 minutes apart)
    cpu_busy_checkins: 3
    battery_low_percent: 10
  # A computer whose picture reaches you through a TV's input (the TV PC is plugged into the
  # living room Roku TV). When she opens something on it or brings it home, Orbit turns that TV
  # on if it's off and switches it to this input first. tv: Orbit's name for the TV (empty = your
  # only TV). input: "HDMI 2", or the name you gave the input on the TV. Empty input = not set.
  screens:
    - computer: TV PC
      tv: Living room TV
      input: ""                        # which HDMI the TV PC is plugged into, e.g. "HDMI 2"
  targeting:
    default_target: requesting_node
    quiet_hours: []                    # e.g. { node: bedroom-tv, from: "22:00", to: "07:00" }
