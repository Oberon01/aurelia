# Quasar — video and music on your computers, played by her own player (Phase 7; Phase 15 brought
# forward). Sources are services with APIs, never web pages: your Jellyfin library, titles on a Roku TV,
# YouTube, and Spotify (your tokens stay on the server; no client secret is used). Control while it plays (pause, skip, subtitles) is Constellation's media.
function: quasar
enabled: true

tools:
  find:            { tier: reference }   # your library: search, continue watching, next up, recently added
  play:            { tier: act }         # play it full screen on one of your computers; checked with the player
  youtube:         { tier: read }        # your YouTube feeds and search, read on your computer with its own sign-in
  spotify:         { tier: act }         # your Spotify on your speakers; every change checked with Spotify itself

rate_limit_per_minute: 60

rules:
  # Jellyfin's address and your sign-in stay on the server (.env). A computer only gets a short-lived
  # link per stream, usable only with its own key, and only for that computer. The node agent plays
  # nothing but those links (no other address, no files, no scripts), or a YouTube video by its id,
  # which it resolves itself with yt-dlp from Aurelia's own release (checksummed) and its own YouTube
  # sign-in (cookies that never leave that computer). Aurelia's key is never sent to YouTube.
  streams_only_through_aurelia: true
