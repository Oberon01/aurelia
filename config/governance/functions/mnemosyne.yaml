# Mnemosyne ("Mnemo") — the record, part of Aurelia herself (not a separate service).
# This file decides what is recorded, kept and left out. It's protected: Aurelia
# can read it but never change it, even through her own proposed code changes.
function: mnemosyne
enabled: true

tools:
  recall:   { tier: reference }   # past conversations and remembered facts
  facts:    { tier: reference }   # everything you asked her to remember
  remember: { tier: act }         # only when you ask; what she notices on her own goes to the mailbox
  forget:   { tier: change }      # always asks you first: forgetting can't be undone
  history:  { tier: reference }   # her own releases: what each did, why, and what it lets her do
  roadmap:  { tier: reference }   # the build phases (config/roadmap.md)

rate_limit_per_minute: 30

rules:
  timezone: America/Chicago
  quiet_minutes: 30        # a stretch of conversation gets its record after this long without a request
  every_minutes: 10        # how often she checks for quiet conversations
  keep_days: 365           # records older than this are deleted (facts stay until you remove them)
  min_requests: 2          # a lone fast-path command ("lock the door") isn't worth a record
  exclude_tools:           # requests that ran these are left out of records entirely
    - orbit.login          #   (SmartRent sign-in codes)
    - constellation.copy   #   (what he copies stays a day on the clipboard, never in a record)
    - constellation.paste
    - constellation.clipboard
  max_transcript_chars: 24000

  # What she knows about you
  max_facts: 5000          # everything she knows about you; recalled by meaning when it fits
  max_core: 50             # the core profile: goes with every request
  recall_facts: 8          # facts recalled per request, beyond the core
  recall_min_score: 0.35   # how close in meaning a fact must be to come up (0-1)
  learn: true              # read each recorded conversation for what it shows about you
  learn_categories:        # what she may notice and propose (you approve each one in the mailbox)
    - communication        #   how you like to be talked to
    - mood                 #   patterns only (e.g. what helps when you're stressed), never one-off moods
    - interests
    - goals
    - life                 #   what's going on in your life
    - people               #   who they are to you
    - learning             #   what you know and are learning
    - rhythms
    - work
    - preferences
  never_infer:             # never proposed from conversations; you can still tell her directly
    - health               #   comes later, from the ring and biometrics, under its own rules
  min_confidence: 0.6
  max_observations: 5      # per conversation
