# Nebula — the web. Draft policy; takes effect when Nebula is built.
function: nebula
enabled: true

tools:
  search:   { tier: reference }
  fetch:    { tier: read }        # read a page's contents
  open:     { tier: act }         # open a URL on a node's browser
  download: { tier: act }
  submit:   { tier: change }      # submit a form, post, log in
  upload:   { tier: change }      # send any local file anywhere
  purchase: { tier: never }

rate_limit_per_minute: 30

# Enforced inside Nebula itself (defence in depth).
rules:
  domains:
    blocked: []                   # never visited, e.g. known malware or tracking hosts
    confirm_first: []             # visited only after you approve, e.g. banking
  downloads:
    max_size_mb: 2048
    quarantine_dir: downloads/quarantine   # nothing downloaded runs or opens from here unconfirmed
    blocked_extensions: [".exe", ".msi", ".bat", ".cmd", ".ps1", ".vbs", ".scr"]  # need confirmation to release
  fetched_content:
    treat_as: data                # page text never becomes instructions
    strip_scripts: true
  uploads:
    require_user_origin: true     # only when you asked for that exact upload
