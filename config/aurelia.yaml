      reply: 'Here''s what''s new.'
    - name: roadmap
      match: '^(?:what(?:''s|s| is)\s+next(?:\s+on\s+the\s+roadmap)?|where\s+are\s+we(?:\s+on\s+the\s+roadmap)?|(?:show|open)\s+(?:me\s+)?(?:the\s+|your\s+|my\s+)?roadmap|what\s+phase\s+are\s+(?:we|you)\s+(?:in|on))\??$'
      tool: mnemosyne.roadmap
      args: {}
      reply: 'Here''s the roadmap.'
    - name: roadmap-phase
      match: '^(?:tell\s+me\s+about|what(?:''s|s| is)\s+in)\s+phase\s+(?P<phase>\d+(?:\.\d+)?|\w+)\??$'
      tool: mnemosyne.roadmap
      args: { phase: "{phase}" }
      reply: 'Here''s phase {phase}.'
    - name: aliases
      match: '^(?:what|which)\s+(?:nicknames|aliases)\s+(?:have\s+i\s+(?:saved|set)|do\s+you\s+know)\??$|^(?:show|list)\s+(?:me\s+)?(?:my\s+|the\s+)?(?:device\s+)?(?:nicknames|aliases)$'
      tool: orbit.aliases
      args: {}
      reply: "Here are your nicknames."
    - name: forget-alias
      match: '^forget\s+(?:the\s+)?(?:nickname|alias)\s+(?P<alias>.+?)$'
      tool: orbit.forget_alias
      args: { alias: "{alias}" }
      reply: "Forgetting {alias}."
    - name: tv-status
      match: '^is\s+(?:the\s+|my\s+)?(?P<name>(?:[\w ]+\s)?(?:tv|television|roku))\s+on\??$|^(?P<name2>(?:[\w ]+\s)?(?:tv|television|roku))\s+status$|^what(?:''s|s| is)\s+(?:the\s+|my\s+)?(?P<name3>(?:[\w ]+\s)?(?:tv|television|roku))\s+(?:doing|showing)\??$'
      tool: orbit.tv_status
      args: { name: "{name}{name2}{name3}" }
      reply: "Checking the TV."
    - name: tv-apps
      match: '^(?:what|which)\s+(?:roku|tv)\s+apps\b.*$|^list\s+(?:the\s+)?(?:roku|tv)\s+apps$|^what\s+apps\s+(?:are\s+)?on\s+(?:the\s+|my\s+)?(?P<name>(?:[\w ]+\s)?roku)\??$'
      tool: orbit.tv_apps
      args: { name: "{name}" }
      reply: 'Here are the TV''s apps.'
    - name: tv-inputs
      match: '^(?:what|which)\s+inputs\s+(?:does|has)\s+(?:the\s+|my\s+)?(?P<name>(?:[\w ]+\s)?(?:tv|television|roku))(?:\s+have)?\??$|^list\s+(?:the\s+)?(?P<name2>(?:[\w ]+\s)?(?:tv|television|roku))\s+inputs$'
      tool: orbit.tv_inputs
      args: { name: "{name}{name2}" }
      reply: 'Here are the TV''s inputs.'
    - name: tv-discover
      match: '^(?:find|look\s+for|search\s+for|discover)\s+(?:my\s+|the\s+)?(?:roku\s+)?tvs(?:\s+again)?$'
      tool: orbit.tv_discover
      args: {}
      reply: "Looking for TVs."

registry:
  # A function (and its tools) is dropped if it misses heartbeats this long.
  function_ttl_seconds: 30
