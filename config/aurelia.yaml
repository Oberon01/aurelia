# Aurelia runtime config — hot-reloaded. Edit and save; no restart needed.

display:
  # Tasks estimated longer than this stream results live; shorter ones batch.
  live_mode_threshold_seconds: 30

retention:
  hot_days: 7
  warm_days: 90   # still an open decision

llm:
  default_provider: claude
  # Purpose → providers in order; the first that answers wins.
  # Add ollama after claude for a local fallback, or put it first to prefer local.
  routes:
    chat: [claude]
  providers:
    claude:
      model: claude-haiku-4-5-20251001   # cheapest tier by default; escalate per route later
      max_tokens: 1024
    ollama:
      base_url: http://host.docker.internal:11434
      model: qwen2.5:7b-instruct
      timeout_seconds: 60
  monthly_token_cap: 2000000     # hard stop for cloud tokens this calendar month
  max_tool_rounds: 5
  wait_for_result_seconds: 8

session:
  ttl_minutes: 60        # a conversation is forgotten after this long idle
  max_turns: 20

# Predictable commands skip the LLM entirely. First match wins.
# Placeholders: {group} from the regex, {group|default} when the group is optional.
fastpath:
  enabled: true
  patterns:
    - name: echo
      match: '^(?:probe\s+)?echo\s+(?P<message>.+?)(?:\s+(?P<steps>\d+)\s+times)?$'
      tool: probe.echo
      args: { message: "{message}", steps: "{steps|3}" }
      reply: 'Echoing "{message}".'
    # Orbit (smart home). Unlock is governed as a "change": it always asks you first.
    - name: lock-up
      match: '^lock\s+(?:up|(?:the\s+)?doors?)$'
      tool: orbit.lock
      args: {}
      reply: "Locked."
    - name: lock-door
      match: '^lock\s+(?:the\s+)?(?P<door>.+?)(?:\s+door)?$'
      tool: orbit.lock
      args: { name: "{door}" }
      reply: "Locked."
    - name: unlock-door
      match: '^unlock\s+(?:the\s+)?(?P<door>.+?)(?:\s+door)?$'
      tool: orbit.unlock
      args: { name: "{door}" }
      reply: "Unlocked."
    - name: light-on-off
      match: '^turn\s+(?P<state>on|off)\s+(?:the\s+)?(?P<light>.+?)(?:\s+lights?)?$'
      tool: orbit.light
      args: { name: "{light}", "on": "{state}" }   # "on" quoted: bare on means true in YAML
      reply: "Turned {state}."
    - name: thermostat-target
      match: '^(?:set\s+)?(?:the\s+)?(?:thermostat|temperature|temp|heat|ac|a/c)\s+to\s+(?P<temp>\d{2})(?:\s*(?:°|degrees?|f))*$'
      tool: orbit.thermostat
      args: { target: "{temp}" }
      reply: "Thermostat set to {temp}°."
    - name: light-level
      match: '^(?:set|dim)\s+(?:the\s+)?(?!thermostat|temp|heat|ac\b|a/c)(?P<light>.+?)(?:\s+lights?)?\s+to\s+(?P<level>\d{1,3})\s*(?:%|percent)?$'
      tool: orbit.light
      args: { name: "{light}", level: "{level}" }
      reply: "Set to {level}%."
    - name: remember-alias
      match: '^remember\s+(?:that\s+)?(?P<alias>.+?)\s+(?:is|means)\s+(?:the\s+|my\s+)?(?P<device>.+)$'
      tool: orbit.alias
      args: { alias: "{alias}", device: "{device}" }
      reply: "Got it: {alias} means {device}."
    - name: smartrent-code
      match: '^(?:smart\s*rent|2fa|two[- ]factor)\s+code\s+(?P<code>[0-9a-z]{4,10})$'
      tool: orbit.login
      args: { code: "{code}" }
      reply: "Code sent to SmartRent."
    # Example for a function still to come:
    # - name: open-on-device
    #   match: '^open\s+(?P<target>.+?)\s+on\s+(?:the\s+)?(?P<device>.+)$'
    #   tool: constellation.open
    #   args: { target: "{target}", device: "{device}" }
    #   reply: "Opening {target} on {device}."

registry:
  # A function (and its tools) is dropped if it misses heartbeats this long.
  function_ttl_seconds: 30
