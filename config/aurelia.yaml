# Aurelia runtime config — hot-reloaded. Edit and save; no restart needed.

display:
  # Tasks estimated longer than this stream results live; shorter ones batch.
  live_mode_threshold_seconds: 30
  # Finished actions (lock, lights, TV...) fade after this many seconds; hovering
  # holds them. Look-ups (home status, releases) stay until you dismiss them.
  action_panel_seconds: 12
  # A reply of this many sentences or more (or longer than reply_panel_chars) opens as a panel
  # on the display that asked, so it stays to be read; the top line keeps just its first sentence.
  reply_panel_sentences: 3
  reply_panel_chars: 320

# What a presentation display (the TV) shows when nothing's on it: a dim clock, the date, the
# weather and anything worth a glance. Dark during quiet hours. Set latitude and longitude for
# the weather (Open-Meteo, no key; only these coordinates are sent).
ambient:
  enabled: true
  dim: 0.55
  quiet_hours: "23:00-07:00"
  latitude:
  longitude:
  units: fahrenheit

quasar:
  # Video and music on your computers, played by my own player from your Jellyfin library.
  # Jellyfin's address and your sign-in go in .env (JELLYFIN_URL, JELLYFIN_USER, JELLYFIN_PASSWORD).
  resume: true            # pick up where you left off
  queue_episodes: 12      # a show keeps going with the next episodes
  ticket_hours: 8         # how long a computer's link to one stream works
  library_limit: 500      # most titles shown per section (shows, movies, music) at once
  # Spotify (your developer app; the client id is public, and no secret is used). The redirect must be
  # exactly what's registered on that app. Sign in once at /quasar/spotify/login from one of your screens.
  spotify_client_id: "66b36ae7746e41308ecc47154b46c2b4"
  spotify_redirect_uri: "https://docker-home.tail0150f0.ts.net:8443/quasar/spotify/callback"
  librespot_version: "0.8.0"   # a computer builds this with cargo where Ubuntu doesn't package librespot

notifications:
  # Apple refuses pushes signed with an unreachable contact (localhost), so this is Aurelia's own address.
  contact: "https://docker-home.tail0150f0.ts.net:8443"

retention:
  # Saved result panels: full for hot_days, then a summary until warm_days,
  # then only the task's metadata (timing, outcome) is kept. Pinned panels stay full.
  hot_days: 7
  warm_days: 90   # still an open decision
  critical_hot_days: 30      # tools you approved as critical keep full panels this long

# Morning digest: one panel on your first interaction after this hour (opening
# the display or asking anything). Quiet days produce none.
digest:
  enabled: true
  hour: 6
  timezone: America/Chicago

memory:
  restore: true              # a repeated look-up shows its last panel at once, with its age
  maintenance_minutes: 60    # tiering, daily stats and embeddings
  embeddings:                # recall by meaning; optional (word search works without it)
    enabled: true
    provider: ollama         # uses llm.providers.ollama.base_url unless base_url is set here
    model: nomic-embed-text

llm:
  default_provider: claude
  # Purpose → providers in order; the first that answers wins.
  # Add ollama after claude for a local fallback, or put it first to prefer local.
  routes:
    chat: [claude]
    summarize: [claude]    # Mnemosyne's conversation records (counted toward the monthly cap)
    research: [claude]     # Kepler: planning, cited answers, topics, explanations, quizzes
    # Questions that need real reasoning (why, explain, improve, compare, plan…; see reason_when)
    # use a stronger model, falling back to the everyday one. Remove this line to use chat for all.
    reason: [claude_reason, claude]
  providers:
    claude:
      model: claude-haiku-4-5-20251001   # cheapest tier by default; escalate per route later
      max_tokens: 1024
    claude_reason:                       # the stronger model for routes.reason (about 2x Haiku per token)
      model: claude-sonnet-5
      max_tokens: 2048
    ollama:
      base_url: http://host.docker.internal:11434
      model: qwen2.5:7b-instruct
      timeout_seconds: 60
  monthly_token_cap: 2000000     # hard stop for cloud tokens this calendar month
  max_tool_rounds: 5
  wait_for_result_seconds: 8

session:
  ttl_minutes: 1440      # a conversation lasts a day after the last request
  max_turns: 30          # turns sent back to the model; results and the screen are added separately

# Predictable commands skip the LLM entirely. First match wins.
# Placeholders: {group} from the regex, {group|default} when the group is optional.
fastpath:
  enabled: true
  patterns:
    - name: echo
      match: '^(?:probe\s+)?echo\s+(?P<message>.+?)(?:\s+(?P<steps>\d+)\s+times)?$'
      tool: probe.echo
      args: { message: "{message}", steps: "{steps|3}" }
      reply: 'Echoing "{message}".'
    # Orbit (smart home). Unlock is governed as a "change": it always asks you first.
    - name: home-status
      match: '^(?:(?:what(?:''s|s| is)|how(?:''s|s| is)|show(?: me)?|check)\s+)?(?:the\s+)?(?:(?:status|state)\s+of\s+)?(?:(?:my|the)\s+)?(?:home|house|apartment|place)(?:\s+(?:status|state))?$'
      tool: orbit.status
      args: {}
      reply: "Here's the home."
    - name: functions-status
      match: '^(?:(?:what(?:''s|s| is| are)|how(?:''s|s| is| are)|show(?: me)?|list|check)\s+)?(?:the\s+)?(?:(?:status|state|health)\s+of\s+)?(?:all\s+)?(?:your|my|aurelia''s|the)\s+functions(?:\s+(?:status|doing))?$'
      tool: probe.functions
      args: {}
      reply: "Here are my functions."
    - name: function-detail
      match: '^(?:(?:tell me about|describe|details (?:on|for|of)|status of|show(?: me)?|how(?:''s|s| is))\s+)?(?:the\s+|your\s+)?(?P<name>[a-z][\w-]*)\s+function(?:\s+(?:status|doing|details))?$'
      tool: probe.function
      args: { name: "{name}" }
      reply: "Here's the {name} function."
    # YouTube (Quasar step 3): his feeds and search as posters; a tapped poster plays by its id.
    # Notifications on his phone (the installed app).
    - name: notify-test
      match: '^(?:send me a |send a )?test notification|test (?:my )?notifications$'
      tool: constellation.notify
      args: { action: test }
      reply: "Sending a test notification."
    - name: notify-status
      match: '^(?:which|what) devices (?:have|get) notifications(?: on)?\??$|^notification status$'
      tool: constellation.notify
      args: { action: status }
      reply: "Here's where notifications are on."
    # Spotify (Quasar step 4). "Play X on spotify (on the TV)" is media-play-title (on: "spotify ...").
    - name: spotify-control
      match: '^(?P<action>pause|resume|skip|next|previous)(?: the)?(?: song| track| music)? (?:on|in) spotify$|^(?P<action2>pause|resume) spotify$'
      tool: quasar.spotify
      args: { action: "{action}{action2}" }
      reply: "On Spotify."
    - name: spotify-now
      match: '^what(?:''s| is) (?:playing )?on spotify\??$'
      tool: quasar.spotify
      args: { action: now }
      reply: "Here's what Spotify is playing."
    - name: spotify-volume
      match: '^spotify volume (?:to )?(?P<level>\d{1,3})%?$'
      tool: quasar.spotify
      args: { action: volume, level: "{level}" }
      reply: "Spotify volume {level}."
    - name: spotify-devices
      match: '^(?:my |show(?: me)? my |list my )?spotify (?:speakers|devices)\??$'
      tool: quasar.spotify
      args: { action: devices }
      reply: "Here are your Spotify speakers."
    - name: youtube-play-id
      match: '^play the youtube video (?P<id>yt:[A-Za-z0-9_-]{11})(?:\s+on\s+(?:the |my )?(?P<on>.+?))?$'
      tool: quasar.play
      args: { id: "{id}", "on": "{on|}" }
      reply: "On it."
    - name: youtube-feed
      match: '^(?:what(?:''s| is) on |show(?: me)? |open )?(?:my )?youtube(?: (?P<feed>home(?: ?page)?|feed|recommendations|subscriptions|subs|watch later|history))?(?: page)?\??$'
      tool: quasar.youtube
      args: { feed: "{feed|home}" }
      reply: "Here's your YouTube."
    - name: youtube-subs
      match: '^(?:anything new|what(?:''s| is) new) (?:from|on) my (?:youtube )?subscriptions\??$'
      tool: quasar.youtube
      args: { feed: subscriptions }
      reply: "Here's what's new from your subscriptions."
    - name: youtube-later
      match: '^(?:show(?: me)? |open )?my watch later\??$'
      tool: quasar.youtube
      args: { feed: watch_later }
      reply: "Here's your Watch Later."
    - name: youtube-search
      match: '^(?:(?:search|find|look up)\s+(?:on\s+)?youtube\s+(?:for\s+)?(?P<q>.+)|(?:search for|search|find|look up)\s+(?P<q2>.+?)\s+on youtube|youtube\s+(?P<q3>.+))$'
      tool: quasar.youtube
      args: { feed: search, query: "{q}{q2}{q3}" }
      reply: "Here's what YouTube has."
    # The web (Nebula). "Look up …" goes to the model, so she searches, reads and answers.
    - name: web-search
      match: '^(?:search (?:the web |online |google )?for|google|web search(?: for)?)\s+(?P<q>.+)$'
      tool: nebula.search
      args: { query: "{q}" }
      reply: "Here's what I found."
    - name: read-url
      match: '^(?:read|summari[sz]e|what(?:''s| is) (?:on|at))\s+(?P<url>https?://\S+)$'
      tool: nebula.read
      args: { url: "{url}" }
      reply: "Here's the page."
    - name: download-url
      match: '^download\s+(?P<url>https?://\S+)$'
      tool: nebula.download
      args: { url: "{url}" }
      reply: "Downloading."
    # Constellation, step 4: the page on a screen running her shell ("on the …" names it; with no
    # name, the one screen running her shell). Clicking by description ("the second video") goes
    # through the model, which looks first and picks the number.
    - name: screen-sign-in
      match: '^(?:sign|log) (?:me )?in(?:to| to)? (?P<site>[\w .+-]+?) on (?:the |my )?(?P<target>.+?)$'
      tool: constellation.sign_in
      args: { site: "{site}", target: "{target}" }
      reply: "Signing in to {site}."
    - name: screen-look
      match: '^(?:what(?:''s| is) on|look at|show me|read) (?:the |my )?(?:(?P<target>.+?)(?:''s)? )?screen$'
      tool: constellation.look
      args: { target: "{target}" }
      reply: "Here's what's on it. Say \"click\" and a number."
    - name: screen-numbers
      match: '^(?:show|draw) (?:me )?(?:the )?numbers(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.look
      args: { target: "{target}" }
      reply: "Numbers are up. Say \"click\" and one."
    - name: screen-click
      match: '^(?:click|select|tap|press|choose|pick|open)\s+(?:on\s+)?(?:number\s+|#\s*)?(?P<n>\d{1,3})(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.click
      args: { n: "{n}", target: "{target}" }
      reply: "Clicked {n}."
    - name: screen-type-enter
      match: '^type\s+(?P<text>.+?)(?:\s+(?:in|into)\s+(?:box\s+|number\s+|#)?(?P<n>\d{1,3}))?\s+and\s+(?:press enter|hit enter|search|go)$'
      tool: constellation.type
      args: { text: "{text}", n: "{n}", enter: "true" }
      reply: "Typed it and pressed Enter."
    - name: screen-type-into
      match: '^type\s+(?P<text>.+?)\s+(?:in|into)\s+(?:box\s+|number\s+|#)?(?P<n>\d{1,3})$'
      tool: constellation.type
      args: { text: "{text}", n: "{n}" }
      reply: "Typed it."
    - name: screen-type-quoted
      match: '^type\s+["“''](?P<text>[^"”]+?)["”'']$'
      tool: constellation.type
      args: { text: "{text}" }
      reply: "Typed it."
    - name: screen-key
      match: '^(?:press|hit)\s+(?P<key>enter|escape|esc|tab|space|backspace|up|down|left|right|page up|page down|home|end)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.press
      args: { key: "{key}", target: "{target}" }
      reply: "Pressed {key}."
    - name: screen-scroll
      match: '^scroll(?:\s+(?P<direction>down|up|to the top|to the bottom))?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.scroll
      args: { direction: "{direction|down}", target: "{target}" }
      reply: "Scrolled {direction|down}."
    - name: screen-back
      match: '^go back(?: (?:a|one) page| to the (?:last|previous) page)?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.back
      args: { target: "{target}" }
      reply: "Went back."
    - name: video-play-pause
      match: '^(?P<action>pause|play|resume|unpause)(?:\s+(?:it|the video|that|this))?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "{action}", target: "{target}" }
      reply: "Done."
    - name: video-forward
      match: '^(?:fast[- ]?forward|skip (?:ahead|forward)|jump (?:ahead|forward)|go forward)(?:\s+(?:by\s+)?(?P<amount>\d+(?:[:.]\d+)*\s*(?:s|secs?|seconds?|m|mins?|minutes?|h|hrs?|hours?)?))?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "forward", amount: "{amount}", target: "{target}" }
      reply: "Skipped ahead."
    - name: video-skip-by
      match: '^skip\s+(?:by\s+)?(?P<amount>\d+(?:[:.]\d+)*\s*(?:s|secs?|seconds?|m|mins?|minutes?|h|hrs?|hours?)?)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "forward", amount: "{amount}", target: "{target}" }
      reply: "Skipped ahead {amount}."
    - name: video-rewind
      match: '^(?:rewind|skip back(?:wards?)?|jump back|back up)(?:\s+(?:by\s+)?(?P<amount>\d+(?:[:.]\d+)*\s*(?:s|secs?|seconds?|m|mins?|minutes?|h|hrs?|hours?)?))?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "back", amount: "{amount}", target: "{target}" }
      reply: "Went back."
    - name: video-go-back-by
      match: '^go back\s+(?:by\s+)?(?P<amount>\d+(?:[:.]\d+)*\s*(?:s|secs?|seconds?|m|mins?|minutes?|h|hrs?|hours?)?)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "back", amount: "{amount}", target: "{target}" }
      reply: "Went back {amount}."
    - name: video-seek
      match: '^(?:go|jump|skip|seek) to\s+(?P<amount>\d{1,2}:\d{2}(?::\d{2})?|\d+\s*(?:s|secs?|seconds?|m|mins?|minutes?))(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "seek", amount: "{amount}", target: "{target}" }
      reply: "Jumped to {amount}."
    - name: video-restart
      match: '^(?:start (?:it |the video )?over|restart (?:it|the video))(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "restart", target: "{target}" }
      reply: "From the start."
    - name: video-fullscreen
      match: '^(?:(?:go|make it|make the video|put it|put the video)\s+)?(?:in\s+)?full[- ]?screen(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "fullscreen", target: "{target}" }
      reply: "Full screen."
    - name: video-exit-fullscreen
      match: '^(?:exit|leave|get out of|close|turn off)\s+full[- ]?screen(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "exit_fullscreen", target: "{target}" }
      reply: "Out of full screen."
    - name: video-mute
      match: '^(?P<action>mute|unmute)\s+(?:(?:the video|it|the page)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?|on\s+(?:the\s+|my\s+)?(?P<target2>.+?))$'
      tool: constellation.media
      args: { action: "{action}", target: "{target}{target2}" }
      reply: "Done."
    - name: video-volume
      match: '^(?:set (?:the )?volume to|volume(?: to)?)\s+(?P<level>\d{1,3})(?:\s*%|\s+percent)?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "volume", level: "{level}", target: "{target}" }
      reply: "Volume {level}."
    - name: video-speed
      match: '^(?:(?:set )?(?:the )?(?:playback )?speed (?:to )?|play (?:it )?at )(?P<rate>\d(?:\.\d+)?)\s*(?:x|times)?(?: speed)?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: "speed", rate: "{rate}", target: "{target}" }
      reply: "Speed {rate}×."
    # Constellation: open something on one of his computers ("on the …" names the computer).
    - name: media-next
      match: '^(?:play |skip to |go to )?(?:the )?next (?:episode|one|song|track|video)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: next, target: "{target|}" }
      reply: "Next."
    - name: media-previous
      match: '^(?:play |go (?:back )?to )?(?:the )?(?:previous|last) (?:episode|one|song|track|video)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: previous, target: "{target|}" }
      reply: "Back one."
    - name: media-stop
      match: '^stop(?:\s+(?:playing|the (?:video|movie|show|episode|music|song)|it|that|this))?(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.media
      args: { action: stop, target: "{target|}" }
      reply: "Stopped."
    - name: media-play-title
      # "play Frieren on the TV", "put on Big Buck", "watch Dune on the TV": my player, from his library.
      match: '^(?:play|put on|start playing|watch)\s+(?!(?:the |my )?(?:sign[- ]?in|screen|live)\b)(?!.*\bscreen$)(?P<what>.+?)(?:\s+(?:on|onto)\s+(?:the |my )?(?P<on>.+?))?$'
      tool: quasar.play
      args: { what: "{what}", "on": "{on|}" }
      reply: "On it."
    # Panels on a display: closed there and checked from its own report ("close the panels on the TV").
    - name: clear-panels
      match: '^(?:close|clear|dismiss|remove|get rid of)\s+(?:all\s+)?(?:of\s+)?(?:the\s+|my\s+)?panels?(?:\s+(?P<nums>\d+(?:(?:\s*,\s*|\s+and\s+|\s+)\d+)*))?\s+(?:on|from|off)\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.clear
      args: { target: "{target}", panels: "{nums|}" }
      reply: "Clearing the {target}."
    - name: clear-everything
      match: '^(?:close|clear)\s+everything\s+(?:on|from|off)\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.clear
      args: { target: "{target}", everything: "true" }
      reply: "Clearing the {target}."
    - name: clear-screen
      match: '^clear\s+(?:the\s+|my\s+)?(?P<target>.+?)(?:''s)?\s+(?:screen|display)\.?$'
      tool: constellation.clear
      args: { target: "{target}" }
      reply: "Clearing the {target}."
    - name: screen-home-here
      match: '^(?:go (?:back )?home|back to (?:aurelia|you|home)|close (?:that|it|everything|the page|the video|the movie)|show (?:aurelia|yourself))$'
      tool: constellation.home
      args: {}
      reply: "Back to me."
    - name: open-url-on
      match: '^open\s+(?P<url>(?:https?://)?[\w-]+(?:\.[\w-]+)+(?:/\S*)?)\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.open
      args: { url: "{url}", target: "{target}" }
      reply: "Opening it on the {target}."
    - name: open-app-on
      match: '^(?:open|launch|start)\s+(?:the\s+)?(?P<app>.+?)\s+app\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.open
      args: { app: "{app}", target: "{target}" }
      reply: "Opening {app} on the {target}."
    # "Open X on Y": a computer named Y first (Constellation), else a Roku TV named Y (through Orbit).
    - name: open-on
      match: '^(?:open|launch|pull up|bring up|put up)\s+(?:up\s+)?(?P<what>.+?)\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.open
      args: { what: "{what}", target: "{target}" }
      reply: "Opening {what} on the {target}."
    - name: screen-home
      match: '^(?:go (?:back )?home|back to (?:aurelia|you|home)|close (?:that|it|the page|the video)|show (?:aurelia|yourself))\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?)\.?$'
      tool: constellation.home
      args: { target: "{target}" }
      reply: "The {target} is back to me."
    - name: node-apps
      match: '^(?:what(?:''s| is) installed|what apps are(?: installed)?|which apps are(?: installed)?|list (?:the )?apps) on (?:the |my )?(?P<target>.+?)\??$'
      tool: constellation.apps
      args: { target: "{target}" }
      reply: "Here's what's installed on the {target}."
    # Node health: how a computer is doing, what's running, closing a program (always confirmed).
    - name: node-health
      match: '^(?:how(?:''s| is) (?:the |my )?(?P<t1>.+?) (?:doing|running|holding up)|check on (?:the |my )?(?P<t2>.+?)|why is (?:the |my )?(?P<t3>.+?) (?:so |running |being )?slow|(?:show (?:me )?|what are )?(?:the )?specs (?:of|on|for) (?:the |my )?(?P<t4>.+?))$'
      tool: constellation.health
      args: { target: "{t1}{t2}{t3}{t4}" }
      reply: "Here's how the {t1}{t2}{t3}{t4} is doing."
    - name: node-processes
      match: '^(?:what(?:''s| is) (?:running|using (?:the |all the |so much )?(?P<what>cpu|memory|ram)) on|(?:show|list) (?:me )?(?:the )?processes on) (?:the |my )?(?P<target>.+?)$'
      tool: constellation.list_processes
      args: { target: "{target}", sort: "{what}" }
      reply: "Here's what's running on the {target}."
    - name: node-force-close
      match: '^force[- ](?:close|quit|kill|end) (?:the )?(?P<name>.+?) (?:on|from) (?:the |my )?(?P<target>.+?)$'
      tool: constellation.close_process
      args: { name: "{name}", target: "{target}", force: "true" }
      reply: "Waiting for your OK to force-close {name}."
    - name: node-close
      match: '^(?:close|quit|kill|end) (?:the )?(?P<name>.+?) (?:on|from) (?:the |my )?(?P<target>.+?)$'
      tool: constellation.close_process
      args: { name: "{name}", target: "{target}" }
      reply: "Waiting for your OK to close {name}."
    - name: open-url
      match: '^open\s+(?P<url>https?://\S+)$'
      tool: nebula.open
      args: { url: "{url}" }
      reply: "Here's the link."
    # Aurelia's own releases (Chrysalis).
    - name: last-release
      match: '^(?:(?:what|which)(?:''s| was| is)\s+|show(?: me)?\s+|tell me about\s+)?(?:the\s+|your\s+|my\s+)?(?:last|latest|newest|most recent|current)\s+(?:release|update|deploy(?:ment)?|version)$'
      tool: chrysalis.releases
      args: { limit: "1" }
      reply: "Here's the last release."
    - name: releases
      match: '^(?:(?:show(?: me)?|list|what are)\s+)?(?:the\s+|your\s+|my\s+)?(?:recent\s+|latest\s+|last few\s+)?(?:releases|updates|deploys|deployments|release history)$'
      tool: chrysalis.releases
      args: { limit: "10" }
      reply: "Here are the recent releases."
    - name: update-status
      match: '^(?:(?:are there|any)\s+(?:new\s+)?updates|update status|(?:what(?:''s| is)\s+)?(?:your|the)\s+update status|is (?:an|a) update (?:running|in progress))$'
      tool: chrysalis.status
      args: {}
      reply: "Here's my update status."
    - name: mailbox
      match: '^(?:(?:open|show(?: me)?|check|what(?:''s| is) in)\s+)?(?:the\s+|my\s+)?(?:mailbox|review(?:\s+(?:items|queue))?|proposals|suggestions)$'
      tool: parallax.mailbox
      args: {}
      reply: "Here's the mailbox."
    - name: remembered-facts
      match: '^(?:what\s+do\s+you\s+(?:remember|know)(?:\s+about\s+me)?|(?:show(?: me)?\s+)?(?:what\s+you(?:''ve| have)\s+remembered|what\s+you\s+know\s+about\s+me|(?:my|the|your)\s+(?:remembered\s+)?facts|my\s+profile))\??$'
      tool: mnemosyne.facts
      args: {}
      reply: "Here's what I know about you."
    # Kepler: research and learning
    - name: research-thorough
      match: '^research\s+(?P<question>.+?)\s+(?:thoroughly|in depth|properly)\.?$'
      tool: kepler.research
      args: { question: "{question}", depth: thorough }
      reply: "Researching that thoroughly."
    - name: research
      match: '^(?:research|look into)\s+(?P<question>.+?)\.?$'
      tool: kepler.research
      args: { question: "{question}" }
      reply: "Researching that now. The panel shows how it's going."
    - name: quiz-me
      match: '^quiz me(?:\s+(?:on|about))?\s+(?P<subject>.+?)\??$'
      tool: kepler.quiz
      args: { subject: "{subject}" }
      reply: "Here's your quiz. Answers are hidden until you pick."
    - name: what-did-i-learn
      match: '^what (?:did|have) I (?:learn(?:ed|t)?|read|researched?) (?:about|on)\s+(?P<query>.+?)\??$'
      tool: kepler.recall
      args: { query: "{query}" }
      reply: "Here's what's in your library."
    - name: devices
      match: '^(?:(?:show|list|open)(?: me)? (?:my |the |all )?(?:paired )?devices|what(?:''s| is) paired(?: with you)?|which devices (?:are|can) (?:paired|reach you|connected))\??$'
      tool: constellation.devices
      args: {}
      reply: "Here's everything paired with me."
    - name: computers
      match: '^(?:(?:show|list|open)(?: me)? (?:my |the |all )?(?:connected |online |paired )?(?:nodes|computers|machines|pcs)|(?:what|which) (?:nodes|computers|machines|pcs) are (?:online|connected|paired|up))\??$'
      tool: constellation.devices
      args: { computers: "true" }
      reply: "Here are your computers."
    - name: whole-library
      match: '^(?:(?:what|which) topics (?:have|did) I (?:learn(?:ed|t)?|research(?:ed)?|stud(?:y|ied)|look(?:ed)? into)|what have I (?:learn(?:ed|t)|researched)(?: so far)?|what(?:''s| is) in my library|(?:show|open)(?: me)? (?:my|the) (?:research )?library)\??$'
      tool: kepler.recall
      args: {}
      reply: "Here's your library."
    - name: what-to-watch
      match: '^(?:what can (?:I|we) watch|what(?:''s| is) there to watch|what should (?:I|we) watch|(?:show|open)(?: me)? (?:my|the) (?:video|media|movie|tv|jellyfin) library|(?:show|open)(?: me)? (?:my )?jellyfin|what(?:''s| is) (?:in|on) (?:my )?jellyfin|what(?:''s| is) in my (?:video|media) library)\??$'
      tool: quasar.find
      args: {}
      reply: "Here's your library."
    - name: exam-mode
      match: '^(?:(?:start|turn on|use) )?exam mode on (?:the |my )?(?P<target>.+?)(?: for (?P<hours>\d+(?:\.\d+)?) ?(?:h|hrs?|hours?))?$'
      tool: constellation.mode
      args: { mode: exam, target: "{target}", hours: "{hours|3}" }
      reply: "Exam mode."
    - name: gaming-mode
      match: '^(?:(?:start|turn on|use) )?(?:gaming|game) mode on (?:the |my )?(?P<target>.+?)$'
      tool: constellation.mode
      args: { mode: gaming, target: "{target}" }
      reply: "Gaming mode."
    - name: gaming-mode-off
      match: '^(?:end|stop|turn off|exit|leave) (?:gaming|game) mode(?: on (?:the |my )?(?P<target>.+?))?$'
      tool: constellation.mode
      args: { mode: normal, target: "{target|}" }
      reply: "Back to normal."
    - name: clipboard-show
      match: '^(?:what(?:''s| is) on (?:my|the) clipboard|(?:show|open)(?: me)? (?:my|the) clipboard)\??$'
      tool: constellation.clipboard
      args: {}
      reply: "Here's your clipboard."
    - name: clipboard-from
      match: '^copy (?:what(?:''s| is)(?: copied)? on|the clipboard (?:from|on)) (?:the |my )?(?P<src>.+?)$'
      tool: constellation.copy
      args: { from: "{src}" }
      reply: "Copied."
    - name: clipboard-to
      match: '^(?:put|paste) (?:it|that|the clipboard) (?:on|onto|to) (?:the |my )?(?P<to>.+?)(?:''s clipboard)?$'
      tool: constellation.paste
      args: { to: "{to}" }
      reply: "Done."
    - name: my-movies
      match: '^(?:(?:show|open|list)(?: me)? (?:all )?(?:of )?my movies|what movies do (?:I|we) have|what movies are (?:in|on) (?:my )?(?:library|jellyfin))\??$'
      tool: quasar.find
      args: { kind: movies }
      reply: "Here are your movies."
    - name: my-shows
      match: '^(?:(?:show|open|list)(?: me)? (?:all )?(?:of )?my (?:tv )?shows|what (?:tv )?shows do (?:I|we) have|what shows are (?:in|on) (?:my )?(?:library|jellyfin))\??$'
      tool: quasar.find
      args: { kind: shows }
      reply: "Here are your shows."
    - name: my-music
      match: '^(?:(?:show|open|list)(?: me)? (?:all )?(?:of )?my (?:music|albums)(?: library)?|what music do (?:I|we) have)\??$'
      tool: quasar.find
      args: { kind: music }
      reply: "Here's your music."
    - name: find-to-watch
      match: '^find (?P<query>.+?) (?:in|on) (?:my )?(?:video library|media library|jellyfin)$'
      tool: quasar.find
      args: { query: "{query}" }
      reply: "Here's what I found."
    - name: show-topic
      match: '^(?:show|open)(?: me)? the topic\s+(?P<name>.+?)$'
      tool: kepler.topic
      args: { name: "{name}" }
      reply: "Here's the topic."
    - name: forget-topic
      match: '^forget (?:about )?(?:the |my )?(?:research|topic|notes?)\s+(?:on|about|for|called)\s+(?P<topic>.+?)\.?$'
      tool: kepler.forget
      args: { topic: "{topic}" }
      reply: "Removed {topic} from your library and Trilium."
    - name: forget-topic-short
      match: '^forget (?:the |my )(?P<topic>.+?) (?:research|topic|notes?)\.?$'
      tool: kepler.forget
      args: { topic: "{topic}" }
      reply: "Removed {topic} from your library and Trilium."
    - name: forget-learned
      match: '^forget what I (?:learned|learnt|researched|read) (?:on|about)\s+(?P<topic>.+?)\.?$'
      tool: kepler.forget
      args: { topic: "{topic}" }
      reply: "Removed {topic} from your library and Trilium."
    - name: digest
      match: '^(?:(?:show(?: me)?|open|give me)\s+)?(?:the\s+|my\s+|today''s\s+)?(?:morning\s+)?(?:digest|briefing|summary of (?:today|the day))$'
      tool: parallax.digest
      args: {}
      reply: "Here's your digest."
    - name: analyze
      match: '^(?:analy[sz]e|look for patterns|find patterns|any new (?:ideas|suggestions))(?:\s+now)?$'
      tool: parallax.analyze
      args: {}
      reply: "Looking through my history now."
    - name: lock-up
      match: '^lock\s+(?:up|(?:the\s+)?doors?)$'
      tool: orbit.lock
      args: {}
      reply: "Locked."
    - name: lock-door
      match: '^lock\s+(?:the\s+)?(?P<door>.+?)(?:\s+door)?$'
      tool: orbit.lock
      args: { name: "{door}" }
      reply: "Locked."
    - name: unlock-door
      match: '^unlock\s+(?:the\s+)?(?P<door>.+?)(?:\s+door)?$'
      tool: orbit.unlock
      args: { name: "{door}" }
      reply: "Unlocked."
    # TVs (Roku). These sit above the light patterns so "turn on the tv" isn't read as a light.
    - name: tv-power
      match: '^turn\s+(?P<state>on|off)\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))$'
      tool: orbit.tv_power
      args: { name: "{tv}", "on": "{state}" }
      reply: "Turned {state} the {tv}."
    - name: tv-power-after
      match: '^turn\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))\s+(?P<state>on|off)$'
      tool: orbit.tv_power
      args: { name: "{tv}", "on": "{state}" }
      reply: "Turned {state} the {tv}."
    - name: tv-input
      match: '^(?:switch|change|set)\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))\s+to\s+(?:the\s+|my\s+)?(?P<input>.+)$'
      tool: orbit.tv_input
      args: { name: "{tv}", input: "{input}" }
      reply: "Switched the {tv} to {input}."
    - name: tv-app
      match: '^(?:open|launch|start|put)\s+(?:up\s+|on\s+)?(?P<app>.+?)\s+on\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))$'
      tool: orbit.tv_app
      args: { name: "{tv}", app: "{app}" }
      reply: "Opened {app} on the {tv}."
    - name: tv-pause
      match: '^pause\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))$'
      tool: orbit.tv_remote
      args: { name: "{tv}", keys: "pause" }
      reply: "Paused."
    - name: tv-resume
      match: '^(?:resume|unpause|play)\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))$'
      tool: orbit.tv_remote
      args: { name: "{tv}", keys: "resume" }
      reply: "Playing."
    - name: tv-mute
      match: '^mute(?:\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku)))?$'
      tool: orbit.tv_mute
      args: { name: "{tv}", muted: "true" }
      reply: "Muted."
    - name: tv-unmute
      match: '^unmute(?:\s+(?:the\s+|my\s+)?(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku)))?$'
      tool: orbit.tv_mute
      args: { name: "{tv}", muted: "false" }
      reply: "Unmuted."
    - name: tv-volume
      match: '^(?:turn\s+)?(?:the\s+|my\s+)?(?:(?P<tv>(?:[\w ]+\s)?(?:tv|television|roku))\s+)?volume\s+(?P<dir>up|down)(?:\s+(?:by\s+)?(?P<n>\d{1,2}))?$'
      tool: orbit.tv_remote
      args: { name: "{tv}", keys: "volume_{dir}", repeat: "{n|3}" }
      reply: "Volume {dir}."
    - name: light-on-off
      match: '^turn\s+(?P<state>on|off)\s+(?:the\s+)?(?P<light>.+?)(?:\s+lights?)?$'
      tool: orbit.light
      args: { name: "{light}", "on": "{state}" }   # "on" quoted: bare on means true in YAML
      reply: "Turned {state}."
    - name: thermostat-target
      match: '^(?:set\s+)?(?:the\s+)?(?:thermostat|temperature|temp|heat|ac|a/c)\s+to\s+(?P<temp>\d{2})(?:\s*(?:°|degrees?|f))*$'
      tool: orbit.thermostat
      args: { target: "{temp}" }
      reply: "Thermostat set to {temp}°."
    - name: light-level
      match: '^(?:set|dim)\s+(?:the\s+)?(?!thermostat|temp|heat|ac\b|a/c)(?P<light>.+?)(?:\s+lights?)?\s+to\s+(?P<level>\d{1,3})\s*(?:%|percent)?$'
      tool: orbit.light
      args: { name: "{light}", level: "{level}" }
      reply: "Set to {level}%."
    - name: remember-alias
      # Only when the second half names a device; any other "remember that X is Y" is a fact (below).
      match: '^remember\s+(?:that\s+)?(?P<alias>.+?)\s+(?:is|means)\s+(?:the\s+|my\s+)?(?P<device>(?:[\w'' ]+\s)?(?:lights?|lamp|lock|door|thermostat|tv|television|roku|sensor|switch|fan|outlet|plug))$'
      tool: orbit.alias
      args: { alias: "{alias}", device: "{device}" }
      reply: "Got it: {alias} means {device}."
    # Mnemosyne: facts are saved only when you say "remember" (not "remember to…", which is a reminder).
    - name: remember
      match: '^(?:please\s+)?remember(?:\s+that)?\s+(?!to\b)(?P<fact>[^?]+?)\.?$'
      tool: mnemosyne.remember
      args: { fact: "{fact}" }
      reply: "I'll remember that."
    - name: smartrent-code
      match: '^(?:smart\s*rent|2fa|two[- ]factor)\s+code\s+(?P<code>[0-9a-z]{4,10})$'
      tool: orbit.login
      args: { code: "{code}" }
      reply: "Code sent to SmartRent."

registry:
  # A function (and its tools) is dropped if it misses heartbeats this long.
  function_ttl_seconds: 30
