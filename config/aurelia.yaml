# Aurelia runtime config — hot-reloaded. Edit and save; no restart needed.

display:
  # Tasks estimated longer than this stream results live; shorter ones batch.
  live_mode_threshold_seconds: 30
  # Finished actions (lock, lights, TV...) fade after this many seconds; hovering
  # holds them. Look-ups (home status, releases) stay until you dismiss them.
  action_panel_seconds: 12
  # A reply of this many sentences or more (or longer than reply_panel_chars) opens as a panel
  # on the display that asked, so it stays to be read; the top line keeps just its first sentence.
  reply_panel_sentences: 3
  reply_panel_chars: 320

# What a presentation display (the TV) shows when nothing's on it: a dim clock, the date, the
# weather and anything worth a glance. Dark during quiet hours. Set latitude and longitude for
# the weather (Open-Meteo, no key; only these coordinates are sent).
ambient:
  enabled: true
  dim: 0.55
  quiet_hours: "23:00-07:00"
  latitude:
  longitude:
  units: fahrenheit

quasar:
  # Video and music on your computers, played by my own player from your Jellyfin library.
  # Jellyfin's address and your sign-in go in .env (JELLYFIN_URL, JELLYFIN_USER, JELLYFIN_PASSWORD).
  resume: true            # pick up where you left off
  queue_episodes: 12      # a show keeps going with the next episodes
  ticket_hours: 8         # how long a computer's link to one stream works
  library_limit: 500      # most titles shown per section (shows, movies, music) at once
  # Spotify (your developer app; the client id is public, and no secret is used). The redirect must be
  # exactly what's registered on that app. Sign in once at /quasar/spotify/login from one of your screens.
  spotify_client_id: "66b36ae7746e41308ecc47154b46c2b4"
  spotify_redirect_uri: "https://docker-home.tail0150f0.ts.net:8443/quasar/spotify/callback"
  librespot_version: "0.8.0"   # a computer builds this with cargo where Ubuntu doesn't package librespot

notifications:
  # Apple refuses pushes signed with an unreachable contact (localhost), so this is Aurelia's own address.
  contact: "https://docker-home.tail0150f0.ts.net:8443"

retention:
  # Saved result panels: full for hot_days, then a summary until warm_days,
  # then only the task's metadata (timing, outcome) is kept. Pinned panels stay full.
  hot_days: 7
  warm_days: 90   # still an open decision
  critical_hot_days: 30      # tools you approved as critical keep full panels this long

# Morning digest: one panel on your first interaction after this hour (opening
# the display or asking anything). Quiet days produce none.
digest:
  enabled: true
  hour: 6
  timezone: America/Chicago

memory:
  restore: true              # a repeated look-up shows its last panel at once, with its age
  maintenance_minutes: 60    # tiering, daily stats and embeddings
  embeddings:                # recall by meaning; optional (word search works without it)
    enabled: true
    provider: ollama         # uses llm.providers.ollama.base_url unless base_url is set here
    model: nomic-embed-text

llm:
  default_provider: claude
  # Purpose → providers in order; the first that answers wins.
  # Add ollama after claude for a local fallback, or put it first to prefer local.
  routes:
    chat: [claude]
    summarize: [claude]    # Mnemosyne's conversation records (counted toward the monthly cap)
    research: [claude]     # Kepler: planning, cited answers, topics, explanations, quizzes
    # Questions that need real reasoning (why, explain, improve, compare, plan…; see reason_when)
    # use a stronger model, falling back to the everyday one. Remove this line to use chat for all.
    reason: [claude_reason, claude]
  providers:
    claude:
      model: claude-haiku-4-5-20251001   # cheapest tier by default; escalate per route later
      max_tokens: 1024
    claude_reason:                       # the stronger model for routes.reason (about 2x Haiku per token)
      model: claude-sonnet-5
      max_tokens: 2048
    ollama:
      base_url: http://host.docker.internal:11434
      model: qwen2.5:7b-instruct
      timeout_seconds: 60
  monthly_token_cap: 4000000     # hard stop for cloud tokens this calendar month
  max_tool_rounds: 5
  wait_for_result_seconds: 8

session:
  ttl_minutes: 1440      # a conversation lasts a day after the last request
  max_turns: 30          # turns sent back to the model; results and the screen are added separately

# Predictable commands skip the LLM entirely. First match wins.
# Placeholders: {group} from the regex, {group|default} when the group is optional.
fastpath:
  enabled: true
  patterns:
    # Pulsar (Phase 10): automations and routines. Before everything else, so "lock the front door every night at
    # 11" is never taken as "lock the front door" now (or as "at 11", once). Each one is only a draft that's read
    # back for his OK; if code can't read the time and the command, the model hears it instead.
    - name: automate-every
      match: '^(?P<say>(?:(?:every|each)\s+(?:\d+(?:\.\d+)?\s+|other\s+|single\s+|half\s+(?:an\s+)?|(?:two|three|four|five|six|ten|fifteen|twenty|thirty|forty-five)\s+)?(?:day|morning|afternoon|evening|night|weekday|weeknight|weekend|hour|minute|min|hr|month|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?(?:(?:\s*,\s*(?:and\s+)?|\s+and\s+|\s*&\s*|\s+)(?:mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?)*|(?:daily|nightly|hourly|monthly\s+on\s+the\s+\w+|(?:on\s+)?(?:the\s+)?week(?:day|night)s|(?:on\s+)?(?:the\s+)?weekends|(?:on\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)days(?:\s+and\s+(?:mon|tues|wednes|thurs|fri|satur|sun)days)*|(?:on\s+)?the\s+(?:\d{1,2}(?:st|nd|rd|th)?|first|last)(?:\s+day)?\s+of\s+(?:every|each)\s+month))(?:\s+(?:morning|afternoon|evening|night)s?)?(?:\s+(?:at|@)\s+(?:\d{1,2}(?::\d{2})?(?:\s*[ap]\.?m\.?|\s*o''?\s?clock)?|noon|midnight))?\b.*)$|^(?!(?:what|when|where|who|why|how|is|are|was|were|do|does|did|can|could|will|would|should|which|tell|check|show)\b)(?P<say2>.+\s+(?:(?:every|each)\s+(?:\d+(?:\.\d+)?\s+|other\s+|single\s+|half\s+(?:an\s+)?|(?:two|three|four|five|six|ten|fifteen|twenty|thirty|forty-five)\s+)?(?:day|morning|afternoon|evening|night|weekday|weeknight|weekend|hour|minute|min|hr|month|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?(?:(?:\s*,\s*(?:and\s+)?|\s+and\s+|\s*&\s*|\s+)(?:mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?)*|(?:daily|nightly|hourly|monthly\s+on\s+the\s+\w+|(?:on\s+)?(?:the\s+)?week(?:day|night)s|(?:on\s+)?(?:the\s+)?weekends|(?:on\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)days(?:\s+and\s+(?:mon|tues|wednes|thurs|fri|satur|sun)days)*|(?:on\s+)?the\s+(?:\d{1,2}(?:st|nd|rd|th)?|first|last)(?:\s+day)?\s+of\s+(?:every|each)\s+month))(?:\s+(?:morning|afternoon|evening|night)s?)?(?:\s+(?:at|@)\s+(?:\d{1,2}(?::\d{2})?(?:\s*[ap]\.?m\.?|\s*o''?\s?clock)?|noon|midnight))?)$|^(?P<say3>remind\s+me\s+(?:(?:every|each)\s+(?:\d+(?:\.\d+)?\s+|other\s+|single\s+|half\s+(?:an\s+)?|(?:two|three|four|five|six|ten|fifteen|twenty|thirty|forty-five)\s+)?(?:day|morning|afternoon|evening|night|weekday|weeknight|weekend|hour|minute|min|hr|month|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?(?:(?:\s*,\s*(?:and\s+)?|\s+and\s+|\s*&\s*|\s+)(?:mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|monday|tuesday|wednesday|thursday|friday|saturday|sunday)s?)*|(?:daily|nightly|hourly|monthly\s+on\s+the\s+\w+|(?:on\s+)?(?:the\s+)?week(?:day|night)s|(?:on\s+)?(?:the\s+)?weekends|(?:on\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)days(?:\s+and\s+(?:mon|tues|wednes|thurs|fri|satur|sun)days)*|(?:on\s+)?the\s+(?:\d{1,2}(?:st|nd|rd|th)?|first|last)(?:\s+day)?\s+of\s+(?:every|each)\s+month))\b.+)$'
      tool: pulsar.automate
      args: { say: "{say|}{say2|}{say3|}" }
      reply: "Here's the automation."
    - name: automate-when
      match: '^(?P<say>(?:when(?:ever)?|each\s+time|every\s+time|any\s+time)\s+(?:i\s+open\s+(?:the\s+|my\s+)?[\w'' -]+?|(?:the\s+|my\s+)?[\w'' -]+?\s+(?:comes?\s+(?:back\s+)?(?:online|on)|is\s+(?:back\s+)?(?:online|on)|turns?\s+on|wakes?(?:\s+up)?|boots?(?:\s+up)?|starts?(?:\s+up)?|goes\s+(?:offline|off|to\s+sleep)|turns?\s+off|shuts?\s+down|is\s+(?:offline|off)|opens|is\s+opened|gets\s+opened))\s*,?\s+.+)$|^(?!(?:what|when|where|who|why|how|is|are|was|were|do|does|did|can|could|will|would|should|which|tell|check|show)\b)(?P<say2>.+\s+(?:when(?:ever)?|each\s+time|every\s+time|any\s+time)\s+(?:i\s+open\s+(?:the\s+|my\s+)?[\w'' -]+?|(?:the\s+|my\s+)?[\w'' -]+?\s+(?:comes?\s+(?:back\s+)?(?:online|on)|is\s+(?:back\s+)?(?:online|on)|turns?\s+on|wakes?(?:\s+up)?|boots?(?:\s+up)?|starts?(?:\s+up)?|goes\s+(?:offline|off|to\s+sleep)|turns?\s+off|shuts?\s+down|is\s+(?:offline|off)|opens|is\s+opened|gets\s+opened)))$'
      tool: pulsar.automate
      args: { say: "{say|}{say2|}" }
      reply: "Here''s the automation."
    - name: routine-make
      match: '^(?P<say>(?:make|create|add|set\s+up|save|build)\s+(?:me\s+)?(?:a\s+|an\s+|the\s+|my\s+)?(?:new\s+)?(?:[\w''" -]+?\s+)?routine\b.+)$'
      tool: pulsar.routine
      args: { say: "{say}" }
      reply: "Here's the routine."
    - name: automations-list
      match: '^(?:(?:show|list|open)\s+(?:me\s+)?)?(?:my|the|your|all)\s+(?:automations|routines|automations\s+and\s+routines)\??$|^what\s+(?:automations|routines)\s+do\s+(?:i|you)\s+have\??$|^what(?:''s|s| is)\s+automated\??$|^(?:automations|routines)$'
      tool: pulsar.automations
      args: {}
      reply: "Here are your automations."
    - name: automation-pause
      match: '^(?:pause|disable|turn\s+off|switch\s+off|stop)\s+(?:the\s+|my\s+)?(?P<which>.*?)\s*automation$'
      tool: pulsar.pause
      args: { which: "{which}" }
      reply: "Paused."
    - name: automation-resume
      match: '^(?:resume|unpause|re-?enable|enable|turn\s+(?:back\s+)?on|switch\s+(?:back\s+)?on|restart|start)\s+(?:the\s+|my\s+)?(?P<which>.*?)\s*automation(?:\s+again)?$'
      tool: pulsar.resume
      args: { which: "{which}" }
      reply: "Resumed."
    - name: automation-delete
      match: '^(?:delete|remove|cancel|get\s+rid\s+of)\s+(?:the\s+|my\s+)?(?P<which>.*?)\s*automation$'
      tool: pulsar.delete
      args: { which: "{which}" }
      reply: "Deleted."
    - name: automation-skip
      match: '^skip\s+(?:the\s+next\s+(?:run\s+of\s+(?:the\s+|my\s+)?)?|tomorrow''?s\s+|today''?s\s+|tonight''?s\s+|the\s+|my\s+)?(?P<which>.*?)\s*(?:automation|routine\s+run|run)(?:\s+(?:tomorrow|today|tonight|this\s+time|once|next\s+time))?$'
      tool: pulsar.skip
      args: { which: "{which}" }
      reply: "Skipping the next one."
    - name: routine-forget
      match: '^(?:delete|remove|forget|get\s+rid\s+of)\s+(?:the\s+|my\s+)?(?P<which>.+?)\s+routine$'
      tool: pulsar.forget_routine
      args: { which: "{which}" }
      reply: "Deleted the routine."
    - name: routine-run
      match: '^(?:run|start|do)\s+(?:the\s+|my\s+)?(?P<skill>.+?)\s+routine$'
      tool: morpho.run
      args: { skill: "{skill}" }
      reply: "Running {skill}."
    # Swallowtail: a release's field checks, run in your home once it's live (config/checks/).
    - name: checks-report
      match: '^(?:(?:show|open)\s+(?:me\s+)?)?(?:the\s+)?(?:field\s+)?(?:checks|check\s+report)$|^how\s+did\s+(?:the\s+)?(?:(?:last|latest)\s+release(?:''s)?\s+|release\s+)?(?:field\s+)?checks\s+go\??$|^did\s+the\s+(?:last|latest)\s+release\s+pass(?:\s+its\s+checks)?\??$|^what\s+failed\s+in\s+the\s+(?:last|latest)\s+release\??$'
      tool: swallowtail.checks
      args: {}
    - name: checks-run-all
      match: '^(?:run|redo|rerun|re-run)\s+all\s+(?:of\s+)?(?:the\s+)?(?:field\s+)?(?:checks|tests)(?:\s+again)?$'
      tool: swallowtail.run
      args: { which: "all" }
    - name: checks-run
      match: '^(?:run|redo|rerun|re-run)\s+(?:the\s+)?(?:field\s+)?(?:checks|tests)(?:\s+again)?$|^(?:run|redo|rerun|re-run)\s+(?:the\s+)?(?:last|latest)\s+release(?:''s)?\s+(?:field\s+)?(?:checks|tests)$'
      tool: swallowtail.run
      args: { which: "latest" }
    - name: checks-run-named
      match: '^(?:run|redo|rerun|re-run)\s+(?:the\s+|my\s+)?(?P<which>[\w'' ().-]+?)\s+(?:field\s+)?(?:checks|tests)(?:\s+again)?$'
      tool: swallowtail.run
      args: { which: "{which}" }
    - name: checks-start
      match: '^(?:start|begin)\s+(?:the\s+)?(?:field\s+)?(?:checks|tests)$|^(?:go\s+ahead\s+and\s+)?(?:run|start|do)\s+the\s+checks\s+that\s+act$'
      tool: swallowtail.start
      args: {}
    - name: notices
      match: '^(?:(?:show|list|open)\s+(?:me\s+)?)?(?:my\s+|the\s+|your\s+|any\s+)?(?:notices|alerts|warnings)\??$|^(?:is\s+there\s+)?any(?:thing)?\s+(?:i\s+should\s+know(?:\s+about)?|worth\s+knowing|wrong\s+at\s+home|to\s+worry\s+about)\??$|^what\s+(?:are\s+you|do\s+you)\s+watch(?:ing)?(?:\s+for)?\??$|^any\s+(?:alerts|notices|warnings)\??$'
      tool: pulsar.notices
      args: {}
      reply: "Here's what I'm watching."
    # Admiral's engine (Phase 9): once, later. First in the list, so "turn off the lights in 20 minutes" is never
    # taken as "turn off the lights" now. The time is read by code and the command settled when he asks.
    - name: schedule-remind
      match: '^(?P<say>remind\s+me\s+.+)$'
      tool: admiral.schedule
      args: { say: "{say}" }
      reply: "Setting that reminder."
    - name: schedule-time-first
      match: '^(?P<say>(?:in\s+(?:\d+(?:\.\d+)?|an?|half\s+an|a\s+couple\s+of|a\s+few|one|two|three|four|five|ten|fifteen|twenty|thirty|forty-five)\s+(?:seconds?|secs?|minutes?|mins?|hours?|hrs?|days?)|in\s+half\s+an\s+hour|at\s+(?:\d{1,2}(?::\d{2})?(?:\s*[ap]\.?m\.?)?|noon|midnight)|tomorrow|tonight|this\s+(?:morning|afternoon|evening)|(?:on\s+|this\s+|next\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)day)(?:\s+(?:at|in)\s+[\w:. ]+?)?,?\s+(?!(?:at|in|on)\b)(?![ap]\.?m\.?$)[a-z].*)$'
      tool: admiral.schedule
      args: { say: "{say}" }
      reply: "Scheduling that."
    - name: schedule-time-last
      match: '^(?!(?:what|when|where|who|why|how|is|are|was|were|do|does|did|can|could|will|would|should|which)\b)(?P<say>.+?\s+(?:in\s+(?:\d+(?:\.\d+)?|an?|half\s+an|a\s+couple\s+of|a\s+few|one|two|three|four|five|ten|fifteen|twenty|thirty|forty-five)\s+(?:seconds?|secs?|minutes?|mins?|hours?|hrs?)|in\s+half\s+an\s+hour|at\s+(?:\d{1,2}(?::\d{2})?\s*[ap]\.?m\.?|\d{1,2}:\d{2}|noon|midnight)|(?:tomorrow|tonight|(?:on\s+)?(?:mon|tues|wednes|thurs|fri|satur|sun)day)(?:\s+(?:morning|afternoon|evening|night))?\s+at\s+\d{1,2}(?::\d{2})?(?:\s*[ap]\.?m\.?)?))$'
      tool: admiral.schedule
      args: { say: "{say}" }
      reply: "Scheduling that."
    - name: schedule-list
      match: '^(?:what(?:''s|s| is)|show(?: me)?|list)\s+(?:my\s+|the\s+)?(?:scheduled(?:\s+(?:stuff|things|jobs|tasks|actions))?|reminders|timers)\??$|^what(?:''s|s| is)\s+scheduled\??$|^what\s+(?:have|did)\s+i\s+scheduled\??$|^my\s+(?:reminders|schedule)$'
      tool: admiral.scheduled
      args: {}
      reply: "Here's what's scheduled."
    - name: schedule-cancel
      match: '^(?:cancel|unschedule|delete|remove|forget)\s+(?:the\s+|my\s+|that\s+)?(?P<which>(?:.+\s+)?(?:reminder|reminders|timer|one|scheduled\s+\w+)(?:\s+.+)?)$'
      tool: admiral.unschedule
      args: { which: "{which}" }
      reply: "Cancelling that."
    # Every action has a fast path (so nothing's out of reach when the model isn't). These come before the general patterns they'd fall into: computers, sending, sound, releases.
    - name: node-screen-power
      match: '^turn\s+(?P<state>off|on)\s+(?:the\s+)?(?:screen|monitor|display)\s+(?:on|of)\s+(?:the\s+|my\s+)?(?P<target>.+)$|^turn\s+(?:the\s+|my\s+)?(?P<target2>.+?)(?:''s|s'')\s+(?:screen|monitor|display)\s+(?P<state2>off|on)$'
      tool: constellation.power
      args: { action: "screen_{state}{state2}", target: "{target}{target2}" }
      reply: "Turning that screen {state}{state2}."
    - name: node-lock
      match: '^lock\s+(?:the\s+|my\s+)?(?:screen\s+on\s+(?:the\s+|my\s+)?)?(?P<target>(?:.*?\s)?(?:pc|computer|laptop|desktop|workstation))(?:''s\s+screen|\s+screen)?$|^lock\s+(?:the\s+|my\s+)?(?P<target2>.+?)(?:''s|s'')?\s+screen$'
      tool: constellation.power
      args: { action: lock, target: "{target}{target2}" }
      reply: "Locking it."
    - name: node-wake
      match: '^wake\s+(?:up\s+)?(?:the\s+|my\s+)?(?P<target>(?!me\b|us\b|up\b).+?)(?:\s+up)?$|^turn\s+on\s+(?:the\s+|my\s+)?(?P<target2>(?:.*?\s)?(?:pc|computer|laptop|desktop|workstation))$'
      tool: constellation.wake
      args: { target: "{target}{target2}" }
      reply: "Waking it."
    - name: node-sleep
      match: '^put\s+(?:the\s+|my\s+)?(?P<target>.+?)\s+to\s+sleep$|^sleep\s+(?:the\s+|my\s+)?(?P<target2>(?!timer\b).+)$'
      tool: constellation.power
      args: { action: sleep, target: "{target}{target2}" }
      reply: "Putting it to sleep."
    - name: node-idle
      match: '^how\s+long\s+has\s+(?:the\s+|my\s+)?(?P<target>.+?)\s+been\s+idle\??$|^is\s+(?:anyone|someone)\s+(?:using|on)\s+(?:the\s+|my\s+)?(?P<target2>.+?)\??$'
      tool: constellation.power
      args: { action: idle, target: "{target}{target2}" }
      reply: "Checking."
    - name: node-restart
      match: '^(?:restart|reboot)\s+(?:the\s+|my\s+)?(?!(?:it|this|that|video|movie|song|episode|show|track|music|spotify|playback|the\s+(?:video|movie|song|episode|show|music|plan))\b)(?P<target>.+?)$'
      tool: constellation.restart
      args: { action: restart, target: "{target}" }
      reply: 'Restarting it (I''ll ask you first).'
    - name: node-shutdown
      match: '^(?:shut\s*down|power\s+(?:off|down))\s+(?:the\s+|my\s+)?(?P<target>.+?)$'
      tool: constellation.restart
      args: { action: shutdown, target: "{target}" }
      reply: 'Shutting it down (I''ll ask you first).'
    - name: node-diagnose
      match: '^(?:what(?:''s|s| is)\s+wrong\s+with|diagnose|troubleshoot)\s+(?:the\s+|my\s+)?(?P<target>.+?)\??$'
      tool: constellation.diagnose
      args: { target: "{target}" }
      reply: 'Checking what''s wrong.'
    - name: node-watch
      match: '^(?:show\s+me|let\s+me\s+see|stream|watch)\s+(?:the\s+|my\s+)?(?P<target>.+?)(?:''s|s'')?\s+screen(?:\s+live)?$|^(?:watch|show\s+me)\s+(?:the\s+|my\s+)?(?P<target2>.+?)\s+live$|^let\s+me\s+see\s+what\s+you(?:''re|\s+are)\s+doing(?:\s+on\s+(?:the\s+|my\s+)?(?P<target3>.+?))?$'
      tool: constellation.watch
      args: { target: "{target}{target2}{target3}" }
      reply: "Here it is, live."
    - name: node-screens
      match: '^what(?:''s|s| is)\s+on\s+(?:all\s+)?(?:my|the)\s+(?:screens|displays)\??$|^(?:show|list)\s+(?:me\s+)?(?:my\s+|the\s+)?(?:screens|displays)$'
      tool: constellation.screens
      args: {}
      reply: 'Here''s what''s on your screens.'
    - name: send-panel
      match: '^(?:(?:send|move|show)\s+(?:panel\s+(?P<panel>\d{1,3})|(?:this|that)(?:\s+panel)?|it)|put\s+(?:panel\s+(?P<panel2>\d{1,3})|(?:this|that)\s+panel))\s+(?:to|on|onto|over\s+to)\s+(?:the\s+|my\s+)?(?P<to>.+?)$'
      tool: constellation.send
      args: { panel: "{panel}{panel2}", to: "{to}" }
      reply: "Sending it."
    - name: send-link
      match: '^send\s+(?P<url>https?://\S+)\s+to\s+(?:the\s+|my\s+)?(?P<to>.+?)$'
      tool: constellation.send
      args: { url: "{url}", to: "{to}" }
      reply: "Sending the link."
    - name: send-note
      match: '^send\s+(?:a\s+)?note\s+to\s+(?:the\s+|my\s+)?(?P<to>.+?)\s+(?:saying|that\s+says)\s+(?P<text>.+)$'
      tool: constellation.send
      args: { text: "{text}", to: "{to}" }
      reply: "Sending the note."
    - name: node-sound-level
      match: '^(?:set\s+)?(?:the\s+)?(?:sound|system\s+volume|computer\s+volume|speaker\s+volume)\s+(?:on|of|for)\s+(?:the\s+|my\s+)?(?P<target>.+?)\s+to\s+(?P<level>\d{1,3})\s*(?:%|percent)?$'
      tool: constellation.sound
      args: { action: set, level: "{level}", target: "{target}" }
      reply: "Setting the sound."
    - name: node-sound-step
      match: '^(?:turn\s+)?(?:the\s+)?(?:sound|system\s+volume|computer\s+volume)\s+(?P<action>up|down)\s+on\s+(?:the\s+|my\s+)?(?P<target>.+)$'
      tool: constellation.sound
      args: { action: "{action}", target: "{target}" }
      reply: "Turning it {action}."
    - name: node-sound-mute
      match: '^(?P<action>mute|unmute)\s+(?:the\s+)?(?:sound|audio|speakers?)\s+on\s+(?:the\s+|my\s+)?(?P<target>.+)$'
      tool: constellation.sound
      args: { action: "{action}", target: "{target}" }
      reply: "Done."
    - name: node-sound-get
      match: '^(?:what(?:''s|s| is)\s+the\s+sound\s+(?:level\s+)?(?:on|of)|how\s+loud\s+is)\s+(?:the\s+|my\s+)?(?P<target>.+?)\??$'
      tool: constellation.sound
      args: { action: get, target: "{target}" }
      reply: "Checking the sound."
    - name: node-sound-outputs
      match: '^(?:what|which)\s+(?:speakers|outputs|audio\s+outputs|sound\s+outputs)\s+(?:does|has)\s+(?:the\s+|my\s+)?(?P<target>.+?)(?:\s+have)?\??$'
      tool: constellation.sound
      args: { action: outputs, target: "{target}" }
      reply: "Here are its outputs."
    - name: node-sound-output
      match: '^(?:play|send|switch)\s+(?:the\s+)?(?:sound|audio)\s+(?:on\s+(?:the\s+|my\s+)?(?P<target>.+?)\s+)?(?:through|to|out\s+of)\s+(?:the\s+|my\s+)?(?P<device>.+?)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target2>.+?))?$'
      tool: constellation.sound
      args: { action: output, device: "{device}", target: "{target}{target2}" }
      reply: "Switching the sound."
    - name: screen-submit
      match: '^submit\s+(?:the\s+form|it|that|this)(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.submit
      args: { target: "{target}" }
      reply: 'Submitting it (I''ll ask you first).'
    - name: node-logins
      match: '^(?:what|which)\s+(?:sites|logins|accounts)\s+(?:are|am\s+i)\s+(?:saved|signed\s+in|logged\s+in)\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?)\??$|^(?:show|list)\s+(?:me\s+)?(?:the\s+)?(?:saved\s+)?logins\s+on\s+(?:the\s+|my\s+)?(?P<target2>.+?)$'
      tool: constellation.logins
      args: { target: "{target}{target2}" }
      reply: "Here are its saved logins."
    - name: node-kill
      match: '^kill\s+(?:the\s+)?process(?:es)?\s+(?P<name>.+?)\s+(?:on|from)\s+(?:the\s+|my\s+)?(?P<target>.+?)$'
      tool: constellation.kill_process
      args: { name: "{name}", target: "{target}" }
      reply: 'Ending it (I''ll ask you first).'
    - name: spotify-speaker
      match: '^make\s+(?:the\s+|my\s+)?(?P<target>.+?)\s+a\s+spotify\s+speaker$|^(?:set\s+up|install)\s+(?:spotify(?:\s+connect)?|librespot)\s+on\s+(?:the\s+|my\s+)?(?P<target2>.+?)$'
      tool: quasar.speaker
      args: { target: "{target}{target2}" }
      reply: 'Setting it up as a Spotify speaker (I''ll ask you first).'
    - name: release-rollback
      match: '^(?:roll\s*back|undo)\s+(?:the\s+|your\s+|my\s+)?(?:last\s+|latest\s+)?(?:release|update|deploy(?:ment)?)$|^roll\s*back(?:\s+(?:yourself|aurelia))?$'
      tool: chrysalis.rollback
      args: {}
      reply: 'Rolling back to the last good release (I''ll ask you first).'
    - name: release-approve
      match: '^approve\s+(?:the\s+)?release\s+#?(?P<id>\d+)$'
      tool: chrysalis.approve
      args: { release_id: "{id}" }
      reply: 'Approving release {id} (I''ll ask you first).'
    # Morpho (Phase 9): skills and earned trust. (His skills' own phrases are fast paths too, checked first.)
    - name: skills-list
      match: '^(?:(?:show|list)\s+(?:me\s+)?(?:my|your|the)\s+skills|what\s+skills\s+do\s+(?:you|i)\s+have|my\s+skills)\??$'
      tool: morpho.skills
      args: {}
      reply: "Here are your skills."
    - name: skill-keep
      match: '^(?:keep|save|remember)\s+(?:that|this|it|the\s+last\s+plan|that\s+plan|this\s+plan)\s+as\s+a\s+skill$'
      tool: morpho.keep
      args: {}
      reply: "Drafting it as a skill."
    - name: skill-run
      match: '^(?:run|use|do)\s+(?:the\s+|my\s+)?skill\s+(?P<skill>.+?)$'
      tool: morpho.run
      args: { skill: "{skill}" }
      reply: "Running {skill}."
    - name: skill-retire
      match: '^(?:retire|stop\s+using)\s+(?:the\s+|my\s+)?skill\s+(?P<skill>.+?)$'
      tool: morpho.retire
      args: { skill: "{skill}" }
      reply: "Retiring {skill}."
    - name: skill-rollback
      match: '^(?:roll\s*back|undo\s+the\s+new\s+version\s+of)\s+(?:the\s+|my\s+)?skill\s+(?P<skill>.+?)$'
      tool: morpho.rollback
      args: { skill: "{skill}" }
      reply: "Going back a version."
    - name: trusts
      match: '^(?:what\s+do\s+you\s+do\s+without\s+asking(?:\s+me)?|(?:show|list)\s+(?:me\s+)?(?:my\s+|the\s+)?trusted\s+actions|what\s+have\s+i\s+trusted\s+you\s+(?:with|to\s+do))\??$'
      tool: morpho.trusts
      args: {}
      reply: "Here's what I do without asking."
    - name: trust-revoke
      match: '^(?:always\s+)?ask\s+me\s+(?:again\s+|first\s+)?before\s+(?P<which>.+?)$'
      tool: morpho.revoke
      args: { which: "{which}" }
      reply: "I'll ask first again."
    - name: echo
      match: '^(?:probe\s+)?echo\s+(?P<message>.+?)(?:\s+(?P<steps>\d+)\s+times)?$'
      tool: probe.echo
      args: { message: "{message}", steps: "{steps|3}" }
      reply: 'Echoing "{message}".'
    # Orbit (smart home). Unlock is governed as a "change": it always asks you first.
    - name: home-status
      match: '^(?:(?:what(?:''s|s| is)|how(?:''s|s| is)|show(?: me)?|check)\s+)?(?:the\s+)?(?:(?:status|state)\s+of\s+)?(?:(?:my|the)\s+)?(?:home|house|apartment|place)(?:\s+(?:status|state))?$'
      tool: orbit.status
      args: {}
      reply: "Here's the home."
    - name: functions-status
      match: '^(?:(?:what(?:''s|s| is| are)|how(?:''s|s| is| are)|show(?: me)?|list|check)\s+)?(?:the\s+)?(?:(?:status|state|health)\s+of\s+)?(?:all\s+)?(?:your|my|aurelia''s|the)\s+functions(?:\s+(?:status|doing))?$'
      tool: probe.functions
      args: {}
      reply: "Here are my functions."
    - name: function-detail
      match: '^(?:(?:tell me about|describe|details (?:on|for|of)|status of|show(?: me)?|how(?:''s|s| is))\s+)?(?:the\s+|your\s+)?(?P<name>[a-z][\w-]*)\s+function(?:\s+(?:status|doing|details))?$'
      tool: probe.function
      args: { name: "{name}" }
      reply: "Here's the {name} function."
    # YouTube (Quasar step 3): his feeds and search as posters; a tapped poster plays by its id.
    # Notifications on his phone (the installed app).
    - name: notify-test
      match: '^(?:send me a |send a )?test notification|test (?:my )?notifications$'
      tool: constellation.notify
      args: { action: test }
      reply: "Sending a test notification."
    - name: notify-status
      match: '^(?:which|what) devices (?:have|get) notifications(?: on)?\??$|^notification status$'
      tool: constellation.notify
      args: { action: status }
      reply: "Here's where notifications are on."
    # My monthly model budget (llm.monthly_token_cap): used, left, pace, and when it resets.
    - name: budget
      match: '^(?:(?:check|show(?: me)?|what(?:''s|s| is)|how(?:''s|s| is))\s+)?(?:my\s+|the\s+|your\s+)?(?:monthly\s+)?(?:token|model|ai|llm|claude|anthropic)\s+(?:cap|budget|usage|limit)(?:\s+(?:status|left|looking))?\??$|^(?:(?:check|show(?: me)?|what(?:''s|s| is))\s+)?(?:my\s+|the\s+|your\s+)?monthly\s+(?:cap|budget|limit|usage)\??$|^how (?:much|many tokens) (?:of (?:my|your|the) (?:monthly )?(?:token |model )?(?:budget|cap) )?(?:is left|(?:do|have) (?:i|we|you) (?:got )?(?:left|used))(?: this month)?\??$|^when (?:does|will) (?:my|the|your) (?:monthly )?(?:token |model )?(?:cap|budget|limit) (?:reset|refresh|renew|start over)\??$'
      tool: mnemosyne.budget
      args: {}
      reply: "Here's this month's budget."
    # Admiral (Phase 9): a request that takes several steps becomes a checked plan (its panel shows it run).
    - name: plan-make
      match: '^(?:make|build|draw up|put together|come up with)\s+(?:me\s+)?a\s+plan\s+(?:to|for)\s+(?P<goal>.+?)\.?$|^plan(?::|\s+out|\s+how\s+to)\s+(?P<goal2>.+?)\.?$'
      tool: admiral.plan
      args: { goal: "{goal}{goal2}" }
      reply: "Making a plan for that."
    - name: plan-list
      match: '^(?:show|list)\s+(?:me\s+)?(?:my\s+)?(?:recent\s+)?plans\??$|^what (?:are )?my plans\??$|^how(?:''s| is) (?:the|my) plan(?: going| doing)?\??$'
      tool: admiral.plans
      args: {}
      reply: "Here are your plans."
    - name: plan-stop
      match: '^(?:stop|cancel|abort)\s+(?:the\s+|my\s+|that\s+)?plan\.?$'
      tool: admiral.stop
      args: {}
      reply: "Stopping the plan."
    # Spotify (Quasar step 4). "Play X on spotify (on the TV)" is media-play-title (on: "spotify ...").
    - name: spotify-control
      match: '^(?P<action>pause|resume|skip|next|previous)(?: the)?(?: song| track| music)? (?:on|in) spotify$|^(?P<action2>pause|resume) spotify$'
      tool: quasar.spotify
      args: { action: "{action}{action2}" }
      reply: "On Spotify."
    - name: spotify-now
      match: '^what(?:''s| is) (?:playing )?on spotify\??$'
      tool: quasar.spotify
      args: { action: now }
      reply: "Here's what Spotify is playing."
    - name: spotify-volume
      match: '^spotify volume (?:to )?(?P<level>\d{1,3})%?$'
      tool: quasar.spotify
      args: { action: volume, level: "{level}" }
      reply: "Spotify volume {level}."
    - name: spotify-devices
      match: '^(?:my |show(?: me)? my |list my )?spotify (?:speakers|devices)\??$'
      tool: quasar.spotify
      args: { action: devices }
      reply: "Here are your Spotify speakers."
    - name: youtube-play-id
      match: '^play the youtube video (?P<id>yt:[A-Za-z0-9_-]{11})(?:\s+on\s+(?:the |my )?(?P<on>.+?))?$'
      tool: quasar.play
      args: { id: "{id}", "on": "{on|}" }
      reply: "On it."
    - name: youtube-feed
      match: '^(?:what(?:''s| is) on |show(?: me)? |open )?(?:my )?youtube(?: (?P<feed>home(?: ?page)?|feed|recommendations|subscriptions|subs|watch later|history))?(?: page)?\??$'
      tool: quasar.youtube
      args: { feed: "{feed|home}" }
      reply: "Here's your YouTube."
    - name: youtube-subs
      match: '^(?:anything new|what(?:''s| is) new) (?:from|on) my (?:youtube )?subscriptions\??$'
      tool: quasar.youtube
      args: { feed: subscriptions }
      reply: "Here's what's new from your subscriptions."
    - name: youtube-later
      match: '^(?:show(?: me)? |open )?my watch later\??$'
      tool: quasar.youtube
      args: { feed: watch_later }
      reply: "Here's your Watch Later."
    - name: youtube-search
      match: '^(?:(?:search|find|look up)\s+(?:on\s+)?youtube\s+(?:for\s+)?(?P<q>.+)|(?:search for|search|find|look up)\s+(?P<q2>.+?)\s+on youtube|youtube\s+(?P<q3>.+))$'
      tool: quasar.youtube
      args: { feed: search, query: "{q}{q2}{q3}" }
      reply: "Here's what YouTube has."
    # The web (Nebula). "Look up …" goes to the model, so she searches, reads and answers.
    - name: web-search
      match: '^(?:search (?:the web |online |google )?for|google|web search(?: for)?)\s+(?P<q>.+)$'
      tool: nebula.search
      args: { query: "{q}" }
      reply: "Here's what I found."
    - name: read-url
      match: '^(?:read|summari[sz]e|what(?:''s| is) (?:on|at))\s+(?P<url>https?://\S+)$'
      tool: nebula.read
      args: { url: "{url}" }
      reply: "Here's the page."
    - name: download-url
      match: '^download\s+(?P<url>https?://\S+)$'
      tool: nebula.download
      args: { url: "{url}" }
      reply: "Downloading."
    # Constellation, step 4: the page on a screen running her shell ("on the …" names it; with no
    # name, the one screen running her shell). Clicking by description ("the second video") goes
    # through the model, which looks first and picks the number.
    - name: screen-sign-in
      match: '^(?:sign|log) (?:me )?in(?:to| to)? (?P<site>[\w .+-]+?) on (?:the |my )?(?P<target>.+?)$'
      tool: constellation.sign_in
      args: { site: "{site}", target: "{target}" }
      reply: "Signing in to {site}."
    - name: screen-look
      match: '^(?:what(?:''s| is) on|look at|show me|read) (?:the |my )?(?:(?P<target>.+?)(?:''s)? )?screen$'
      tool: constellation.look
      args: { target: "{target}" }
      reply: "Here's what's on it. Say \"click\" and a number."
    - name: screen-numbers
      match: '^(?:show|draw) (?:me )?(?:the )?numbers(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.look
      args: { target: "{target}" }
      reply: "Numbers are up. Say \"click\" and one."
    - name: screen-click
      match: '^(?:click|select|tap|press|choose|pick|open)\s+(?:on\s+)?(?:number\s+|#\s*)?(?P<n>\d{1,3})(?:\s+on\s+(?:the\s+|my\s+)?(?P<target>.+?))?$'
      tool: constellation.click
      args: { n: "{n}", target: "{target}" }
      reply: "Clicked {n}."
